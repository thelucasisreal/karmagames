  <g fill="#c48f4f"><rect x="40" y="440" width="50" height="10" rx="5"/><rect x="200" y="460" width="40" height="9" rx="4"/><rect x="380" y="440" width="50" height="10" rx="5"/><rect x="560" y="462" width="40" height="9" rx="4"/><rect x="700" y="440" width="50" height="10" rx="5"/></g>
