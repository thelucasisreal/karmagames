      <stop offset="0" stop-color="#ff8a3d"/><stop offset="0.6" stop-color="#ffc85a"/><stop offset="1" stop-color="#fff0a0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ceu)"/>
  <circle cx="400" cy="250" r="170" fill="#fff6c8" opacity="0.6"/>
  <path d="M0 330 Q150 280 300 320 T600 300 T800 310 V500 H0Z" fill="#8fdc6a"/>
