    <circle cx="60" cy="-95" r="58" fill="#ffffff" stroke-width="8"/>
    <g fill="#ff3b4f" stroke-width="6"><circle cx="35" cy="-152" r="20"/><circle cx="64" cy="-162" r="24"/><circle cx="92" cy="-148" r="18"/></g>
    <circle cx="60" cy="-95" r="54" fill="#ffffff" stroke="none"/>
    <path d="M108 -110 L158 -92 L108 -72Z" fill="#ffb21f" stroke-width="6"/>
