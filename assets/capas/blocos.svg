<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4cff"/>
      <stop offset=".55" stop-color="#ff5fa8"/>
      <stop offset="1" stop-color="#ffb43a"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gI" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6f2ff"/><stop offset="1" stop-color="#1c9ad8"/></linearGradient>
    <linearGradient id="gO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset="1" stop-color="#f0a014"/></linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4b0ff"/><stop offset="1" stop-color="#8240e0"/></linearGradient>
    <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcff8a"/><stop offset="1" stop-color="#4fb02a"/></linearGradient>
    <linearGradient id="gZ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffaea2"/><stop offset="1" stop-color="#e03050"/></linearGradient>
    <linearGradient id="gJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c2ff"/><stop offset="1" stop-color="#3050e0"/></linearGradient>
    <linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf98"/><stop offset="1" stop-color="#e86a1a"/></linearGradient>
    <filter id="sombra" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="900">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#3a0a4a" flood-opacity=".38"/>
    </filter>
    <!-- um bloco brilhante de 56px -->
    <g id="b">
      <rect x="0" y="0" width="56" height="56" rx="12" stroke="#2a0a2a" stroke-width="6"/>
      <rect x="9" y="7" width="38" height="14" rx="7" fill="url(#brilho)"/>
      <circle cx="14" cy="13" r="3.5" fill="#fff"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <circle cx="400" cy="210" r="280" fill="url(#luz)"/>
  <g fill="#fff" opacity=".1">
    <circle cx="90" cy="430" r="150"/>
    <circle cx="730" cy="80" r="120"/>
  </g>

  <!-- brilhinhos -->
  <g fill="#fff">
    <path d="M150 90 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z"/>
    <path d="M660 250 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M110 250 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- pilha no chao -->
  <g filter="url(#sombra)">
    <g fill="url(#gJ)">
      <use href="#b" x="176" y="444"/><use href="#b" x="176" y="388"/><use href="#b" x="232" y="444"/><use href="#b" x="288" y="444"/>
    </g>
    <g fill="url(#gS)">
      <use href="#b" x="344" y="444"/><use href="#b" x="400" y="444"/><use href="#b" x="400" y="388"/><use href="#b" x="456" y="388"/><use href="#b" x="456" y="444"/>
    </g>
    <g fill="url(#gO)">
      <use href="#b" x="512" y="444"/><use href="#b" x="568" y="444"/><use href="#b" x="512" y="388"/><use href="#b" x="568" y="388"/>
    </g>
    <g fill="url(#gZ)">
      <use href="#b" x="232" y="388"/><use href="#b" x="288" y="388"/><use href="#b" x="288" y="332"/><use href="#b" x="344" y="332"/>
    </g>
    <g fill="url(#gL)">
      <use href="#b" x="512" y="332"/><use href="#b" x="568" y="332"/><use href="#b" x="568" y="276"/><use href="#b" x="624" y="388"/><use href="#b" x="624" y="444"/><use href="#b" x="624" y="332"/>
    </g>
  </g>

  <!-- linha completa brilhando -->
  <rect x="170" y="438" width="516" height="68" rx="16" fill="#fff" opacity=".22"/>
  <g fill="#fff"><path d="M150 452 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/><path d="M706 420 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/></g>

  <!-- I caindo com rastro -->
  <g opacity=".5" fill="#fff">
    <rect x="364" y="40" width="10" height="70" rx="5"/>
    <rect x="384" y="20" width="10" height="80" rx="5"/>
    <rect x="404" y="34" width="10" height="66" rx="5"/>
  </g>

  <!-- T heroi caindo, girando -->
  <g transform="translate(400 210) rotate(-12)" filter="url(#sombra)">
    <g fill="url(#gT)">
      <use href="#b" x="-84" y="-28"/><use href="#b" x="-28" y="-28"/><use href="#b" x="28" y="-28"/><use href="#b" x="-28" y="-84"/>
    </g>
    <!-- carinha -->
    <g transform="translate(0 0)">
      <ellipse cx="-11" cy="-2" rx="7" ry="9" fill="#fff" stroke="#2a0a2a" stroke-width="4"/>
      <ellipse cx="11" cy="-2" rx="7" ry="9" fill="#fff" stroke="#2a0a2a" stroke-width="4"/>
      <circle cx="-9" cy="0" r="4" fill="#2a0a2a"/>
      <circle cx="13" cy="0" r="4" fill="#2a0a2a"/>
      <path d="M-8 14 Q0 22 8 14" fill="none" stroke="#2a0a2a" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- I vertical na lateral esquerda -->
  <g transform="translate(78 70) rotate(10)" filter="url(#sombra)" fill="url(#gI)">
    <use href="#b" x="0" y="0"/><use href="#b" x="0" y="56"/><use href="#b" x="0" y="112"/><use href="#b" x="0" y="168"/>
  </g>
  <!-- S pequeno na direita -->
  <g transform="translate(640 120) rotate(-14) scale(.8)" filter="url(#sombra)" fill="url(#gS)">
    <use href="#b" x="56" y="0"/><use href="#b" x="112" y="0"/><use href="#b" x="0" y="56"/><use href="#b" x="56" y="56"/>
  </g>
</svg>
