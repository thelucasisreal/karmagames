<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ac8"/>
      <stop offset=".5" stop-color="#ff9a4a"/>
      <stop offset="1" stop-color="#ffe94a"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#ffd6a8"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ffb21a"/>
    </linearGradient>
    <linearGradient id="cor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8aa8"/>
      <stop offset="1" stop-color="#e8264a"/>
    </linearGradient>
    <linearGradient id="real" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa08a"/>
      <stop offset="1" stop-color="#5f6452"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ff7a"/>
      <stop offset="1" stop-color="#7fd34a"/>
    </linearGradient>
    <filter id="sombra" filterUnits="userSpaceOnUse" x="-900" y="-700" width="2600" height="1900">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#5a1030" flood-opacity=".38"/>
    </filter>
    <g id="coracao">
      <path d="M0 18 C-30 -4 -26 -30 -10 -30 C-3 -30 0 -24 0 -20 C0 -24 3 -30 10 -30 C26 -30 30 -4 0 18Z" fill="url(#cor)" stroke="#2a0a2a" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="-11" cy="-19" rx="6" ry="3.5" fill="#fff" opacity=".75" transform="rotate(-30 -11 -19)"/>
    </g>
    <path id="brilho" d="M0 -16 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z" fill="#fff"/>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <circle cx="400" cy="230" r="270" fill="url(#luz)"/>

  <!-- grade de fundo (o "grid") -->
  <g stroke="#fff" stroke-width="3" opacity=".18">
    <path d="M0 125 H800 M0 250 H800 M0 375 H800 M200 0 V500 M400 0 V500 M600 0 V500"/>
  </g>

  <!-- ring light -->
  <g filter="url(#sombra)">
    <path d="M140 300 L140 470 M110 470 H170" stroke="#2a0a2a" stroke-width="16" stroke-linecap="round"/>
    <path d="M140 300 L140 470" stroke="#6b6f7c" stroke-width="7" stroke-linecap="round"/>
    <circle cx="140" cy="215" r="88" fill="none" stroke="#2a0a2a" stroke-width="40"/>
    <circle cx="140" cy="215" r="88" fill="none" stroke="url(#anel)" stroke-width="26"/>
    <path d="M80 160 Q100 138 128 130" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <circle cx="140" cy="215" r="58" fill="#fff8d6" opacity=".35"/>
  </g>

  <!-- card dos bastidores (atrás) -->
  <g transform="translate(520 250) rotate(13)" filter="url(#sombra)">
    <rect x="-118" y="-150" width="236" height="290" rx="14" fill="#fbfaf6" stroke="#2a0a2a" stroke-width="8"/>
    <rect x="-100" y="-132" width="200" height="200" rx="6" fill="url(#real)" stroke="#2a0a2a" stroke-width="5"/>
    <!-- caixa de pizza -->
    <g transform="translate(-36 30) rotate(-8)">
      <rect x="-40" y="-14" width="80" height="26" rx="4" fill="#d9a35b" stroke="#2a0a2a" stroke-width="5"/>
      <path d="M-40 -14 L-30 -30 H34 L40 -14" fill="#e8b874" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- meia -->
    <path d="M40 -70 L52 -20 Q56 -4 40 2 L18 6 Q6 4 10 -8 Q16 -16 30 -20 L22 -66Z" fill="#fff" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M22 -60 L40 -64" stroke="#ff5ac8" stroke-width="6" stroke-linecap="round"/>
    <!-- mancha -->
    <path d="M-80 -110 q20 -10 34 4 q14 -8 22 8 q-4 18 -24 14 q-18 12 -30 -4 q-14 -6 -2 -22z" fill="#4d5242" opacity=".7"/>
    <!-- fita -->
    <rect x="-40" y="-166" width="80" height="26" rx="3" fill="#fff0aa" stroke="#2a0a2a" stroke-width="4" opacity=".95" transform="rotate(-4)"/>
    <path d="M-80 100 H40 M-80 118 H10" stroke="#9a8f7a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- celular com o post perfeito -->
  <g transform="translate(372 248) rotate(-7)" filter="url(#sombra)">
    <rect x="-118" y="-212" width="236" height="424" rx="34" fill="#2a0a2a"/>
    <rect x="-104" y="-196" width="208" height="392" rx="22" fill="#fff"/>
    <rect x="-30" y="-204" width="60" height="12" rx="6" fill="#2a0a2a"/>
    <!-- cabeçalho -->
    <circle cx="-74" cy="-158" r="17" fill="#ffc23a" stroke="#ff3d8b" stroke-width="5"/>
    <circle cx="-79" cy="-161" r="2.6" fill="#2a0a2a"/><circle cx="-69" cy="-161" r="2.6" fill="#2a0a2a"/>
    <path d="M-80 -152 Q-74 -146 -68 -152" fill="none" stroke="#2a0a2a" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="-48" y="-166" width="78" height="9" rx="4.5" fill="#2a0a2a"/>
    <rect x="-48" y="-152" width="52" height="7" rx="3.5" fill="#b9bdc8"/>
    <!-- foto -->
    <rect x="-104" y="-130" width="208" height="208" fill="url(#ceu)"/>
    <circle cx="44" cy="-82" r="30" fill="url(#sol)" stroke="#2a0a2a" stroke-width="6"/>
    <circle cx="35" cy="-87" r="3.5" fill="#2a0a2a"/><circle cx="53" cy="-87" r="3.5" fill="#2a0a2a"/>
    <path d="M33 -74 Q44 -64 55 -74" fill="none" stroke="#2a0a2a" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 -100 Q36 -108 44 -110" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <!-- planta + caneca -->
    <path d="M-104 78 V22 Q-40 6 104 30 V78Z" fill="#ffe2c2"/>
    <path d="M-62 30 q-26 -30 -6 -54 q8 22 6 54 M-62 30 q20 -34 44 -36 q-16 26 -44 36" fill="url(#verde)" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-80 30 H-44 L-50 62 H-74Z" fill="#ff7a5a" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="10" y="20" width="42" height="40" rx="8" fill="#fff" stroke="#2a0a2a" stroke-width="5"/>
    <path d="M52 30 q16 2 0 20" fill="none" stroke="#2a0a2a" stroke-width="5"/>
    <path d="M22 10 q-6 -10 2 -18 M36 10 q-6 -10 2 -18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- ações -->
    <use href="#coracao" transform="translate(-78 112) scale(.55)"/>
    <circle cx="-34" cy="110" r="12" fill="none" stroke="#2a0a2a" stroke-width="5"/>
    <path d="M-12 102 L14 110 L-12 118 Z" fill="none" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-88" y="136" width="96" height="9" rx="4.5" fill="#2a0a2a"/>
    <rect x="-88" y="152" width="150" height="7" rx="3.5" fill="#b9bdc8"/>
    <rect x="-88" y="166" width="118" height="7" rx="3.5" fill="#7aa6ff"/>
  </g>

  <!-- seta de virar -->
  <g filter="url(#sombra)">
    <path d="M560 70 Q660 40 690 130" fill="none" stroke="#2a0a2a" stroke-width="22" stroke-linecap="round"/>
    <path d="M560 70 Q660 40 690 130" fill="none" stroke="#c8f13a" stroke-width="12" stroke-linecap="round"/>
    <path d="M664 122 L692 150 L712 112" fill="none" stroke="#2a0a2a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M664 122 L692 150 L712 112" fill="none" stroke="#c8f13a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- corações e notificações -->
  <g filter="url(#sombra)">
    <use href="#coracao" transform="translate(255 80) rotate(-14) scale(1.15)"/>
    <use href="#coracao" transform="translate(700 380) rotate(12) scale(1.3)"/>
    <use href="#coracao" transform="translate(60 420) rotate(-8) scale(.8)"/>
    <g transform="translate(250 395) rotate(-6)">
      <rect x="-46" y="-30" width="92" height="56" rx="20" fill="#fff" stroke="#2a0a2a" stroke-width="6"/>
      <path d="M-14 26 L-24 44 L4 26" fill="#fff" stroke="#2a0a2a" stroke-width="6" stroke-linejoin="round"/>
      <rect x="-30" y="-14" width="60" height="9" rx="4.5" fill="#ff5ac8"/>
      <rect x="-30" y="2" width="38" height="8" rx="4" fill="#b9bdc8"/>
    </g>
    <g transform="translate(740 225)">
      <circle r="30" fill="#ff3b30" stroke="#2a0a2a" stroke-width="6"/>
      <circle r="9" fill="#fff"/>
      <path d="M-14 -16 Q-6 -24 6 -24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    </g>
  </g>
  <g>
    <use href="#brilho" transform="translate(300 160) scale(1.1)"/>
    <use href="#brilho" transform="translate(640 300) scale(.9)"/>
    <use href="#brilho" transform="translate(470 60) scale(.8)"/>
    <use href="#brilho" transform="translate(60 80) scale(1.2)"/>
    <use href="#brilho" transform="translate(760 470) scale(.7)"/>
  </g>
</svg>
