<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2af0c0"/>
      <stop offset=".5" stop-color="#10b8c8"/>
      <stop offset="1" stop-color="#1268d8"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bola" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".5" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#ffc98a"/>
    </radialGradient>
    <linearGradient id="vermelha" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="1" stop-color="#e8304a"/>
    </linearGradient>
    <linearGradient id="amarela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ffb21f"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#06205a" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <!-- quadra -->
  <g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="8">
    <rect x="30" y="30" width="740" height="440" rx="20"/>
    <path d="M400 30 V470" stroke-dasharray="26 22" stroke-opacity=".5" stroke-width="10"/>
    <circle cx="400" cy="250" r="90"/>
  </g>
  <circle cx="420" cy="200" r="240" fill="url(#luz)"/>

  <!-- placar -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" font-size="64" fill="#fff" fill-opacity=".55">
    <text x="320" y="92">3</text>
    <text x="480" y="92">2</text>
  </g>

  <!-- raquete vermelha (esquerda) -->
  <g transform="translate(205 225) rotate(-8)" filter="url(#sombra)">
    <rect x="-24" y="-105" width="48" height="210" rx="24" fill="url(#vermelha)" stroke="#2a0a3a" stroke-width="8"/>
    <rect x="-12" y="-88" width="12" height="110" rx="6" fill="#fff" opacity=".55"/>
  </g>
  <!-- raquete amarela (direita) -->
  <g transform="translate(598 250) rotate(6)" filter="url(#sombra)">
    <rect x="-24" y="-105" width="48" height="210" rx="24" fill="url(#amarela)" stroke="#2a0a3a" stroke-width="8"/>
    <rect x="-12" y="-88" width="12" height="110" rx="6" fill="#fff" opacity=".6"/>
  </g>

  <!-- rastro da bola -->
  <circle cx="268" cy="290" r="40" fill="#fff" opacity=".18"/>
  <circle cx="318" cy="268" r="56" fill="#fff" opacity=".28"/>
  <circle cx="370" cy="248" r="70" fill="#fff" opacity=".4"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9">
    <path d="M262 220 h-30"/><path d="M250 340 h-26"/>
  </g>

  <!-- bola heroi -->
  <g transform="translate(430 225)" filter="url(#sombra)">
    <circle r="82" fill="url(#bola)" stroke="#2a0a3a" stroke-width="9"/>
    <g stroke="#2a0a3a" stroke-width="6">
      <ellipse cx="-4" cy="-14" rx="22" ry="27" fill="#fff"/>
      <ellipse cx="44" cy="-14" rx="20" ry="25" fill="#fff"/>
    </g>
    <circle cx="6" cy="-12" r="12" fill="#2a0a3a"/>
    <circle cx="52" cy="-12" r="11" fill="#2a0a3a"/>
    <circle cx="10" cy="-17" r="4" fill="#fff"/>
    <circle cx="56" cy="-17" r="4" fill="#fff"/>
    <path d="M-24 -50 L10 -40 M28 -42 L62 -48" stroke="#2a0a3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 26 Q26 56 54 24 Q26 34 0 26Z" fill="#e8304a" stroke="#2a0a3a" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="-30" cy="18" rx="12" ry="7" fill="#ff7a8a" opacity=".6"/>
    <ellipse cx="-40" cy="-46" rx="16" ry="8" fill="#fff" transform="rotate(-35 -40 -46)"/>
  </g>

  <!-- impacto -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M540 170 l20 -18"/><path d="M548 210 h26"/><path d="M540 250 l20 16"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke" font-size="112">
    <text x="400" y="481" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#0a1a5a" stroke="#0a1a5a" stroke-width="20">Pong</text>
    <text x="400" y="472" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#0a1a5a" stroke-width="18">Pong</text>
  </g>
</svg>
