<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fb8ff"/>
      <stop offset=".6" stop-color="#7fe0ff"/>
      <stop offset="1" stop-color="#d4f7ff"/>
    </linearGradient>
    <radialGradient id="sol" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cano" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fbf3f"/>
      <stop offset=".35" stop-color="#8af06a"/>
      <stop offset="1" stop-color="#2a9a35"/>
    </linearGradient>
    <radialGradient id="corpo" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#f3ff7a"/>
      <stop offset=".55" stop-color="#c8f13a"/>
      <stop offset="1" stop-color="#86b51a"/>
    </radialGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#06306b" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#ceu)"/>
  <circle cx="640" cy="90" r="150" fill="url(#sol)"/>
  <circle cx="640" cy="90" r="44" fill="#fff3a0"/>

  <!-- nuvens -->
  <g fill="#fff" opacity=".9">
    <g transform="translate(120 110)"><circle r="30"/><circle cx="34" cy="-12" r="38"/><circle cx="74" r="28"/><rect x="0" y="0" width="74" height="28"/></g>
    <g transform="translate(470 60) scale(.7)"><circle r="30"/><circle cx="34" cy="-12" r="38"/><circle cx="74" r="28"/><rect x="0" y="0" width="74" height="28"/></g>
    <g transform="translate(560 300) scale(.9)" opacity=".7"><circle r="30"/><circle cx="34" cy="-12" r="38"/><circle cx="74" r="28"/><rect x="0" y="0" width="74" height="28"/></g>
  </g>

  <!-- colinas -->
  <path d="M0 410 Q120 340 250 400 T520 395 T800 380 V500 H0Z" fill="#6fdc8c"/>
  <path d="M0 450 Q160 400 330 445 T650 440 T800 430 V500 H0Z" fill="#3fbf6a"/>

  <!-- canos -->
  <g stroke="#14421f" stroke-width="5" stroke-linejoin="round">
    <rect x="28" y="-10" width="86" height="190" fill="url(#cano)"/>
    <rect x="18" y="160" width="106" height="40" rx="6" fill="url(#cano)"/>
    <rect x="28" y="345" width="86" height="170" fill="url(#cano)"/>
    <rect x="18" y="325" width="106" height="40" rx="6" fill="url(#cano)"/>

    <rect x="686" y="-10" width="86" height="120" fill="url(#cano)"/>
    <rect x="676" y="90" width="106" height="40" rx="6" fill="url(#cano)"/>
    <rect x="686" y="290" width="86" height="220" fill="url(#cano)"/>
    <rect x="676" y="270" width="106" height="40" rx="6" fill="url(#cano)"/>
  </g>
  <g fill="#fff" opacity=".35">
    <rect x="44" y="0" width="10" height="160"/><rect x="34" y="166" width="10" height="28" rx="3"/>
    <rect x="44" y="365" width="10" height="140"/><rect x="34" y="331" width="10" height="28" rx="3"/>
    <rect x="702" y="0" width="10" height="90"/><rect x="692" y="96" width="10" height="28" rx="3"/>
    <rect x="702" y="310" width="10" height="190"/><rect x="692" y="276" width="10" height="28" rx="3"/>
  </g>

  <!-- rastro de vento -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85" fill="none">
    <path d="M190 170 H250"/>
    <path d="M175 215 H245"/>
    <path d="M195 260 H240"/>
  </g>

  <!-- passarinho -->
  <g transform="translate(410 200) rotate(-12)" filter="url(#sombra)">
    <g stroke="#1d2a08" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
      <!-- cauda -->
      <path d="M-112 -10 L-160 -40 L-150 0 L-165 30 Z" fill="#9fc12c"/>
      <!-- corpo -->
      <ellipse cx="0" cy="0" rx="122" ry="104" fill="url(#corpo)"/>
      <!-- barriga -->
      <path d="M-70 50 Q0 110 80 55 Q40 92 -10 92 Q-50 88 -70 50Z" fill="#f6ffc6" stroke="none"/>
      <!-- bico -->
      <path d="M100 -2 Q160 4 166 26 Q130 38 98 34 Z" fill="#ff8a3d"/>
      <path d="M98 34 Q130 40 150 34 Q130 60 96 52 Z" fill="#ff6b5a"/>
      <!-- asa batendo -->
      <path d="M5 -5 C-40 -80 -110 -130 -150 -112 C-162 -92 -138 -76 -124 -70 C-136 -56 -116 -42 -98 -42 C-104 -26 -80 -16 -62 -20 C-50 -2 -20 18 5 -5 Z" fill="#a8d62a"/>
      <!-- olho -->
      <ellipse cx="54" cy="-30" rx="40" ry="44" fill="#fff"/>
      <circle cx="68" cy="-26" r="20" fill="#1d2a08" stroke="none"/>
      <circle cx="76" cy="-34" r="7" fill="#fff" stroke="none"/>
      <!-- sobrancelha -->
      <path d="M24 -86 Q55 -98 88 -80" fill="none" stroke-width="9"/>
    </g>
    <!-- bochecha e brilho -->
    <ellipse cx="40" cy="30" rx="18" ry="11" fill="#ff8f8f" opacity=".7"/>
    <ellipse cx="-20" cy="-66" rx="22" ry="9" fill="#fff" opacity=".5" transform="rotate(-20 -20 -66)"/><path d="M-30 -30 Q-80 -70 -125 -98" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".5"/>
  </g>

  <!-- penas soltas -->
  <g fill="#c8f13a" stroke="#1d2a08" stroke-width="4">
    <ellipse cx="225" cy="320" rx="16" ry="7" transform="rotate(-30 225 320)"/>
    <ellipse cx="590" cy="215" rx="13" ry="6" transform="rotate(20 590 215)"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke" font-size="86">
    <text x="400" y="467" textLength="420" lengthAdjust="spacingAndGlyphs" fill="#0b3a66" stroke="#0b3a66" stroke-width="18">Voo Livre</text>
    <text x="400" y="458" textLength="420" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#0b3a66" stroke-width="16">Voo Livre</text>
  </g>
</svg>
