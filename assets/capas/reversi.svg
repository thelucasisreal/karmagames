<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84a"/>
      <stop offset=".5" stop-color="#ff8a5a"/>
      <stop offset="1" stop-color="#e8407a"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="feltro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee08a"/>
      <stop offset="1" stop-color="#14a05a"/>
    </linearGradient>
    <radialGradient id="preta" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#6a6e80"/>
      <stop offset=".45" stop-color="#25262e"/>
      <stop offset="1" stop-color="#0a0a10"/>
    </radialGradient>
    <radialGradient id="branca" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#f1f2f6"/>
      <stop offset="1" stop-color="#bfc4d0"/>
    </radialGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a34"/>
      <stop offset=".5" stop-color="#8a8e9a"/>
      <stop offset="1" stop-color="#e6e8ee"/>
    </linearGradient>
    <filter id="sombra" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1200" height="900">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#5a0a2a" flood-opacity=".38"/>
    </filter>
    <g id="p">
      <ellipse cx="0" cy="7" rx="44" ry="36" fill="#0a0a10" stroke="#1a0a1a" stroke-width="7"/>
      <ellipse rx="44" ry="36" fill="url(#preta)" stroke="#1a0a1a" stroke-width="7"/>
      <ellipse cx="-16" cy="-14" rx="13" ry="6" fill="#fff" opacity=".35" transform="rotate(-20 -16 -14)"/>
    </g>
    <g id="b">
      <ellipse cx="0" cy="7" rx="44" ry="36" fill="#9aa0ae" stroke="#1a0a1a" stroke-width="7"/>
      <ellipse rx="44" ry="36" fill="url(#branca)" stroke="#1a0a1a" stroke-width="7"/>
      <ellipse cx="-16" cy="-14" rx="13" ry="6" fill="#fff" opacity=".9" transform="rotate(-20 -16 -14)"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <circle cx="400" cy="230" r="300" fill="url(#luz)"/>

  <!-- brilhos -->
  <g fill="#fff">
    <path d="M90 90 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z"/>
    <path d="M712 70 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z"/>
    <path d="M730 400 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
    <circle cx="70" cy="380" r="7"/>
    <circle cx="650" cy="120" r="5"/>
  </g>

  <!-- tabuleiro em perspectiva -->
  <g filter="url(#sombra)">
    <path d="M190 160 L610 160 L700 440 L100 440 Z" fill="#0c5a34" stroke="#1a0a1a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M100 440 L700 440 L700 462 L100 462 Z" fill="#08422a" stroke="#1a0a1a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M200 170 L600 170 L684 430 L116 430 Z" fill="url(#feltro)"/>
    <g stroke="#0c5a34" stroke-width="5" fill="none">
      <!-- verticais -->
      <path d="M300 170 L258 430 M400 170 L400 430 M500 170 L542 430"/>
      <!-- horizontais -->
      <path d="M182 226 L618 226 M160 294 L640 294 M136 366 L664 366"/>
    </g>
    <circle cx="400" cy="294" r="7" fill="#0c5a34"/>
  </g>

  <!-- pecas no tabuleiro -->
  <g filter="url(#sombra)">
    <use href="#p" transform="translate(252 197) scale(.78 .62)"/>
    <use href="#b" transform="translate(548 197) scale(.78 .62)"/>
    <use href="#b" transform="translate(278 258) scale(.9 .7)"/>
    <use href="#p" transform="translate(520 258) scale(.9 .7)"/>
    <use href="#p" transform="translate(194 328) scale(1 .78)"/>
    <use href="#b" transform="translate(470 328) scale(1 .78)"/>
    <use href="#p" transform="translate(605 328) scale(1 .78)"/>
    <use href="#b" transform="translate(330 398) scale(1.1 .85)"/>
    <use href="#p" transform="translate(470 398) scale(1.1 .85)"/>
    <use href="#b" transform="translate(608 398) scale(1.1 .85)"/>
  </g>

  <!-- peca virando (heroi) -->
  <g stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M268 150 Q300 70 380 60"/>
    <path d="M532 150 Q500 70 420 60"/>
  </g>
  <path d="M398 52 l-24 -6 8 22z" fill="#fff"/>
  <g transform="translate(400 150) rotate(-14)" filter="url(#sombra)">
    <!-- espessura da borda -->
    <ellipse cx="9" cy="0" rx="34" ry="92" fill="url(#borda)" stroke="#1a0a1a" stroke-width="9"/>
    <!-- face branca de frente, preta aparecendo na borda -->
    <ellipse cx="-6" cy="0" rx="34" ry="92" fill="url(#branca)" stroke="#1a0a1a" stroke-width="9"/>
    <path d="M14 -80 Q36 0 14 80" fill="none" stroke="#25262e" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="-18" cy="-44" rx="7" ry="22" fill="#fff" opacity=".95"/>
    <!-- carinha -->
    <g stroke="#1a0a1a" stroke-width="4">
      <ellipse cx="-14" cy="-12" rx="8" ry="12" fill="#fff"/>
      <ellipse cx="6" cy="-12" rx="7" ry="11" fill="#fff"/>
    </g>
    <circle cx="-11" cy="-9" r="5" fill="#1a0a1a"/>
    <circle cx="8" cy="-9" r="4.5" fill="#1a0a1a"/>
    <circle cx="-9" cy="-12" r="1.8" fill="#fff"/>
    <circle cx="9.5" cy="-12" r="1.6" fill="#fff"/>
    <path d="M-15 16 Q-4 30 7 16 Q-4 21 -15 16Z" fill="#e8304a" stroke="#1a0a1a" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- linhas de movimento -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M330 100 h-34"/><path d="M326 136 h-24"/><path d="M470 100 h34"/><path d="M474 136 h24"/>
  </g>
</svg>
