  <text x="400" y="458" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="92" fill="#ffd23f" stroke="#2b1747" stroke-width="16" stroke-linejoin="round" paint-order="stroke">GENIUS</text>
