<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset=".5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff4f7a"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".4" r=".5">
      <stop offset="0" stop-color="#fff7c2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff7c2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff07a"/>
      <stop offset=".5" stop-color="#ffc23a"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <linearGradient id="coroa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="1" stop-color="#ffcf2a"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#7a1a00" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <!-- raios -->
  <g fill="#fff" opacity=".13" transform="translate(400 200)">
    <path d="M0 0 L-60 -420 L60 -420Z"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(30)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(60)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(90)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(120)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(150)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(180)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(210)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(240)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(270)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(300)"/>
    <path d="M0 0 L-60 -420 L60 -420Z" transform="rotate(330)"/>
  </g>
  <circle cx="400" cy="200" r="230" fill="url(#luz)"/>

  <!-- pecas flutuantes -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke="#5a1a00" stroke-width="6" stroke-linejoin="round" filter="url(#sombra)">
    <g transform="translate(95 110) rotate(-14)">
      <rect x="-50" y="-50" width="100" height="100" rx="18" fill="#fff4dc"/>
      <text y="24" font-size="66" fill="#8a5a3a" stroke="none">2</text>
    </g>
    <g transform="translate(720 120) rotate(12)">
      <rect x="-48" y="-48" width="96" height="96" rx="18" fill="#ffe0a8"/>
      <text y="22" font-size="62" fill="#8a5a3a" stroke="none">4</text>
    </g>
    <g transform="translate(80 370) rotate(10)">
      <rect x="-52" y="-52" width="104" height="104" rx="18" fill="#ff9a52"/>
      <text y="24" font-size="66" fill="#fff" stroke="none">8</text>
    </g>
    <g transform="translate(715 360) rotate(-10)">
      <rect x="-54" y="-54" width="108" height="108" rx="18" fill="#ff6b5a"/>
      <text y="20" font-size="54" fill="#fff" stroke="none">16</text>
    </g>
    <g transform="translate(200 80) rotate(-8) scale(.7)">
      <rect x="-54" y="-54" width="108" height="108" rx="18" fill="#c94cff"/>
      <text y="20" font-size="54" fill="#fff" stroke="none">32</text>
    </g>
    <g transform="translate(605 75) rotate(10) scale(.7)">
      <rect x="-54" y="-54" width="108" height="108" rx="18" fill="#3ab0ff"/>
      <text y="20" font-size="54" fill="#fff" stroke="none">64</text>
    </g>
  </g>

  <!-- setas de deslize -->
  <g fill="#fff" stroke="#5a1a00" stroke-width="5" stroke-linejoin="round" opacity=".95">
    <path d="M200 215 l-34 -26 v14 h-26 v24 h26 v14z"/>
    <path d="M600 215 l34 -26 v14 h26 v24 h-26 v14z"/>
  </g>

  <!-- peca heroi -->
  <g transform="translate(400 232) rotate(-5) scale(.92)" filter="url(#sombra)">
    <!-- coroa -->
    <path d="M-80 -118 L-92 -186 L-46 -150 L0 -200 L46 -150 L92 -186 L80 -118 Z" fill="url(#coroa)" stroke="#5a1a00" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="0" cy="-200" r="11" fill="#ff4f7a" stroke="#5a1a00" stroke-width="5"/>
    <circle cx="-92" cy="-186" r="9" fill="#3ab0ff" stroke="#5a1a00" stroke-width="5"/>
    <circle cx="92" cy="-186" r="9" fill="#3ab0ff" stroke="#5a1a00" stroke-width="5"/>
    <!-- base 3d -->
    <rect x="-140" y="-120" width="280" height="262" rx="44" fill="#d9761a" stroke="#5a1a00" stroke-width="9"/>
    <rect x="-140" y="-130" width="280" height="250" rx="44" fill="url(#ouro)" stroke="#5a1a00" stroke-width="9"/>
    <path d="M-110 -100 Q-110 -112 -90 -112 H60" stroke="#fff" stroke-width="14" stroke-linecap="round" fill="none" opacity=".7"/>
    <!-- rosto -->
    <g stroke="#5a1a00" stroke-width="7">
      <ellipse cx="-50" cy="-24" rx="34" ry="40" fill="#fff"/>
      <ellipse cx="50" cy="-24" rx="34" ry="40" fill="#fff"/>
    </g>
    <circle cx="-42" cy="-18" r="18" fill="#3a1200"/>
    <circle cx="58" cy="-18" r="18" fill="#3a1200"/>
    <circle cx="-36" cy="-26" r="6" fill="#fff"/>
    <circle cx="64" cy="-26" r="6" fill="#fff"/>
    <path d="M-44 40 Q4 92 52 40 Z" fill="#a8241a" stroke="#5a1a00" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-20 62 Q4 76 28 62 Q14 74 4 74 Q-10 74 -20 62Z" fill="#ff7a8a"/>
    <ellipse cx="-96" cy="38" rx="20" ry="12" fill="#ff6b6b" opacity=".55"/>
    <ellipse cx="104" cy="38" rx="20" ry="12" fill="#ff6b6b" opacity=".55"/>
  </g>

  <!-- brilhos -->
  <g fill="#fff">
    <path d="M560 250 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
    <path d="M240 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M270 130 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke" font-size="112">
    <text x="400" y="481" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#6a1030" stroke="#6a1030" stroke-width="20">2048</text>
    <text x="400" y="472" textLength="300" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#6a1030" stroke-width="18">2048</text>
  </g>
</svg>
