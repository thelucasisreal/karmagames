<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe94a"/>
      <stop offset=".55" stop-color="#b8ec4a"/>
      <stop offset="1" stop-color="#45d08a"/>
    </linearGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="1" stop-color="#e8264a"/>
    </linearGradient>
    <linearGradient id="bola" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ad8ff"/>
      <stop offset="1" stop-color="#2a6aff"/>
    </linearGradient>
    <filter id="sombra" filterUnits="userSpaceOnUse" x="-900" y="-700" width="2600" height="1900">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#1a4a10" flood-opacity=".35"/>
    </filter>
    <g id="x-peca">
      <path d="M-50 -50 L50 50 M50 -50 L-50 50" stroke="#2a0a2a" stroke-width="50" stroke-linecap="round"/>
      <path d="M-50 -50 L50 50 M50 -50 L-50 50" stroke="url(#xis)" stroke-width="34" stroke-linecap="round"/>
      <path d="M-50 -46 L-20 -16" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".6"/>
    </g>
    <g id="o-peca">
      <circle r="52" fill="none" stroke="#2a0a2a" stroke-width="46"/>
      <circle r="52" fill="none" stroke="url(#bola)" stroke-width="30"/>
      <path d="M-40 -28 Q-28 -46 -8 -50" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".6"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <circle cx="400" cy="175" r="250" fill="url(#luz)"/>

  <!-- pecas decorativas nas laterais -->
  <g opacity=".9" filter="url(#sombra)">
    <use href="#x-peca" transform="translate(75 95) rotate(-12) scale(.55)"/>
    <use href="#o-peca" transform="translate(715 105) scale(.55)"/>
    <use href="#o-peca" transform="translate(85 390) scale(.45)"/>
    <use href="#x-peca" transform="translate(720 390) rotate(10) scale(.5)"/>
  </g>
  <g fill="#fff">
    <path d="M175 230 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z"/>
    <path d="M625 230 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
  </g>

  <!-- tabuleiro -->
  <g stroke-linecap="round" filter="url(#sombra)">
    <path d="M350 26 Q345 170 352 318 M452 28 Q457 170 449 318 M248 122 Q400 115 552 124 M248 222 Q400 229 552 220" fill="none" stroke="#2a0a2a" stroke-width="26"/>
    <path d="M350 26 Q345 170 352 318 M452 28 Q457 170 449 318 M248 122 Q400 115 552 124 M248 222 Q400 229 552 220" fill="none" stroke="#fff" stroke-width="13"/>
  </g>

  <!-- pecas no tabuleiro -->
  <g filter="url(#sombra)">
    <use href="#o-peca" transform="translate(298 72) scale(.58)"/>
    <use href="#x-peca" transform="translate(503 72) rotate(6) scale(.52)"/>
  </g>

  <!-- O heroi -->
  <g transform="translate(503 272)" filter="url(#sombra)">
    <circle r="30" fill="#e6f7ff"/>
    <use href="#o-peca" transform="scale(.7)"/>
    <ellipse cx="-11" cy="-5" rx="6" ry="8" fill="#2a0a2a"/>
    <ellipse cx="11" cy="-5" rx="6" ry="8" fill="#2a0a2a"/>
    <circle cx="-9" cy="-8" r="2.5" fill="#fff"/>
    <circle cx="13" cy="-8" r="2.5" fill="#fff"/>
    <path d="M-7 10 Q0 16 7 10" fill="none" stroke="#2a0a2a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- X heroi -->
  <g transform="translate(401 172) rotate(-6)" filter="url(#sombra)">
    <use href="#x-peca" transform="scale(.92)"/>
    <circle r="40" fill="url(#xis)" stroke="#2a0a2a" stroke-width="7"/>
    <g stroke="#2a0a2a" stroke-width="5">
      <ellipse cx="-14" cy="-7" rx="12" ry="15" fill="#fff"/>
      <ellipse cx="14" cy="-7" rx="12" ry="15" fill="#fff"/>
    </g>
    <circle cx="-10" cy="-4" r="6.5" fill="#2a0a2a"/>
    <circle cx="18" cy="-4" r="6.5" fill="#2a0a2a"/>
    <circle cx="-8" cy="-7" r="2.5" fill="#fff"/>
    <circle cx="20" cy="-7" r="2.5" fill="#fff"/>
    <path d="M-11 14 Q2 30 15 14 Z" fill="#8a0a2a" stroke="#2a0a2a" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="-24" cy="-27" rx="8" ry="4.5" fill="#fff" opacity=".7" transform="rotate(-35 -24 -27)"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
    <text x="400" y="384" font-size="50" textLength="200" lengthAdjust="spacingAndGlyphs" fill="#2a0a2a" stroke="#2a0a2a" stroke-width="14">Jogo da</text>
    <text x="400" y="377" font-size="50" textLength="200" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#2a0a2a" stroke-width="12">Jogo da</text>
    <text x="400" y="475" font-size="96" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#2a0a2a" stroke="#2a0a2a" stroke-width="18">Velha</text>
    <text x="400" y="466" font-size="96" textLength="320" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#2a0a2a" stroke-width="16">Velha</text>
  </g>
</svg>
