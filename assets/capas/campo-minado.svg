<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <pattern id="xadrez" width="100" height="100" patternUnits="userSpaceOnUse" x="0" y="0">
      <rect width="100" height="100" fill="#8fdc3a"/>
      <rect width="50" height="50" fill="#a6ea4a"/>
      <rect x="50" y="50" width="50" height="50" fill="#a6ea4a"/>
    </pattern>
    <radialGradient id="vinheta" cx=".5" cy=".45" r=".65">
      <stop offset=".5" stop-color="#0a5a2a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a5a2a" stop-opacity=".45"/>
    </radialGradient>
    <radialGradient id="luz" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbd0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fffbd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bomba" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#7a6aa8"/>
      <stop offset=".45" stop-color="#3a2f5e"/>
      <stop offset="1" stop-color="#1a1430"/>
    </radialGradient>
    <radialGradient id="fogo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".35" stop-color="#ffe14a"/>
      <stop offset=".7" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#ff4f3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0a3a10" flood-opacity=".4"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#xadrez)"/>

  <!-- casas abertas com numeros -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" font-size="40">
    <rect x="0" y="0" width="150" height="100" fill="#f2d7a6"/>
    <rect x="0" y="0" width="50" height="50" fill="#e8c890"/><rect x="100" y="0" width="50" height="50" fill="#e8c890"/><rect x="50" y="50" width="50" height="50" fill="#e8c890"/>
    <text x="75" y="39" fill="#2f7bff">1</text>
    <text x="125" y="89" fill="#2aa84a">2</text>
    <text x="25" y="89" fill="#2f7bff">1</text>

    <rect x="650" y="350" width="150" height="150" fill="#f2d7a6"/>
    <rect x="650" y="350" width="50" height="50" fill="#e8c890"/><rect x="750" y="350" width="50" height="50" fill="#e8c890"/><rect x="700" y="400" width="50" height="50" fill="#e8c890"/><rect x="650" y="450" width="50" height="50" fill="#e8c890"/><rect x="750" y="450" width="50" height="50" fill="#e8c890"/>
    <text x="675" y="389" fill="#ff3b3b">3</text>
    <text x="725" y="389" fill="#2aa84a">2</text>
    <text x="675" y="439" fill="#2f7bff">1</text>

    <rect x="650" y="0" width="100" height="50" fill="#f2d7a6"/>
    <text x="675" y="39" fill="#2f7bff">1</text>
    <text x="725" y="39" fill="#9a3aff">4</text>

    <rect x="0" y="400" width="100" height="100" fill="#f2d7a6"/>
    <rect x="50" y="400" width="50" height="50" fill="#e8c890"/><rect x="0" y="450" width="50" height="50" fill="#e8c890"/>
    <text x="25" y="439" fill="#2aa84a">2</text>
    <text x="75" y="489" fill="#2f7bff">1</text>
  </g>

  <rect width="800" height="500" fill="url(#vinheta)"/>
  <polygon points="630,215 562,247 612,303 537,307 563,378 492,352 488,427 432,377 400,445 368,377 312,427 308,352 237,378 263,307 188,303 238,247 170,215 238,183 188,127 263,123 237,52 308,78 312,3 368,53 400,-15 432,53 488,3 492,78 563,52 537,123 612,127 562,183" fill="#fff36a" opacity=".55"/>
  <circle cx="400" cy="215" r="150" fill="#fffbd0" opacity=".5"/>

  <!-- bandeirinhas -->
  <g filter="url(#sombra)" stroke="#2a0a0a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(565 250) rotate(8)">
      <ellipse cx="0" cy="62" rx="34" ry="10" fill="#5a3a1a"/>
      <path d="M0 62 V-50" fill="none" stroke-width="8"/>
      <path d="M0 -52 Q40 -60 70 -36 Q40 -14 0 -18Z" fill="#ff3b3b"/>
      <path d="M8 -44 Q30 -48 46 -38" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/>
    </g>
    <g transform="translate(110 220) scale(.75) rotate(-8)">
      <ellipse cx="0" cy="62" rx="34" ry="10" fill="#5a3a1a"/>
      <path d="M0 62 V-50" fill="none" stroke-width="8"/>
      <path d="M0 -52 Q40 -60 70 -36 Q40 -14 0 -18Z" fill="#ff3b3b"/>
    </g>
  </g>

  <!-- bomba heroi -->
  <g transform="translate(385 215)" filter="url(#sombra)">
    <!-- espetos -->
    <g fill="#3a2f5e" stroke="#120c24" stroke-width="7" stroke-linejoin="round">
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(-60)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(-120)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(180)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(120)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(90)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(-90)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(150)"/>
      <path d="M-14 -118 L0 -150 L14 -118Z" transform="rotate(-150)"/>
    </g>
    <!-- bocal e pavio -->
    <rect x="34" y="-128" width="56" height="40" rx="8" fill="#6a6a8a" stroke="#120c24" stroke-width="7" transform="rotate(35 62 -108)"/>
    <path d="M80 -132 Q110 -175 150 -160 Q175 -150 172 -128" fill="none" stroke="#120c24" stroke-width="12" stroke-linecap="round"/>
    <path d="M80 -132 Q110 -175 150 -160 Q175 -150 172 -128" fill="none" stroke="#e8b070" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
    <circle cx="172" cy="-126" r="40" fill="url(#fogo)"/>
    <path d="M172 -152 l7 18 18 -6 -10 16 16 10 -19 2 2 19 -14 -13 -14 13 2 -19 -19 -2 16 -10 -10 -16 18 6z" fill="#fff36a" stroke="#ff7a1f" stroke-width="3"/>
    <!-- corpo -->
    <circle r="118" fill="url(#bomba)" stroke="#120c24" stroke-width="9"/>
    <ellipse cx="-50" cy="-62" rx="34" ry="18" fill="#fff" opacity=".35" transform="rotate(-35 -50 -62)"/>
    <circle cx="-78" cy="-30" r="8" fill="#fff" opacity=".35"/>
    <!-- rosto -->
    <g stroke="#120c24" stroke-width="7">
      <ellipse cx="-36" cy="-4" rx="30" ry="36" fill="#fff"/>
      <ellipse cx="38" cy="-4" rx="30" ry="36" fill="#fff"/>
    </g>
    <circle cx="-28" cy="2" r="16" fill="#120c24"/>
    <circle cx="46" cy="2" r="16" fill="#120c24"/>
    <circle cx="-23" cy="-5" r="5.5" fill="#fff"/>
    <circle cx="51" cy="-5" r="5.5" fill="#fff"/>
    <path d="M-66 -52 Q-40 -66 -14 -50 M14 -50 Q40 -66 66 -52" fill="none" stroke="#120c24" stroke-width="8" stroke-linecap="round"/>
    <path d="M-34 46 Q4 92 42 46 Q4 58 -34 46Z" fill="#ff5f7a" stroke="#120c24" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="-74" cy="44" rx="16" ry="9" fill="#ff6b9a" opacity=".55"/>
    <ellipse cx="78" cy="44" rx="16" ry="9" fill="#ff6b9a" opacity=".55"/>
    <!-- gota de suor -->
    <path d="M118 -40 Q130 -20 126 -8 Q118 2 110 -8 Q108 -20 118 -40Z" fill="#7ad8ff" stroke="#120c24" stroke-width="4"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke" font-size="62">
    <text x="400" y="472" textLength="436" lengthAdjust="spacingAndGlyphs" fill="#0b3a14" stroke="#0b3a14" stroke-width="18">Campo Minado</text>
    <text x="400" y="464" textLength="436" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#0b3a14" stroke-width="15">Campo Minado</text>
  </g>
</svg>
