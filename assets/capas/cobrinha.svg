<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4cff"/>
      <stop offset=".55" stop-color="#b34dff"/>
      <stop offset="1" stop-color="#ff5fa2"/>
    </linearGradient>
    <pattern id="grade" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#fff" opacity=".07"/>
      <rect x="25" y="25" width="25" height="25" fill="#fff" opacity=".07"/>
    </pattern>
    <radialGradient id="luz" cx=".5" cy=".42" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cabeca" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#e8ff6a"/>
      <stop offset=".6" stop-color="#8fe03a"/>
      <stop offset="1" stop-color="#4fae2a"/>
    </radialGradient>
    <radialGradient id="maca" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset=".5" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#c41a3a"/>
    </radialGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#2a0060" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#fundo)"/>
  <rect width="800" height="500" fill="url(#grade)"/>
  <ellipse cx="400" cy="210" rx="330" ry="230" fill="url(#luz)"/>

  <!-- macas decorativas nas laterais -->
  <g stroke="#3a0a2a" stroke-width="5" opacity=".9">
    <circle cx="80" cy="120" r="26" fill="url(#maca)"/>
    <circle cx="725" cy="380" r="30" fill="url(#maca)"/>
    <circle cx="700" cy="90" r="18" fill="url(#maca)"/>
  </g>
  <g fill="#fff" opacity=".8">
    <path d="M110 330 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M640 230 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path d="M180 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  </g>

  <!-- corpo da cobra -->
  <g filter="url(#sombra)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="corpo" d="M200 335 C195 255 285 255 295 300 S330 370 380 340 S420 240 420 200" stroke="#1e3a0a" stroke-width="86"/>
    <path d="M200 335 C195 255 285 255 295 300 S330 370 380 340 S420 240 420 200" stroke="#8fe03a" stroke-width="70"/>
    <path d="M200 335 C195 255 285 255 295 300 S330 370 380 340 S420 240 420 200" stroke="#c8f13a" stroke-width="30" stroke-dasharray="1 44"/>
    <path d="M192 300 C205 272 255 266 274 288" stroke="#fff" stroke-width="10" opacity=".45"/>
  </g>

  <!-- cabeca -->
  <g transform="translate(445 165) rotate(-8)" filter="url(#sombra)">
    <!-- lingua -->
    <path d="M96 50 Q118 62 132 58 M132 58 L150 46 M132 58 L148 74" stroke="#ff3b6b" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M96 50 Q118 62 132 58 M132 58 L150 46 M132 58 L148 74" stroke="#1e3a0a" stroke-width="3" stroke-linecap="round" fill="none" opacity=".4"/>
    <ellipse cx="0" cy="0" rx="112" ry="92" fill="url(#cabeca)" stroke="#1e3a0a" stroke-width="8"/>
    <!-- sorriso -->
    <path d="M10 46 Q50 76 88 46" fill="none" stroke="#1e3a0a" stroke-width="8" stroke-linecap="round"/>
    <!-- narinas -->
    <circle cx="80" cy="12" r="5" fill="#1e3a0a"/>
    <circle cx="96" cy="22" r="5" fill="#1e3a0a"/>
    <!-- olhos -->
    <g stroke="#1e3a0a" stroke-width="7">
      <ellipse cx="-18" cy="-36" rx="34" ry="40" fill="#fff"/>
      <ellipse cx="50" cy="-40" rx="30" ry="36" fill="#fff"/>
    </g>
    <circle cx="-6" cy="-30" r="17" fill="#1e3a0a"/>
    <circle cx="60" cy="-34" r="15" fill="#1e3a0a"/>
    <circle cx="0" cy="-37" r="6" fill="#fff"/>
    <circle cx="65" cy="-40" r="5" fill="#fff"/>
    <!-- bochechas e brilho -->
    <ellipse cx="-40" cy="30" rx="18" ry="11" fill="#ff7aa8" opacity=".7"/>
    <ellipse cx="-60" cy="-56" rx="22" ry="10" fill="#fff" opacity=".5" transform="rotate(-35 -60 -56)"/>
  </g>

  <!-- maca principal -->
  <g transform="translate(605 305) scale(.85)" filter="url(#sombra)">
    <path d="M0 -42 Q4 -62 18 -70" stroke="#5a2a0a" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M6 -52 Q30 -76 50 -56 Q28 -38 6 -52Z" fill="#6ee05a" stroke="#1e3a0a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -36 C-30 -56 -60 -36 -56 0 C-52 36 -24 54 0 44 C24 54 52 36 56 0 C60 -36 30 -56 0 -36Z" fill="url(#maca)" stroke="#3a0a2a" stroke-width="7" stroke-linejoin="round"/>
    <ellipse cx="-26" cy="-14" rx="10" ry="16" fill="#fff" opacity=".6" transform="rotate(20 -26 -14)"/>
  </g>

  <!-- titulo -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke" font-size="88">
    <text x="400" y="469" textLength="410" lengthAdjust="spacingAndGlyphs" fill="#2a0a55" stroke="#2a0a55" stroke-width="18">Cobrinha</text>
    <text x="400" y="460" textLength="410" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#2a0a55" stroke-width="16">Cobrinha</text>
  </g>
</svg>
