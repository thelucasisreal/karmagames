<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xadrez · Karma Games</title>
<meta name="theme-color" content="#0d0e12">

<style>
@font-face{font-family:"Unbounded";font-weight:800;font-style:normal;font-display:swap;src:url(../../assets/fonts/unbounded-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-600-normal.woff2) format("woff2")}
:root{--bg:#0d0e12;--surface:#171920;--raised:#1f222b;--line:#262a33;--text:#f2f3f5;--muted:#9aa0ab;--accent:#c8f13a;--coral:#ff6b5a;--sky:#5ac8ff;--amber:#ffc23a;--r:12px;--ease:cubic-bezier(.16,1,.3,1);--display:"Unbounded",system-ui,sans-serif;--light:#b4bccb;--dark:#6c778c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:400 15px/1.4 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;height:100dvh;display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));touch-action:manipulation}
::selection{background:var(--accent);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:14px;transition:background-color .2s var(--ease),transform .2s var(--ease),color .2s}
.btn:hover{background:#292d38}

.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover,.btn[aria-pressed="true"]:hover{background:#d4f75a}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.app{width:min(100%,560px);height:100%;display:flex;flex-direction:column;gap:10px}
h1{font:800 clamp(22px,6vw,32px)/1.05 var(--display);letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top .seg{flex-wrap:nowrap}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

.seg[hidden]{display:none}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:center;transition:border-color .25s var(--ease)}

.stat.x .val{color:var(--accent)}.stat.o .val{color:var(--sky)}

.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{display:flex;flex-direction:column;gap:6px}
.caps{height:20px;display:flex;align-items:center;gap:0;font-size:12px;font-weight:600;color:var(--muted);overflow:hidden}
.caps svg{width:20px;height:20px;flex:none;margin-right:-5px}
.caps .gap{width:9px;flex:none}
.caps .adv{margin-left:10px}
.caps .b .s{stroke:#8a92a3}
.board{position:relative;width:var(--s);height:var(--s);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;border-radius:0;cursor:pointer}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.sq::before,.sq::after{content:"";position:absolute;pointer-events:none}
.sq.last::before{inset:0;background:rgba(200,241,58,.3)}
.sq.sel::before{inset:0;background:rgba(200,241,58,.55)}
.sq.chk::before{inset:0;background:radial-gradient(circle closest-side,rgba(255,107,90,1) 0,rgba(255,107,90,.7) 45%,rgba(255,107,90,0) 100%)}
.sq.dot::after{inset:36%;border-radius:50%;background:rgba(13,14,18,.38)}
.sq.cap::after{inset:3%;border-radius:50%;background:radial-gradient(circle closest-side,transparent 78%,rgba(13,14,18,.42) 80%,rgba(13,14,18,.42) 98%,transparent 100%)}
@media (hover:hover){.sq.dot:hover::after{inset:30%;background:rgba(13,14,18,.55)}.sq.cap:hover::before{inset:0;background:rgba(200,241,58,.3)}}
.co{position:absolute;font:600 max(8px,calc(var(--s)*.024))/1 "Geist",system-ui,sans-serif;pointer-events:none;opacity:.8}
.sq.l .co{color:var(--dark)}.sq.d .co{color:var(--light)}
.co.rk{left:5%;top:5%}.co.fl{right:6%;bottom:5%}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;left:calc(var(--c)*12.5%);top:calc(var(--r)*12.5%);transition:transform .22s var(--ease)}
.pc svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35));transition:transform .15s var(--ease)}
.pc.drag{transition:none;z-index:5}
.pc.drag svg{transform:scale(1.18);filter:drop-shadow(0 6px 5px rgba(0,0,0,.4))}
.pc.gone{animation:gone .24s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:scale(.55)}}
.w .f{fill:#f6f2e9}.w .s{stroke:#15171c}.w .k{stroke:#15171c}.w .e{fill:#15171c}
.b .f{fill:#2b2f39}.b .s{stroke:#0a0b0e}.b .k{stroke:#a3abba}.b .e{fill:#a3abba}
.f,.s{stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.k{fill:none;stroke-width:1.5;stroke-linecap:round}
.promo{position:absolute;inset:0;z-index:6;background:rgba(13,14,18,.66);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:fade .2s var(--ease)}
.promo[hidden]{display:none}
.promo p{font-weight:600}
.promo .row{display:flex;gap:8px}
.promo button{width:calc(var(--s)*.18);height:calc(var(--s)*.18);min-width:52px;min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:calc(var(--s)*.016);transition:border-color .2s var(--ease),transform .2s var(--ease)}
.promo button:hover{border-color:var(--accent);transform:translateY(-2px)}
.promo svg{width:100%;height:100%;display:block}
.hint{color:var(--muted);font-size:14px;text-align:center}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(13,14,18,.78);animation:fade .25s var(--ease)}
.overlay[hidden]{display:none}
.dlg{width:min(100%,320px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px 24px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:rise .35s var(--ease)}
.dlg h2{font:800 24px/1.15 var(--display);margin-bottom:8px}
.dlg p{color:var(--muted)}
.dlg .row{display:flex;gap:8px;justify-content:center;margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
@media (max-width:420px){.btn{padding:0 12px;font-size:13px}.stat .val{font-size:19px}.top .btn{padding:0 8px}}
@media (max-height:720px){.hint{display:none}.stat{padding:5px 8px}.stat .val{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>

<body>
<main class="app">
  <div class="top">
    <h1>Xadrez</h1>
    <div class="seg">
      <button class="btn ghost" type="button" id="novo">Nova partida</button>
      <button class="btn ghost" type="button" id="reset">Zerar placar</button>
    </div>
  </div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Modo de jogo">
      <button class="btn" type="button" data-mode="cpu">Contra o computador</button>
      <button class="btn" type="button" data-mode="2p">2 jogadores</button>
    </div>
    <div class="seg" id="diffs" role="group" aria-label="Dificuldade">
      <button class="btn" type="button" data-diff="facil">Fácil</button>
      <button class="btn" type="button" data-diff="dificil">Difícil</button>
    </div>
  </div>
  <div class="score">
    <div class="stat x" id="sx"><span class="lbl" id="lx">Você (brancas)</span><span class="val" id="vx">0</span></div>
    <div class="stat"><span class="lbl">Empates</span><span class="val" id="vd">0</span></div>
    <div class="stat o" id="so"><span class="lbl" id="lo">Computador (pretas)</span><span class="val" id="vo">0</span></div>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="wrap" id="wrap">
    <div class="stage">
      <div class="caps" id="capT" aria-label="Peças brancas capturadas"></div>
      <div class="board" id="board">
        <div class="grid" id="grid" role="grid" aria-label="Tabuleiro"></div>
        <div class="pcs" id="pcs" aria-hidden="true"></div>
        <div class="promo" id="promo" hidden><p>Promover para:</p><div class="row" id="promoRow"></div></div>
      </div>
      <div class="caps" id="capB" aria-label="Peças pretas capturadas"></div>
    </div>
  </div>
  <p class="hint">Toque numa peça para ver os lances e toque no destino — ou arraste.</p>
</main>
<div class="overlay" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ovt">
    <h2 id="ovt"></h2>
    <p id="ovp"></p>
    <div class="row"><button class="btn primary" type="button" id="again">Jogar de novo</button></div>
  </div>
</div>
<script>
(function(){
"use strict";

/* Motor de xadrez (0x88). Roda tanto aqui quanto dentro do Web Worker. */
function Engine(){
  var W=8,BK=16,PAWN=1,KNIGHT=2,BISHOP=3,ROOK=4,QUEEN=5,KING=6;
  var CAP=1,EPF=2,CAS=4,DBL=8;
  var NOFF=[-33,-31,-18,-14,14,18,31,33],BOFF=[-17,-15,15,17],ROFF=[-16,-1,1,16],KOFF=[-17,-16,-15,-1,1,15,16,17];
  var VAL=[0,100,320,330,500,900,0];
  var bd=new Int8Array(128),side=W,cast=0,ep=-1,half=0,full=1,kings=[0,0],hash=0;
  var MAXU=1024,sp=0,U_m=new Int32Array(MAXU),U_cap=new Int8Array(MAXU),U_cast=new Int8Array(MAXU),U_ep=new Int16Array(MAXU),U_half=new Int16Array(MAXU),U_hash=new Int32Array(MAXU);
  var ph=[];
  var seed=0x2545F491;
  function rnd(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return seed|0}
  var Z=[];for(var p=0;p<23;p++){Z.push(new Int32Array(128));for(var q=0;q<128;q++)Z[p][q]=rnd()}
  var ZS=rnd(),ZC=new Int32Array(16),ZE=new Int32Array(128);
  for(q=0;q<16;q++)ZC[q]=rnd();for(q=0;q<128;q++)ZE[q]=rnd();
  var CM=new Int8Array(128);for(q=0;q<128;q++)CM[q]=15;
  CM[112]=13;CM[119]=14;CM[116]=12;CM[0]=7;CM[7]=11;CM[4]=3;

  function computeHash(){
    var h=0;for(var s=0;s<128;s++){if(s&0x88){s+=7;continue}if(bd[s])h^=Z[bd[s]][s]}
    if(side===BK)h^=ZS;h^=ZC[cast];if(ep>=0)h^=ZE[ep];return h;
  }
  function epUsable(e,stm){
    // so guarda en passant se existe um peao do lado a jogar que pode captura-lo
    var pawnSq=e+(stm===W?16:-16),mine=stm|PAWN;
    return (((pawnSq-1)&0x88)===0&&bd[pawnSq-1]===mine)||(((pawnSq+1)&0x88)===0&&bd[pawnSq+1]===mine);
  }
  function load(fen){
    bd.fill(0);var parts=fen.trim().split(/\s+/),rows=parts[0].split("/");
    for(var r=0;r<8;r++){var c=0,row=rows[r]||"";for(var i=0;i<row.length;i++){var ch=row[i];
      if(ch>="1"&&ch<="8"){c+=+ch;continue}
      var col=ch===ch.toUpperCase()?W:BK,t="pnbrqk".indexOf(ch.toLowerCase())+1;
      bd[r*16+c]=col|t;if(t===KING)kings[col>>4]=r*16+c;c++}}
    side=parts[1]==="b"?BK:W;cast=0;var cs=parts[2]||"-";
    if(cs.indexOf("K")>=0)cast|=1;if(cs.indexOf("Q")>=0)cast|=2;if(cs.indexOf("k")>=0)cast|=4;if(cs.indexOf("q")>=0)cast|=8;
    ep=-1;if(parts[3]&&parts[3]!=="-"){var e=(8-(+parts[3][1]))*16+(parts[3].charCodeAt(0)-97);if(epUsable(e,side))ep=e}
    half=+parts[4]||0;full=+parts[5]||1;sp=0;hash=computeHash();ph=[hash];
  }
  function attacked(sq,by){
    var s,i,t,pc;
    if(by===W){s=sq+15;if(!(s&0x88)&&bd[s]===(W|PAWN))return true;s=sq+17;if(!(s&0x88)&&bd[s]===(W|PAWN))return true}
    else{s=sq-15;if(!(s&0x88)&&bd[s]===(BK|PAWN))return true;s=sq-17;if(!(s&0x88)&&bd[s]===(BK|PAWN))return true}
    for(i=0;i<8;i++){s=sq+NOFF[i];if(!(s&0x88)&&bd[s]===(by|KNIGHT))return true}
    for(i=0;i<8;i++){s=sq+KOFF[i];if(!(s&0x88)&&bd[s]===(by|KING))return true}
    for(i=0;i<4;i++){t=BOFF[i];s=sq+t;while(!(s&0x88)){pc=bd[s];if(pc){if(pc===(by|BISHOP)||pc===(by|QUEEN))return true;break}s+=t}}
    for(i=0;i<4;i++){t=ROFF[i];s=sq+t;while(!(s&0x88)){pc=bd[s];if(pc){if(pc===(by|ROOK)||pc===(by|QUEEN))return true;break}s+=t}}
    return false;
  }
  function inCheck(){return attacked(kings[side>>4],side^24)}
  function addPromos(mv,from,to,fl,capsOnly){
    var base=from|to<<7|fl<<17;mv.push(base|QUEEN<<14);
    if(!capsOnly){mv.push(base|ROOK<<14);mv.push(base|BISHOP<<14);mv.push(base|KNIGHT<<14)}
  }
  function gen(caps){
    var mv=[],me=side,op=side^24,sq,pc,t,to,c,i,d,offs,n;
    for(sq=0;sq<128;sq++){
      if(sq&0x88){sq+=7;continue}
      pc=bd[sq];if(!pc||(pc&24)!==me)continue;t=pc&7;
      if(t===PAWN){
        var dir=me===W?-16:16,row=sq>>4,start=me===W?6:1,last=me===W?1:6;
        to=sq+dir;
        if(!bd[to]){
          if(row===last)addPromos(mv,sq,to,0,caps);
          else if(!caps){mv.push(sq|to<<7);if(row===start&&!bd[to+dir])mv.push(sq|(to+dir)<<7|DBL<<17)}
        }
        for(i=-1;i<=1;i+=2){to=sq+dir+i;if(to&0x88)continue;c=bd[to];
          if(c&&(c&24)===op){if(row===last)addPromos(mv,sq,to,CAP,caps);else mv.push(sq|to<<7|CAP<<17)}
          else if(to===ep)mv.push(sq|to<<7|(CAP|EPF)<<17);
        }
      }else if(t===KNIGHT||t===KING){
        offs=t===KNIGHT?NOFF:KOFF;
        for(i=0;i<8;i++){to=sq+offs[i];if(to&0x88)continue;c=bd[to];
          if(!c){if(!caps)mv.push(sq|to<<7)}else if((c&24)===op)mv.push(sq|to<<7|CAP<<17)}
      }else{
        offs=t===BISHOP?BOFF:t===ROOK?ROFF:KOFF;n=offs.length;
        for(i=0;i<n;i++){d=offs[i];to=sq+d;
          while(!(to&0x88)){c=bd[to];
            if(!c){if(!caps)mv.push(sq|to<<7)}
            else{if((c&24)===op)mv.push(sq|to<<7|CAP<<17);break}
            to+=d}}
      }
    }
    if(!caps){
      if(me===W){
        if((cast&1)&&bd[116]===(W|KING)&&bd[119]===(W|ROOK)&&!bd[117]&&!bd[118]&&!attacked(116,BK)&&!attacked(117,BK)&&!attacked(118,BK))mv.push(116|118<<7|CAS<<17);
        if((cast&2)&&bd[116]===(W|KING)&&bd[112]===(W|ROOK)&&!bd[115]&&!bd[114]&&!bd[113]&&!attacked(116,BK)&&!attacked(115,BK)&&!attacked(114,BK))mv.push(116|114<<7|CAS<<17);
      }else{
        if((cast&4)&&bd[4]===(BK|KING)&&bd[7]===(BK|ROOK)&&!bd[5]&&!bd[6]&&!attacked(4,W)&&!attacked(5,W)&&!attacked(6,W))mv.push(4|6<<7|CAS<<17);
        if((cast&8)&&bd[4]===(BK|KING)&&bd[0]===(BK|ROOK)&&!bd[3]&&!bd[2]&&!bd[1]&&!attacked(4,W)&&!attacked(3,W)&&!attacked(2,W))mv.push(4|2<<7|CAS<<17);
      }
    }
    return mv;
  }
  function make(m){
    var from=m&127,to=(m>>7)&127,pr=(m>>14)&7,fl=m>>17,pc=bd[from],me=side,op=side^24;
    var capSq=(fl&EPF)?to+(me===W?16:-16):to,cap=bd[capSq];
    U_m[sp]=m;U_cap[sp]=cap;U_cast[sp]=cast;U_ep[sp]=ep;U_half[sp]=half;U_hash[sp]=hash;sp++;
    if(cap){hash^=Z[cap][capSq];bd[capSq]=0}
    hash^=Z[pc][from];bd[from]=0;
    var np=pr?(me|pr):pc;bd[to]=np;hash^=Z[np][to];
    if((pc&7)===KING){kings[me>>4]=to;
      if(fl&CAS){var rf,rt;if(to===from+2){rf=from+3;rt=from+1}else{rf=from-4;rt=from-1}
        var rk=bd[rf];bd[rf]=0;bd[rt]=rk;hash^=Z[rk][rf]^Z[rk][rt]}}
    hash^=ZC[cast];cast&=CM[from]&CM[to];hash^=ZC[cast];
    if(ep>=0)hash^=ZE[ep];ep=-1;
    if(fl&DBL){var e=(from+to)>>1;if(epUsable(e,op)){ep=e;hash^=ZE[ep]}}
    if((pc&7)===PAWN||cap)half=0;else half++;
    if(me===BK)full++;
    side=op;hash^=ZS;ph.push(hash);
  }
  function unmake(m){
    sp--;side^=24;var me=side,from=m&127,to=(m>>7)&127,pr=(m>>14)&7,fl=m>>17;
    var np=bd[to],pc=pr?(me|PAWN):np;bd[from]=pc;bd[to]=0;
    if((pc&7)===KING){kings[me>>4]=from;
      if(fl&CAS){var rf,rt;if(to===from+2){rf=from+3;rt=from+1}else{rf=from-4;rt=from-1}bd[rf]=bd[rt];bd[rt]=0}}
    var cap=U_cap[sp];if(cap){bd[(fl&EPF)?to+(me===W?16:-16):to]=cap}
    cast=U_cast[sp];ep=U_ep[sp];half=U_half[sp];hash=U_hash[sp];
    if(me===BK)full--;ph.pop();
  }
  function legal(){
    var mv=gen(false),out=[],me=side;
    for(var i=0;i<mv.length;i++){make(mv[i]);if(!attacked(kings[me>>4],side))out.push(mv[i]);unmake(mv[i])}
    return out;
  }
  function perft(d){
    if(d===0)return 1;var mv=gen(false),n=0,me=side;
    for(var i=0;i<mv.length;i++){make(mv[i]);if(!attacked(kings[me>>4],side))n+=perft(d-1);unmake(mv[i])}
    return n;
  }
  function repCount(){
    var n=0,stop=Math.max(0,ph.length-1-half);
    for(var i=ph.length-1;i>=stop;i-=2)if(ph[i]===hash)n++;
    return n;
  }
  function isRep(){
    var stop=Math.max(0,ph.length-1-half);
    for(var i=ph.length-3;i>=stop;i-=2)if(ph[i]===hash)return true;
    return false;
  }
  function insufficient(){
    var minors=0,bishopColors=0,knights=0;
    for(var s=0;s<128;s++){if(s&0x88){s+=7;continue}var t=bd[s]&7;
      if(!t||t===KING)continue;
      if(t===PAWN||t===ROOK||t===QUEEN)return false;
      minors++;if(t===KNIGHT)knights++;else bishopColors|=(((s>>4)+(s&7))&1)?2:1}
    if(minors<=1)return true;
    return knights===0&&bishopColors!==3;
  }

  opts.forEach(function(o){var bt=document.createElement("button");bt.type="button";bt.setAttribute("aria-label",o[1]);bt.title=o[1];bt.innerHTML=svgPiece(col|o[0]);
    bt.addEventListener("click",function(e){e.stopPropagation();var m=cands.filter(function(x){return mPromo(x)===o[0]})[0];closePromo();if(m)commit(m,anim)});
    promoRow.appendChild(bt)});
  promoEl.hidden=false;promoRow.firstChild.focus();
}
function closePromo(silent){promoPending=null;promoEl.hidden=true;if(!silent)paint()}
promoEl.addEventListener("pointerdown",function(e){e.stopPropagation();if(e.target===promoEl){closePromo();sel=-1;paint()}});

function aiTurn(){
  busy=true;setStatus();var my=token,t0=Date.now();
  requestAnimationFrame(function(){setTimeout(function(){
    if(my!==token)return;
    requestThink(function(m){
      if(my!==token||over)return;
      if(legalList.indexOf(m)<0)m=legalList[Math.floor(Math.random()*legalList.length)];
      var wait=Math.max(0,(diff==="facil"?650:450)-(Date.now()-t0));
      setTimeout(function(){if(my!==token||over)return;busy=false;commit(m,true)},wait);
    });
  },20)});
}

function checkEnd(){
  var res=null,wt=G.turn()===WH;
  if(!legalList.length){
    if(G.inCheck())res={w:wt?"o":"x",t:"Xeque-mate!"};
    else res={w:"d",t:"Afogamento — empate",p:"Quem joga não está em xeque, mas não tem nenhum lance legal."};
  }else if(G.insufficient())res={w:"d",t:"Empate",p:"Material insuficiente para dar xeque-mate."};
  else if(G.reps()>=3)res={w:"d",t:"Empate por repetição",p:"A mesma posição apareceu três vezes."};
  else if(G.half()>=100)res={w:"d",t:"Empate — regra dos 50 lances",p:"Foram 50 lances de cada lado sem captura nem movimento de peão."};
  if(!res)return false;
  over=true;busy=false;
  var text=res.p;
  if(res.w==="d"){score.d++;statusEl.textContent=res.t+"."}
  else{
    if(res.w==="x")score.x++;else score.o++;
    if(mode==="2p"){text=res.w==="x"?"As brancas venceram. Boa partida!":"As pretas venceram. Boa partida!";statusEl.textContent="Xeque-mate — "+(res.w==="x"?"brancas":"pretas")+" vencem."}
    else if(res.w==="x"){text=diff==="dificil"?"Você venceu o computador no Difícil. Impressionante!":"Você venceu! Que tal tentar o Difícil?";statusEl.textContent="Xeque-mate — você venceu!"}
    else{text="O computador venceu. Bora a revanche?";statusEl.textContent="Xeque-mate — o computador venceu."}
  }
  statusEl.classList.remove("chk");
  store.set("placar:"+key(),score);paintScore();setStatus();
  $("ovt").textContent=res.t;$("ovp").textContent=text;
  var my=token;setTimeout(function(){if(over&&my===token){ov.hidden=false;$("again").focus()}},900);
  return true;
}

/* toque, clique e arrastar */
function sqAt(x,y){
  var r=boardEl.getBoundingClientRect(),c=Math.floor((x-r.left)/r.width*8),w=Math.floor((y-r.top)/r.height*8);
  if(c<0||c>7||w<0||w>7)return -1;return w*16+c;
}
function handleSquare(s){
  if(!humanTurn())return;
  if(sel>=0&&isTarget(sel,s)){tryMove(sel,s,true);return}
  var pc=G.at(s);
  if(pc&&(pc&24)===G.turn()){sel=sel===s?-1:s}else sel=-1;
  paint();
}
boardEl.addEventListener("contextmenu",function(e){e.preventDefault()});
boardEl.addEventListener("pointerdown",function(e){
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var s=sqAt(e.clientX,e.clientY);if(s<0)return;
  e.preventDefault();
  focusIdx=idxOf(s);
  if(!humanTurn())return;
  if(sel>=0&&isTarget(sel,s)){tryMove(sel,s,true);return}
  var pc=G.at(s);
  if(pc&&(pc&24)===G.turn()){
    var was=sel===s;sel=s;paint();
    drag={s:s,id:e.pointerId,x:e.clientX,y:e.clientY,was:was,on:false,el:pieceEls[s]};
    try{boardEl.setPointerCapture(e.pointerId)}catch(_){}
  }else{sel=-1;paint()}
});
boardEl.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.id||!drag.el)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on&&Math.hypot(dx,dy)>5){drag.on=true;drag.el.classList.add("drag")}
  if(drag.on)drag.el.style.transform="translate("+dx+"px,"+dy+"px)";
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;
  if(d.on){
    var to=cancel?-1:sqAt(e.clientX,e.clientY);
    if(to>=0&&to!==d.s&&isTarget(d.s,to)){tryMove(d.s,to,false);return}
    d.el.classList.remove("drag");d.el.style.transform="";
  }else if(d.was){sel=-1;paint()}
}
boardEl.addEventListener("pointerup",function(e){endDrag(e,false)});
boardEl.addEventListener("pointercancel",function(e){endDrag(e,true)});
grid.addEventListener("keydown",function(e){
  var i=focusIdx,k=e.key;
  if(k==="Enter"||k===" "){e.preventDefault();handleSquare(sqOf(i));return}
  var d={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[k];if(!d)return;e.preventDefault();
  var r=(i>>3)+d[0],c=(i&7)+d[1];if(r<0||r>7||c<0||c>7)return;
  focusIdx=r*8+c;paint();sqEls[focusIdx].focus();
});
grid.addEventListener("focusin",function(e){var t=e.target;if(t.dataset&&t.dataset.i!=null&&+t.dataset.i!==focusIdx){focusIdx=+t.dataset.i;paint()}});

function fit(){
  var s=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight-52,560));s-=s%8;s=Math.max(200,s);
  boardEl.style.setProperty("--s",s+"px");$("capT").style.width=$("capB").style.width=s+"px";
}
document.querySelectorAll("[data-mode]").forEach(function(x){x.addEventListener("click",function(){if(mode===x.dataset.mode)return;mode=x.dataset.mode;store.set("modo",mode);applyUi();newGame()})});
document.querySelectorAll("[data-diff]").forEach(function(x){x.addEventListener("click",function(){if(diff===x.dataset.diff)return;diff=x.dataset.diff;store.set("dificuldade",diff);applyUi();newGame()})});
$("reset").addEventListener("click",function(){score={x:0,o:0,d:0};store.set("placar:"+key(),score);paintScore()});
$("novo").addEventListener("click",newGame);
$("again").addEventListener("click",function(){newGame();sqEls[focusIdx].focus()});
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape")return;
  if(!ov.hidden)ov.hidden=true;else if(promoPending){closePromo();sel=-1;paint()}
});
window.addEventListener("resize",fit);
applyUi();fit();newGame();
})();
</script>
