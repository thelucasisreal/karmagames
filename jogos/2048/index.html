<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · Karma Games</title>
<meta name="theme-color" content="#0d0e12">
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Unbounded";font-weight:800;font-style:normal;font-display:swap;src:url(../../assets/fonts/unbounded-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-600-normal.woff2) format("woff2")}
:root{--bg:#0d0e12;--surface:#171920;--raised:#1f222b;--line:#262a33;--text:#f2f3f5;--muted:#9aa0ab;--accent:#c8f13a;--coral:#ff6b5a;--sky:#5ac8ff;--amber:#ffc23a;--r:12px;--ease:cubic-bezier(.16,1,.3,1);--display:"Unbounded",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:400 15px/1.4 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;height:100dvh;display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
::selection{background:var(--accent);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 18px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:14px;transition:background-color .2s var(--ease),transform .2s var(--ease),opacity .2s}
.btn:hover{background:#292d38}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover{background:#d4f75a}
.app{width:min(100%,520px);height:100%;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 clamp(28px,8vw,40px)/1 var(--display);letter-spacing:-.02em}
.stats{display:flex;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;min-width:84px;text-align:center}
.stat .lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .val{display:block;font:800 18px/1.3 var(--display);font-variant-numeric:tabular-nums}
.stat .val.bump{animation:bump .3s var(--ease)}
@keyframes bump{from{transform:scale(1.18);color:var(--accent)}to{transform:none}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;margin-left:auto}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
.board{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.35);touch-action:none;--gap:10px;--cell:80px}
.cell,.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--gap) + var(--col) * (var(--cell) + var(--gap))),calc(var(--gap) + var(--row) * (var(--cell) + var(--gap))))}
.cell{background:var(--raised);border-radius:var(--r)}
.tile{transition:transform .12s var(--ease);z-index:2}
.tile.gone{z-index:1}
.tile .in{width:100%;height:100%;border-radius:var(--r);display:grid;place-items:center;font:800 calc(var(--cell)*.4)/1 var(--display);font-variant-numeric:tabular-nums;background:#2b303b;color:var(--text);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tile[data-d="3"] .in{font-size:calc(var(--cell)*.33)}
.tile[data-d="4"] .in{font-size:calc(var(--cell)*.27)}
.tile[data-d="5"] .in{font-size:calc(var(--cell)*.22)}
.tile.new .in{animation:appear .22s var(--ease) .1s backwards}
.tile.pop .in{animation:pop .22s var(--ease)}
@keyframes appear{from{transform:scale(.3);opacity:0}}
@keyframes pop{0%{transform:scale(1.16)}100%{transform:scale(1)}}
.tile[data-v="4"] .in{background:#3a404d}
.tile[data-v="8"] .in{background:#1e5470}
.tile[data-v="16"] .in{background:var(--sky);color:var(--bg)}
.tile[data-v="32"] .in{background:#7a5b14}
.tile[data-v="64"] .in{background:var(--amber);color:var(--bg)}
.tile[data-v="128"] .in{background:#8a3328}
.tile[data-v="256"] .in{background:var(--coral);color:var(--bg)}
.tile[data-v="512"] .in{background:#ff9a52;color:var(--bg)}
.tile[data-v="1024"] .in{background:#e2ea4a;color:var(--bg)}
.tile[data-v="2048"] .in{background:var(--accent);color:var(--bg)}
.tile[data-v="big"] .in{background:var(--text);color:var(--bg)}
.foot{text-align:center;color:var(--muted);font-size:13px}
kbd{font:600 12px "Geist",system-ui,sans-serif;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--text)}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(13,14,18,.8);animation:fade .25s var(--ease)}
.overlay[hidden]{display:none}
.card{width:min(100%,340px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px 24px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:rise .35s var(--ease)}
.card h2{font:800 26px/1.15 var(--display);margin-bottom:8px}
.card p{color:var(--muted);margin-bottom:20px;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
@media (max-width:420px){.stat{min-width:72px;padding:6px 10px}.hint{font-size:13px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>2048</h1>
    <div class="stats">
      <div class="stat"><span class="lbl">Pontos</span><span class="val" id="score" aria-live="polite">0</span></div>
      <div class="stat"><span class="lbl">Recorde</span><span class="val" id="best">0</span></div>
    </div>
  </header>
  <div class="bar">
    <p class="hint">Junte peças iguais até formar 2048.</p>
    <div class="actions">
      <button class="btn" id="undo" type="button" disabled>Desfazer</button>
      <button class="btn primary" id="new" type="button">Novo jogo</button>
    </div>
  </div>
  <div class="wrap" id="wrap">
    <div class="board" id="board" role="application" aria-label="Tabuleiro do 2048. Use as setas para mover.">
      <div id="cells"></div>
      <div id="tiles"></div>
    </div>
  </div>
  <p class="foot">Deslize na tela ou use <kbd>setas</kbd> / <kbd>WASD</kbd>. <kbd>Z</kbd> desfaz.</p>
</main>
<div class="overlay" id="ov" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ovt">
    <h2 id="ovt"></h2>
    <p id="ovp"></p>
    <div class="row" id="ovr"></div>
  </div>
</div>
<script>
(function(){
"use strict";
var SLUG="karma:2048:";
var store={get:function(k,d){try{var v=localStorage.getItem(SLUG+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(SLUG+k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(SLUG+k)}catch(e){}}};
var N=4,grid,score=0,best=+store.get("best",0)||0,won=false,over=false,prev=null;
var $=function(id){return document.getElementById(id)};
var board=$("board"),wrap=$("wrap"),tilesEl=$("tiles"),cellsEl=$("cells"),scoreEl=$("score"),bestEl=$("best"),undoBtn=$("undo");
var ov=$("ov"),ovt=$("ovt"),ovp=$("ovp"),ovr=$("ovr");

for(var r=0;r<N;r++)for(var c=0;c<N;c++){var d=document.createElement("div");d.className="cell";d.style.setProperty("--row",r);d.style.setProperty("--col",c);cellsEl.appendChild(d)}

function fit(){
  var s=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight));
  if(s<120)s=120;
  board.style.width=board.style.height=s+"px";
  var gap=Math.max(6,Math.round(s*.028));
  board.style.setProperty("--gap",gap+"px");
  board.style.setProperty("--cell",((s-2-gap*(N+1))/N)+"px");
}
window.addEventListener("resize",fit);

function paint(t){
  t.inn.textContent=t.v;
  t.el.dataset.v=t.v>2048?"big":t.v;
  t.el.dataset.d=Math.min(5,String(t.v).length);
}
function place(t){t.el.style.setProperty("--row",t.r);t.el.style.setProperty("--col",t.c)}
function makeTile(r,c,v,cls){
  var el=document.createElement("div");el.className="tile"+(cls?" "+cls:"");
  var inn=document.createElement("div");inn.className="in";el.appendChild(inn);
  var t={r:r,c:c,v:v,el:el,inn:inn};paint(t);place(t);tilesEl.appendChild(el);return t;
}
function empty(){var g=[];for(var i=0;i<N;i++)g.push([null,null,null,null]);return g}
function spawn(){
  var free=[];for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(!grid[r][c])free.push([r,c]);
  if(!free.length)return;
  var p=free[Math.floor(Math.random()*free.length)];
  grid[p[0]][p[1]]=makeTile(p[0],p[1],Math.random()<.9?2:4,"new");
}
function serialize(){return {g:grid.map(function(row){return row.map(function(t){return t?t.v:0})}),s:score,w:won}}
function load(state){
  tilesEl.innerHTML="";grid=empty();
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var v=state.g[r][c];if(v)grid[r][c]=makeTile(r,c,v,"new")}
  score=state.s||0;won=!!state.w;over=false;
}
function setScore(bump){
  scoreEl.textContent=score;
  if(bump){scoreEl.classList.remove("bump");void scoreEl.offsetWidth;scoreEl.classList.add("bump")}
  if(score>best){best=score;store.set("best",best)}
  bestEl.textContent=best;
}
function newGame(){
  hideOverlay();
  tilesEl.innerHTML="";grid=empty();score=0;won=false;over=false;prev=null;
  spawn();spawn();setScore(false);undoBtn.disabled=true;save();
}
function save(){if(over)store.del("state");else store.set("state",serialize())}
function canMove(){
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var t=grid[r][c];if(!t)return true;
    if(c<N-1&&grid[r][c+1]&&grid[r][c+1].v===t.v)return true;
    if(r<N-1&&grid[r+1][c]&&grid[r+1][c].v===t.v)return true;
  }
  return false;
}
function move(dir){ /* 0 cima, 1 direita, 2 baixo, 3 esquerda */
  if(over||!ov.hidden)return;
  var snap=serialize(),moved=false,gained=0,merges=[],doomed=[];
  var ng=empty();
  for(var i=0;i<N;i++){
    var coords=[];
    for(var j=0;j<N;j++){
      if(dir===0)coords.push([j,i]);else if(dir===2)coords.push([N-1-j,i]);
      else if(dir===3)coords.push([i,j]);else coords.push([i,N-1-j]);
    }
    var line=[];coords.forEach(function(p){if(grid[p[0]][p[1]])line.push(grid[p[0]][p[1]])});
    var out=[];
    line.forEach(function(t){
      var last=out[out.length-1],p;
      if(last&&!last._m&&last.v===t.v){
        last.v*=2;last._m=true;gained+=last.v;merges.push(last);
        p=coords[out.length-1];t.r=p[0];t.c=p[1];place(t);t.el.classList.add("gone");doomed.push(t);moved=true;
      }else{
        out.push(t);p=coords[out.length-1];
        if(t.r!==p[0]||t.c!==p[1])moved=true;
        t.r=p[0];t.c=p[1];place(t);ng[t.r][t.c]=t;
      }
    });
  }
  if(!moved)return;
  merges.forEach(function(t){t._m=false});
  grid=ng;prev=snap;undoBtn.disabled=false;
  setTimeout(function(){
    doomed.forEach(function(t){t.el.remove()});
    merges.forEach(function(t){paint(t);t.el.classList.remove("new","pop");void t.el.offsetWidth;t.el.classList.add("pop")});
  },110);
  score+=gained;setScore(gained>0);
  spawn();
  var hit=false;for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]&&grid[r][c].v===2048)hit=true;
  if(hit&&!won){won=true;setTimeout(function(){showOverlay("Você chegou a 2048!","Pontuação: "+score+". Quer continuar tentando ir além?",[["Continuar",hideOverlay,false],["Jogar de novo",newGame,true]])},380)}
  else if(!canMove()){over=true;setTimeout(function(){showOverlay("Fim de jogo","Sem movimentos. Você fez "+score+" pontos"+(score>=best&&score>0?" — novo recorde!":"."),[["Jogar de novo",newGame,true]])},420)}
  save();
}
function undo(){
  if(!prev)return;
  hideOverlay();load(prev);prev=null;undoBtn.disabled=true;setScore(false);save();
}

var lastFocus=null;
function showOverlay(title,text,btns){
  lastFocus=document.activeElement;
  ovt.textContent=title;ovp.textContent=text;ovr.innerHTML="";var primary=null;
  btns.forEach(function(b){var el=document.createElement("button");el.type="button";el.className="btn"+(b[2]?" primary":"");el.textContent=b[0];el.addEventListener("click",b[1]);ovr.appendChild(el);if(b[2])primary=el});
  if(over&&prev){var u=document.createElement("button");u.type="button";u.className="btn";u.textContent="Desfazer";u.addEventListener("click",function(){over=false;undo()});ovr.insertBefore(u,ovr.firstChild)}
  ov.hidden=false;(primary||ovr.firstChild).focus();
}
function hideOverlay(){if(ov.hidden)return;ov.hidden=true;if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}

$("new").addEventListener("click",newGame);
undoBtn.addEventListener("click",undo);

var keys={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(!ov.hidden){if(e.key==="Escape"&&won&&!over)hideOverlay();return}
  if(e.key in keys){e.preventDefault();move(keys[e.key])}
  else if(e.key==="z"||e.key==="Z"){undo()}
});

var sx=0,sy=0,sid=null;
wrap.addEventListener("pointerdown",function(e){sid=e.pointerId;sx=e.clientX;sy=e.clientY});
wrap.addEventListener("pointerup",function(e){
  if(e.pointerId!==sid)return;sid=null;
  var dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
  if(Math.max(ax,ay)<24)return;
  if(ax>ay)move(dx>0?1:3);else move(dy>0?2:0);
});
wrap.addEventListener("pointercancel",function(){sid=null});
document.addEventListener("touchmove",function(e){if(e.target.closest&&e.target.closest(".wrap"))e.preventDefault()},{passive:false});

fit();
var saved=store.get("state",null);
if(saved&&saved.g&&saved.g.length===N){try{load(saved);setScore(false);if(!canMove())newGame()}catch(e){newGame()}}else newGame();
})();
</script>
</body>
</html>
