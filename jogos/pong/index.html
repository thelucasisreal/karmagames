<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<title>Pong · Karma Games</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:800;font-display:swap;src:url("../../assets/fonts/unbounded-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url("../../assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0e12;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Pong"></canvas>
<script>
const SLUG = 'pong';
(() => {
'use strict';
/* ---------- Núcleo compartilhado (Karma Games) ---------- */
const COL = {bg:'#0d0e12', surf:'#171920', line:'#262a33', text:'#f2f3f5', muted:'#9aa0ab', acc:'#c8f13a', coral:'#ff6b5a', sky:'#5ac8ff', shadow:'rgba(0,0,0,0.42)'};
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)') || ('ontouchstart' in window);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const FT = s => '800 ' + Math.round(s) + 'px Unbounded, system-ui, sans-serif';
const FS = s => '500 ' + Math.round(s) + 'px Geist, system-ui, sans-serif';

/* Recorde */
const KEY = 'karma:' + SLUG + ':recorde';
function loadBest() { try { const v = parseInt(window.localStorage.getItem(KEY), 10); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
let best = loadBest();

/* Fontes: espera antes do primeiro texto no canvas */
let fontsReady = false;
(function () {
  let done = false;
  const finish = () => { if (!done) { done = true; fontsReady = true; } };
  setTimeout(finish, 1500);
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 32px Unbounded'), document.fonts.load('500 16px Geist')])
        .then(() => document.fonts.ready).then(finish, finish);
    } else finish();
  } catch (e) { finish(); }
})();

/* Estado */
let state = 'menu';         // menu | play | paused | over (+ estados próprios do jogo)
let stateT = 0;             // tempo no estado atual
let newRecord = false;
let lastScore = 0;
function setState(s) { state = s; stateT = 0; }
function finishGame(score) {
  lastScore = score;
  newRecord = score > best && score > 0;
  if (newRecord) { best = score; saveBest(best); }
  setState('over');
}

/* Tremor de tela */
let shakeT = 0, shakeDur = 1, shakeMag = 0;
function shake(mag, dur) {
  if (reduceMotion) return;
  if (mag >= shakeMag * (shakeT / shakeDur)) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
}

/* Partículas (coordenadas do jogo) */
const parts = [];
function burst(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color, g: grav || 0});
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vx *= Math.pow(0.04, dt); p.vy *= Math.pow(0.04, dt);
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(scale) {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.4 + 0.6 * k) * (scale || 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Desenho utilitário */
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align, base) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.fillText(s, x, y);
}
function fitFont(s, maxW, size, maker) {
  ctx.font = maker(size);
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}

/* Botão de pausa (toque) */
const pauseBtn = {x: 0, y: 0, s: 40};
function layoutPauseBtn() { pauseBtn.s = 40; pauseBtn.x = W - pauseBtn.s - 12; pauseBtn.y = 10; }
function hitPause(x, y) { const b = pauseBtn; return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6; }
function drawPauseBtn() {
  const b = pauseBtn;
  ctx.fillStyle = COL.surf; rrect(b.x, b.y, b.s, b.s, 10); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(b.x + 0.5, b.y + 0.5, b.s - 1, b.s - 1, 10); ctx.stroke();
  ctx.fillStyle = COL.muted;
  ctx.fillRect(b.x + b.s * 0.36, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
  ctx.fillRect(b.x + b.s * 0.54, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
}

/* Cartão de tela (início / pausa / fim) */
function drawCard(o) {
  ctx.fillStyle = 'rgba(13,14,18,' + (o.dim == null ? 0.72 : o.dim) + ')';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(W - 32, 440);
  const pad = cw < 340 ? 22 : 30;
  const inner = cw - pad * 2;
  let ts = fitFont(o.title, inner, cw < 340 ? 30 : 38, FT);
  const rows = o.rows || [];
  const lines = o.lines || [];
  let h = pad + ts * 1.15;
  if (o.kicker) h += 22;
  if (o.big != null) h += 78;
  h += rows.length * 34 + (rows.length ? 12 : 0);
  h += lines.length * 24 + (lines.length ? 14 : 0);
  if (o.cta) h += 62;
  if (o.hint) h += 30;
  h += pad - 6;
  const cx = (W - cw) / 2;
  const cy = Math.max(12, (H - h) / 2);
  // sombra deslocada + superfície
  ctx.fillStyle = COL.shadow; rrect(cx + 6, cy + 8, cw, h, 18); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(cx, cy, cw, h, 18); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(cx + 0.5, cy + 0.5, cw - 1, h - 1, 18); ctx.stroke();
  let y = cy + pad;
  if (o.kicker) { txt(o.kicker.toUpperCase(), W / 2, y + 6, FS(12), o.kickerColor || COL.acc); y += 22; }
  txt(o.title, W / 2, y + ts * 0.55, FT(ts), COL.text); y += ts * 1.15;
  if (o.big != null) {
    txt(String(o.big), W / 2, y + 40, FT(fitFont(String(o.big), inner, 56, FT)), COL.acc); y += 78;
  }
  if (rows.length) {
    y += 6;
    for (const r of rows) {
      ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(cx + pad, y + 0.5); ctx.lineTo(cx + cw - pad, y + 0.5); ctx.stroke();
      txt(r[0], cx + pad, y + 18, FS(15), COL.muted, 'left');
      txt(r[1], cx + cw - pad, y + 18, FT(16), r[2] || COL.text, 'right');
      y += 34;
    }
    y += 6;
  }
  if (lines.length) {
    y += 6;
    for (const l of lines) { txt(l, W / 2, y + 10, FS(fitFont(l, inner, 15, FS)), COL.muted); y += 24; }
    y += 8;
  }
  if (o.cta) {
    const bw = Math.min(inner, 280), bh = 48, bx = (W - bw) / 2, by = y + 6;
    const pulse = reduceMotion ? 0 : (Math.sin(perfNow * 4) * 0.5 + 0.5);
    ctx.fillStyle = COL.shadow; rrect(bx + 3, by + 4, bw, bh, 12); ctx.fill();
    ctx.fillStyle = COL.acc; rrect(bx, by - pulse * 1.5, bw, bh, 12); ctx.fill();
    txt(o.cta, W / 2, by + bh / 2 - pulse * 1.5 + 1, FT(fitFont(o.cta, bw - 24, 15, FT)), COL.bg);
    y += 62;
  }
  if (o.hint) { txt(o.hint, W / 2, y + 14, FS(fitFont(o.hint, inner, 13, FS)), COL.muted); y += 30; }
}

/* HUD: rótulo pequeno + valor */
function hudStat(label, value, x, y, align, color) {
  txt(label.toUpperCase(), x, y, FS(11), COL.muted, align, 'top');
  txt(String(value), x, y + 15, FT(22), color || COL.text, align, 'top');
}

let perfNow = 0;

/* ---------- Pong ----------
   Espaço do jogo: u = eixo longo (jogador em u=0, CPU em u=L), v = eixo curto.
   Em retrato o campo é desenhado na vertical (jogador embaixo). */
const L = 900, B = 560, P = 104, PT = 14, PU = 34, BR = 9, WIN = 7;
let sc = 1, ox = 0, oy = 0, portrait = false;
let me = {v: B / 2, target: null}, cpu = {v: B / 2, err: 0, target: B / 2};
let ball = {u: L / 2, v: B / 2, vu: 0, vv: 0, speed: 460};
let ps = 0, cs = 0, serveT = 0, serveDir = -1, streak = 0, trail = [], hitFlash = [0, 0];
let keys = {minus: false, plus: false}, scoreFlash = 0, lastPoint = 0, won = false;

function layout() {
  portrait = H > W;
  const top = 64;
  if (portrait) { sc = Math.min((W - 24) / B, (H - top - 16) / L); ox = (W - B * sc) / 2; oy = top + (H - top - 16 - L * sc) / 2; }
  else { sc = Math.min((W - 32) / L, (H - top - 16) / B); ox = (W - L * sc) / 2; oy = top + (H - top - 16 - B * sc) / 2; }
}
function S(u, v) { return portrait ? [ox + v * sc, oy + (L - u) * sc] : [ox + u * sc, oy + v * sc]; }
function vFromScreen(x, y) { return portrait ? (x - ox) / sc : (y - oy) / sc; }

function serve() {
  ball.u = L / 2; ball.v = B / 2; ball.vu = 0; ball.vv = 0; ball.speed = 460;
  serveT = 0.9; trail = [];
  cpu.err = 0;
}
function launchBall() {
  const a = rand(-0.5, 0.5);
  ball.vu = Math.cos(a) * ball.speed * serveDir; ball.vv = Math.sin(a) * ball.speed;
}
function newMatch() { ps = 0; cs = 0; serveDir = -1; me.v = cpu.v = B / 2; parts.length = 0; serve(); won = false; }
function predictV() {
  // projeta onde a bola cruza a face da CPU, com rebatidas nas paredes
  if (ball.vu <= 0) return B / 2;
  const t = (L - PU - PT / 2 - BR - ball.u) / ball.vu;
  let v = ball.v + ball.vv * t;
  const lo = BR, hi = B - BR, span = hi - lo;
  v = v - lo; v = ((v % (2 * span)) + 2 * span) % (2 * span); if (v > span) v = 2 * span - v;
  return v + lo;
}
function paddleHit(isMe) {
  const pv = isMe ? me.v : cpu.v;
  const off = clamp((ball.v - pv) / (P / 2 + BR), -1, 1);
  const a = off * 0.95;
  ball.speed = Math.min(ball.speed * 1.055, 1050);
  ball.vu = Math.cos(a) * ball.speed * (isMe ? 1 : -1);
  ball.vv = Math.sin(a) * ball.speed;
  hitFlash[isMe ? 0 : 1] = 1;
  const [x, y] = S(isMe ? PU + PT / 2 : L - PU - PT / 2, ball.v);
  burst(x, y, 8, isMe ? COL.acc : COL.sky, 260, 0.4, 5, 0);
  shake(2, 0.1);
  if (isMe) {
    // erro da CPU: maior quando a bola está lenta, menor perto do fim
    const k = 0.55 + Math.random() * 0.5;
    cpu.err = (Math.random() < 0.5 ? -1 : 1) * k * (P / 2) * (0.55 + Math.min(ps, 5) * 0.05);
  }
}
function point(meScored) {
  if (state === 'menu') { serveDir = meScored ? 1 : -1; serve(); return; }
  if (meScored) ps++; else cs++;
  lastPoint = meScored ? 1 : -1; scoreFlash = 1;
  const [x, y] = S(clamp(ball.u, 0, L), ball.v);
  burst(x, y, 24, meScored ? COL.acc : COL.coral, 420, 0.7, 6, 0);
  shake(9, 0.3);
  if (ps >= WIN || cs >= WIN) {
    won = ps > cs;
    streak = won ? streak + 1 : 0;
    finishGame(streak);
    if (!won) lastScore = 0;
    return;
  }
  serveDir = meScored ? 1 : -1;
  serve();
}
function step(dt) {
  const n = Math.max(1, Math.ceil(ball.speed * dt / (BR * 0.6)));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    const pu = ball.u;
    ball.u += ball.vu * h; ball.v += ball.vv * h;
    if (ball.v < BR) { ball.v = BR; ball.vv = Math.abs(ball.vv); }
    if (ball.v > B - BR) { ball.v = B - BR; ball.vv = -Math.abs(ball.vv); }
    const myFace = PU + PT / 2 + BR, cpuFace = L - PU - PT / 2 - BR;
    if (ball.vu < 0 && pu >= myFace - 1 && ball.u <= myFace && Math.abs(ball.v - me.v) <= P / 2 + BR) { ball.u = myFace; paddleHit(true); }
    else if (ball.vu > 0 && pu <= cpuFace + 1 && ball.u >= cpuFace && Math.abs(ball.v - cpu.v) <= P / 2 + BR) { ball.u = cpuFace; paddleHit(false); }
    if (ball.u < -BR * 2) { point(false); return; }
    if (ball.u > L + BR * 2) { point(true); return; }
  }
}

const GAME = {
  resize() { layout(); },
  start() { newMatch(); setState('play'); },
  key(e, down) {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowLeft' || k === 'w' || k === 'W' || k === 'a' || k === 'A') keys.minus = down;
    else if (k === 'ArrowDown' || k === 'ArrowRight' || k === 's' || k === 'S' || k === 'd' || k === 'D') keys.plus = down;
    if (down) me.target = null;
  },
  pointer(type, x, y, e) {
    if (type === 'down' || (type === 'move' && (e.pointerType === 'mouse' || (e.buttons & 1)))) me.target = vFromScreen(x, y);
  },
  update(dt) {
    scoreFlash = Math.max(0, scoreFlash - dt * 2);
    hitFlash[0] = Math.max(0, hitFlash[0] - dt * 5); hitFlash[1] = Math.max(0, hitFlash[1] - dt * 5);
    if (state === 'menu') {
      // demonstração: CPU contra CPU
      if (ball.vu === 0 && serveT <= 0) { serveDir = Math.random() < 0.5 ? 1 : -1; launchBall(); }
      if (serveT > 0) { serveT -= dt; if (serveT <= 0) launchBall(); }
      me.v = lerp(me.v, ball.v, 1 - Math.exp(-6 * dt)); cpu.v = lerp(cpu.v, ball.v, 1 - Math.exp(-6 * dt));
      me.v = clamp(me.v, P / 2, B - P / 2); cpu.v = clamp(cpu.v, P / 2, B - P / 2);
      ball.speed = 380;
      const sp = Math.hypot(ball.vu, ball.vv) || 1;
      ball.vu = ball.vu / sp * 380; ball.vv = ball.vv / sp * 380;
      step(dt);
      if (state !== 'menu') return;
      ps = cs = 0;
      return;
    }
    if (state !== 'play') return;
    // jogador
    const kd = (keys.plus ? 1 : 0) - (keys.minus ? 1 : 0);
    if (kd) me.v += kd * 640 * dt;
    else if (me.target != null) me.v = lerp(me.v, me.target, 1 - Math.exp(-26 * dt));
    me.v = clamp(me.v, P / 2, B - P / 2);
    // CPU
    const cpuMax = 330 + ps * 14 + Math.max(0, ps - cs) * 12;
    let tgt;
    if (ball.vu > 0 && ball.u > L * 0.28) tgt = predictV() + cpu.err;
    else tgt = B / 2 + (ball.v - B / 2) * 0.3;
    cpu.target = lerp(cpu.target, tgt, 1 - Math.exp(-9 * dt));
    const d = cpu.target - cpu.v;
    cpu.v += clamp(d, -cpuMax * dt, cpuMax * dt);
    cpu.v = clamp(cpu.v, P / 2, B - P / 2);
    // bola
    if (serveT > 0) { serveT -= dt; if (serveT <= 0) launchBall(); return; }
    step(dt);
    if (state === 'play') { trail.push([ball.u, ball.v]); if (trail.length > 10) trail.shift(); }
  },
  draw() {
    const fw = (portrait ? B : L) * sc, fh = (portrait ? L : B) * sc;
    ctx.fillStyle = COL.shadow; rrect(ox + 6, oy + 8, fw, fh, 16); ctx.fill();
    ctx.fillStyle = COL.surf; rrect(ox, oy, fw, fh, 16); ctx.fill();
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; rrect(ox + 0.75, oy + 0.75, fw - 1.5, fh - 1.5, 16); ctx.stroke();
    // rede tracejada
    ctx.fillStyle = COL.line;
    const dash = 18 * sc, gap = 14 * sc;
    if (portrait) { const y = oy + fh / 2 - 2 * sc; for (let x = ox + 10 * sc; x < ox + fw - 10 * sc; x += dash + gap) ctx.fillRect(x, y, Math.min(dash, ox + fw - 10 * sc - x), 4 * sc); }
    else { const x = ox + fw / 2 - 2 * sc; for (let y = oy + 10 * sc; y < oy + fh - 10 * sc; y += dash + gap) ctx.fillRect(x, y, 4 * sc, Math.min(dash, oy + fh - 10 * sc - y)); }
    // placar no fundo
    if (fontsReady && state !== 'menu') {
      const big = Math.min(fw, fh) * 0.28;
      const [mx, my] = S(L * 0.25, B / 2), [cx, cy] = S(L * 0.75, B / 2);
      const pulse = (who) => lastPoint === who ? 1 + scoreFlash * 0.25 : 1;
      txt(String(ps), mx, my, FT(big * pulse(1)), lastPoint === 1 && scoreFlash > 0 ? COL.acc : '#22262f');
      txt(String(cs), cx, cy, FT(big * pulse(-1)), lastPoint === -1 && scoreFlash > 0 ? COL.coral : '#22262f');
    }
    // raquetes
    const paddle = (u, v, color, flash) => {
      const [x0, y0] = S(u - PT / 2, v - P / 2), [x1, y1] = S(u + PT / 2, v + P / 2);
      const x = Math.min(x0, x1), y = Math.min(y0, y1), w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
      const grow = flash * 3 * sc;
      ctx.fillStyle = COL.shadow; rrect(x + 4, y + 5, w, h, 7 * sc); ctx.fill();
      ctx.fillStyle = flash > 0.5 ? COL.text : color; rrect(x - grow / 2, y - grow / 2, w + grow, h + grow, 7 * sc); ctx.fill();
    };
    paddle(PU, me.v, COL.acc, hitFlash[0]);
    paddle(L - PU, cpu.v, COL.sky, hitFlash[1]);
    // bola
    if (state === 'play' || state === 'menu' || state === 'paused') {
      for (let i = 0; i < trail.length; i++) {
        const k = (i + 1) / trail.length; const [x, y] = S(trail[i][0], trail[i][1]);
        ctx.globalAlpha = k * 0.16; ctx.fillStyle = COL.text; ctx.beginPath(); ctx.arc(x, y, BR * sc * k, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const [bx, by] = S(ball.u, ball.v);
      const r = BR * sc * (serveT > 0 && !reduceMotion ? 1 + Math.sin(serveT * 18) * 0.15 : 1);
      ctx.fillStyle = COL.shadow; ctx.beginPath(); ctx.arc(bx + 3, by + 4, r, 0, 7); ctx.fill();
      ctx.fillStyle = COL.text; ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill();
    }
    drawParts();
  },
  drawUI() {
    if (state === 'menu') {
      drawCard({dim: 0.55, kicker: 'Karma Games', title: 'Pong', lines: ['Você contra a CPU.', 'Quem fizer 7 pontos primeiro vence.'], cta: coarse ? 'Toque para começar' : 'Aperte Espaço para começar', hint: coarse ? 'Arraste o dedo para mover a raquete' : (portrait ? 'Mouse ou setas ← → movem · P pausa' : 'Mouse, W/S ou setas ↑ ↓ movem · P pausa')});
      return;
    }
    // topo: rótulos
    txt('VOCÊ', 14, 12, FS(11), COL.muted, 'left', 'top');
    txt(String(ps), 14, 27, FT(22), COL.acc, 'left', 'top');
    txt('CPU', 74, 12, FS(11), COL.muted, 'left', 'top');
    txt(String(cs), 74, 27, FT(22), COL.sky, 'left', 'top');
    txt('SEQUÊNCIA ' + streak + ' · RECORDE ' + best, W - 64, 30, FS(12), COL.muted, 'right', 'middle');
    if (state === 'over') {
      drawCard({kicker: newRecord ? 'Novo recorde!' : 'Pong', kickerColor: won ? COL.acc : COL.coral, title: won ? 'Você venceu!' : 'A CPU venceu', big: ps + ' × ' + cs,
        rows: [['Vitórias seguidas', String(streak)], ['Recorde de vitórias seguidas', String(best)]], cta: 'Jogar de novo', hint: coarse ? 'Toque para jogar de novo' : 'Enter ou Espaço para jogar de novo'});
    }
  }
};

/* ---------- Laço, redimensionamento e entrada ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width || window.innerWidth));
  H = Math.max(1, Math.round(r.height || window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutPauseBtn();
  GAME.resize();
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function canPause() { return state === 'play'; }
function pause() { if (canPause()) { setState('paused'); if (GAME.onPause) GAME.onPause(); } }
function resume() { if (state === 'paused') { state = 'play'; if (GAME.onResume) GAME.onResume(); } }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];
window.addEventListener('keydown', e => {
  const k = e.key;
  if (GAME_KEYS.indexOf(k) >= 0 || e.code === 'Space') e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const isStart = k === ' ' || k === 'Enter' || e.code === 'Space';
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'paused') resume(); else pause();
    return;
  }
  if (state === 'paused') { if (!e.repeat) resume(); return; }
  if (state === 'menu') { if (isStart && fontsReady) GAME.start(); return; }
  if (state === 'over') { if (isStart && stateT > 0.5 && !e.repeat) GAME.start(); return; }
  if (GAME.key) GAME.key(e, true);
}, {passive: false});
window.addEventListener('keyup', e => { if (GAME.key) GAME.key(e, false); });

function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus({preventScroll: true}); } catch (err) {}
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [x, y] = ptr(e);
  if (state === 'paused') { resume(); return; }
  if (state === 'menu') { if (fontsReady) GAME.start(x, y); return; }
  if (state === 'over') { if (stateT > 0.5) GAME.start(x, y); return; }
  if (state === 'play' && hitPause(x, y)) { pause(); return; }
  if (GAME.pointer) GAME.pointer('down', x, y, e);
}, {passive: false});
cv.addEventListener('pointermove', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('move', x, y, e); });
cv.addEventListener('pointerup', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('up', x, y, e); });
cv.addEventListener('pointercancel', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('cancel', x, y, e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  perfNow = now;
  stateT += dt;
  if (state !== 'paused') { GAME.update(dt); updateParts(dt); }
  if (shakeT > 0 && state !== 'paused') shakeT = Math.max(0, shakeT - dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / shakeDur, m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  GAME.draw();
  ctx.restore();
  if (fontsReady) {
    GAME.drawUI();
    if (state === 'play' || state === 'paused') drawPauseBtn();
    if (state === 'paused') drawCard({title: 'Pausado', lines: [coarse ? 'Toque para continuar' : 'Aperte qualquer tecla para continuar'], hint: coarse ? '' : 'P ou Esc pausa e retoma'});
  }
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
