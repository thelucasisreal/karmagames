<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo da Velha · Karma Games</title>
<meta name="theme-color" content="#0d0e12">
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Unbounded";font-weight:800;font-style:normal;font-display:swap;src:url(../../assets/fonts/unbounded-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:400;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Geist";font-weight:600;font-style:normal;font-display:swap;src:url(../../assets/fonts/geist-sans-latin-600-normal.woff2) format("woff2")}
:root{--bg:#0d0e12;--surface:#171920;--raised:#1f222b;--line:#262a33;--text:#f2f3f5;--muted:#9aa0ab;--accent:#c8f13a;--coral:#ff6b5a;--sky:#5ac8ff;--amber:#ffc23a;--r:12px;--ease:cubic-bezier(.16,1,.3,1);--display:"Unbounded",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:400 15px/1.4 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;height:100dvh;display:flex;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));touch-action:manipulation}
::selection{background:var(--accent);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:999px;background:var(--raised);border:1px solid var(--line);font-weight:600;font-size:14px;transition:background-color .2s var(--ease),transform .2s var(--ease),color .2s}
.btn:hover{background:#292d38}
.btn:active{transform:translateY(1px)}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.primary:hover,.btn[aria-pressed="true"]:hover{background:#d4f75a}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.app{width:min(100%,520px);height:100%;display:flex;flex-direction:column;gap:12px}
h1{font:800 clamp(22px,6vw,32px)/1.05 var(--display);letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg[hidden]{display:none}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:center;transition:border-color .25s var(--ease)}
.stat .lbl{display:block;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .val{display:block;font:800 22px/1.3 var(--display);font-variant-numeric:tabular-nums}
.stat.x .val{color:var(--accent)}.stat.o .val{color:var(--sky)}
.stat.turn{border-color:#4a505e}
.stat.x.turn{border-color:var(--accent)}.stat.o.turn{border-color:var(--sky)}
.status{text-align:center;font-weight:600;min-height:1.4em}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
/* linhas fixas também: sem isso a altura das casas segue o conteúdo e fica desigual */
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:10px;width:var(--s);height:var(--s)}
.sq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 12px rgba(0,0,0,.3);display:grid;place-items:center;transition:background-color .2s var(--ease)}
.sq:not(:disabled):hover{background:var(--raised)}
.sq:disabled{cursor:default}
.sq svg{width:58%;height:58%;overflow:visible}
.sq path,.sq circle{fill:none;stroke-width:13;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:0;animation:draw .38s var(--ease) backwards}
.sq .x2{animation-delay:.1s}
.mx{stroke:var(--accent)}.mo{stroke:var(--sky)}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
.sq.win{background:var(--raised)}
.sq.dim svg{opacity:.35;transition:opacity .3s var(--ease)}
.line{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.line path{fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:140;animation:draw2 .45s var(--ease) .1s backwards}
@keyframes draw2{from{stroke-dashoffset:140}}
.hint{color:var(--muted);font-size:14px;text-align:center}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(13,14,18,.78);animation:fade .25s var(--ease)}
.overlay[hidden]{display:none}
.dlg{width:min(100%,320px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 24px 24px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.5);animation:rise .35s var(--ease)}
.dlg h2{font:800 24px/1.15 var(--display);margin-bottom:8px}
.dlg p{color:var(--muted)}
.dlg .row{display:flex;gap:8px;justify-content:center;margin-top:20px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}}
@media (max-width:420px){.btn{padding:0 12px;font-size:13px}.stat .val{font-size:19px}}
/* celular: alvos maiores; deitado: placar à esquerda, tabuleiro à direita */
@media (pointer:coarse){.btn{min-height:44px}}
@media (orientation:landscape) and (max-height:560px){
  body{padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .app{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto auto auto 1fr;gap:8px 16px;align-content:start}
  .app>*{grid-column:1}
  .app>.wrap{grid-column:2;grid-row:1/-1;width:min(calc(100dvh - 16px),calc(100vw - 310px));height:100%}
  h1{font-size:24px}
  .top{flex-wrap:wrap}
  .status{text-align:left}
  .hint{text-align:left;align-self:end;font-size:13px}
}
@media (orientation:landscape) and (max-height:380px){.hint{display:none}.stat{padding:4px 8px}.stat .val{font-size:18px}}
@media (orientation:portrait) and (max-height:640px){.app{gap:8px}.stat{padding:4px 8px}.stat .val{font-size:17px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>Jogo da Velha</h1>
    <button class="btn ghost" type="button" id="reset">Zerar placar</button>
  </div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Modo de jogo">
      <button class="btn" type="button" data-mode="cpu">Contra o computador</button>
      <button class="btn" type="button" data-mode="2p">2 jogadores</button>
      <button class="btn" type="button" data-mode="online">Online</button>
    </div>
    <div class="seg" id="diffs" role="group" aria-label="Dificuldade">
      <button class="btn" type="button" data-diff="facil">Fácil</button>
      <button class="btn" type="button" data-diff="dificil">Difícil</button>
    </div>
  </div>
  <div class="score">
    <div class="stat x" id="sx"><span class="lbl" id="lx">Você (X)</span><span class="val" id="vx">0</span></div>
    <div class="stat"><span class="lbl">Empates</span><span class="val" id="vd">0</span></div>
    <div class="stat o" id="so"><span class="lbl" id="lo">Computador (O)</span><span class="val" id="vo">0</span></div>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="wrap" id="wrap"><div class="board" id="board" role="grid" aria-label="Tabuleiro"></div></div>
  <p class="hint">Faça uma linha de três — na horizontal, vertical ou diagonal.</p>
</main>
<div class="overlay" id="ov" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ovt">
    <h2 id="ovt"></h2>
    <p id="ovp"></p>
    <div class="row"><button class="btn primary" type="button" id="again">Jogar de novo</button></div>
  </div>
</div>
<script src="../../assets/karma-net.js"></script>
<script>
(function(){
"use strict";
var SLUG="karma:jogo-da-velha:";
var store={get:function(k,d){try{var v=localStorage.getItem(SLUG+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(SLUG+k,JSON.stringify(v))}catch(e){}}};
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var $=function(id){return document.getElementById(id)};
var boardEl=$("board"),wrap=$("wrap"),statusEl=$("status"),ov=$("ov");
var mode=store.get("modo","cpu");if(mode!=="cpu"&&mode!=="2p")mode="cpu";
var diff=store.get("dificuldade","facil");if(diff!=="facil"&&diff!=="dificil")diff="facil";
var b,turn,starter="X",over=false,busy=false,sq=[],score,aiTimer=null;
/* online: sala do KarmaNet; eu = minha marca (X = quem criou a sala), rodada evita reiniciar duas vezes, hist refaz a partida */
var sala=null,eu="X",rodada=0,hist=[],rede=true,modoAntes="cpu";
var SVGX='<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mx" style="--len:100" d="M18 18L82 82"/><path class="mx x2" style="--len:100" d="M82 18L18 82"/></svg>';
var SVGO='<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="mo" style="--len:210" cx="50" cy="50" r="33" transform="rotate(-90 50 50)"/></svg>';

for(var i=0;i<9;i++){(function(i){
  var s=document.createElement("button");s.type="button";s.className="sq";
  s.addEventListener("click",function(){human(i)});
  s.addEventListener("keydown",function(e){
    var d={ArrowRight:1,ArrowLeft:-1,ArrowDown:3,ArrowUp:-3}[e.key];if(d==null)return;e.preventDefault();
    var j=i+d;if((e.key==="ArrowRight"&&i%3===2)||(e.key==="ArrowLeft"&&i%3===0)||j<0||j>8)return;sq[j].focus();
  });
  sq.push(s);boardEl.appendChild(s);
})(i)}

function key(){return mode==="2p"||mode==="online"?mode:"cpu-"+diff}
function loadScore(){var s=store.get("placar:"+key(),null);score=s&&typeof s==="object"?{x:+s.x||0,o:+s.o||0,d:+s.d||0}:{x:0,o:0,d:0};paintScore()}
function paintScore(){$("vx").textContent=score.x;$("vo").textContent=score.o;$("vd").textContent=score.d}
function winner(bb){for(var k=0;k<8;k++){var l=LINES[k];if(bb[l[0]]&&bb[l[0]]===bb[l[1]]&&bb[l[0]]===bb[l[2]])return {p:bb[l[0]],line:l}}return bb.indexOf(null)<0?{p:"D"}:null}
function rival(){return sala?sala.nomeDe(eu==="X"?1:0):"Adversário"}
function nameOf(p){return mode==="online"?(p===eu?"Você":rival()):mode==="2p"?"Jogador "+p:(p==="X"?"Você":"Computador")}
function minhaVez(){return !!(sala&&rede&&sala.cheia&&turn===eu)}
function setStatus(){
  $("sx").classList.toggle("turn",!over&&turn==="X");$("so").classList.toggle("turn",!over&&turn==="O");
  if(over)return;
  if(mode==="online"){statusEl.textContent=!sala?"":!sala.cheia?"Esperando adversário…":turn===eu?"Sua vez":"Vez de "+rival();return}
  statusEl.textContent=mode==="2p"?"Vez do Jogador "+turn:(turn==="X"?"Sua vez — você é o X":"Computador pensando…");
}
function cellLabel(i){sq[i].setAttribute("aria-label","Casa "+(i+1)+": "+(b[i]?b[i]:"vazia"))}
function newRound(){
  clearTimeout(aiTimer);ov.hidden=true;
  b=[null,null,null,null,null,null,null,null,null];over=false;busy=false;turn=starter;rodada++;hist=[];
  var ln=boardEl.querySelector(".line");if(ln)ln.remove();
  sq.forEach(function(s,i){s.innerHTML="";s.className="sq";s.disabled=false;cellLabel(i)});
  setStatus();
  if(mode==="cpu"&&turn==="O")aiTurn();
}
function applyUi(){
  document.querySelectorAll("[data-mode]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.mode===mode)});
  document.querySelectorAll("[data-diff]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.diff===diff)});
  $("diffs").hidden=mode!=="cpu";
  $("lx").textContent=mode==="cpu"?"Você (X)":mode==="2p"?"Jogador X":nameOf("X")+" (X)";
  $("lo").textContent=mode==="cpu"?"Computador (O)":mode==="2p"?"Jogador O":nameOf("O")+" (O)";
  loadScore();
}
function play(i,p){
  b[i]=p;sq[i].innerHTML=p==="X"?SVGX:SVGO;sq[i].disabled=true;cellLabel(i);hist.push(i);
  if(sala&&!sincroniza.refazendo)sala.publicar({rodada:rodada,starter:starter,hist:hist});
  var w=winner(b);
  if(w){finish(w);return}
  turn=p==="X"?"O":"X";setStatus();
}
function human(i){
  if(over||busy||b[i])return;
  if(mode==="cpu"&&turn!=="X")return;
  // online: só na minha vez, e só aplica se a jogada saiu pro outro lado
  if(mode==="online"&&(!minhaVez()||!sala.enviar({i:i,rodada:rodada})))return;
  play(i,turn);
  if(!over&&mode==="cpu")aiTurn();
}
function aiTurn(){
  busy=true;setStatus();
  aiTimer=setTimeout(function(){busy=false;if(over)return;play(pick(),"O")},420);
}
function free(bb){var f=[];for(var i=0;i<9;i++)if(!bb[i])f.push(i);return f}
function findLine(bb,p){for(var k=0;k<8;k++){var l=LINES[k],c=0,e=-1;for(var j=0;j<3;j++){if(bb[l[j]]===p)c++;else if(!bb[l[j]])e=l[j]}if(c===2&&e>=0)return e}return -1}
function pick(){
  var f=free(b);
  if(diff==="facil"){
    if(Math.random()<.5){var m=findLine(b,"O");if(m>=0)return m;m=findLine(b,"X");if(m>=0&&Math.random()<.6)return m}
    return f[Math.floor(Math.random()*f.length)];
  }
  if(f.length===9)return [0,2,4,6,8][Math.floor(Math.random()*5)];
  var best=-Infinity,moves=[];
  f.forEach(function(i){b[i]="O";var s=minimax(b,false,1);b[i]=null;if(s>best){best=s;moves=[i]}else if(s===best)moves.push(i)});
  return moves[Math.floor(Math.random()*moves.length)];
}
function minimax(bb,max,depth){
  var w=winner(bb);
  if(w){return w.p==="O"?10-depth:w.p==="X"?depth-10:0}
  var best=max?-Infinity:Infinity;
  for(var i=0;i<9;i++)if(!bb[i]){bb[i]=max?"O":"X";var s=minimax(bb,!max,depth+1);bb[i]=null;best=max?Math.max(best,s):Math.min(best,s)}
  return best;
}
function finish(w){
  over=true;sq.forEach(function(s){s.disabled=true});
  var title,text;
  if(w.p==="D"){if(conta())score.d++;title="Deu velha!";text="Empate. Ninguém fechou uma linha.";statusEl.textContent="Empate."}
  else{
    if(conta()){if(w.p==="X")score.x++;else score.o++}
    w.line.forEach(function(i){sq[i].classList.add("win")});
    sq.forEach(function(s,i){if(w.line.indexOf(i)<0)s.classList.add("dim")});
    drawLine(w.line);
    if(mode==="online"){title=w.p===eu?"Você venceu!":rival()+" venceu";text=w.p===eu?"Boa! Na revanche começa quem não começou esta.":"Bora a revanche?"}
    else if(mode==="2p"){title="Jogador "+w.p+" venceu!";text="Boa partida. O placar foi atualizado."}
    else if(w.p==="X"){title="Você venceu!";text=diff==="dificil"?"Impressionante — no Difícil isso é raro.":"Mandou bem. Tente o modo Difícil."}
    else{title="O computador venceu";text="Não foi dessa vez. Bora a revanche?"}
    statusEl.textContent=nameOf(w.p)+((mode==="cpu"&&w.p==="X")||(mode==="online"&&w.p===eu)?" venceu!":" venceu.");
  }
  store.set("placar:"+key(),score);paintScore();setStatus();
  starter=starter==="X"?"O":"X";
  $("ovt").textContent=title;$("ovp").textContent=text;
  setTimeout(function(){if(over){ov.hidden=false;$("again").focus()}},w.p==="D"?450:800);
}
// refazer a partida ao recarregar não pode somar de novo no placar a rodada que já foi contada
function conta(){
  if(mode!=="online"||!sala)return true;
  var id=sala.codigo+":"+rodada;if(store.get("online:contado","")===id)return false;
  store.set("online:contado",id);return true;
}
function drawLine(l){
  var cx=function(i){return (i%3)*33.33+16.67},cy=function(i){return Math.floor(i/3)*33.33+16.67};
  var a=l[0],z=l[2],dx=cx(z)-cx(a),dy=cy(z)-cy(a),len=Math.hypot(dx,dy),ex=dx/len*9,ey=dy/len*9;
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("class","line");s.setAttribute("viewBox","0 0 100 100");s.setAttribute("aria-hidden","true");
  s.innerHTML='<path d="M'+(cx(a)-ex).toFixed(2)+" "+(cy(a)-ey).toFixed(2)+"L"+(cx(z)+ex).toFixed(2)+" "+(cy(z)+ey).toFixed(2)+'"/>';
  boardEl.appendChild(s);
}
function fit(){var s=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight,440));boardEl.style.setProperty("--s",Math.max(150,s)+"px");boardEl.style.gap=Math.max(6,Math.round(s*.025))+"px"}
/* ---- online ---- */
function saiDaSala(){if(sala){sala.sair();sala=null}}
function abreOnline(){
  if(mode!=="online")modoAntes=mode;
  saiDaSala();
  KarmaNet.lobby({jogo:"jogo-da-velha",titulo:"Jogo da Velha"}).then(function(s){
    if(!s){if(mode==="online"){mode=modoAntes;applyUi();newRound()}else applyUi();return}
    entraNaSala(s);
  });
}
function entraNaSala(s){
  clearTimeout(aiTimer);
  sala=s;eu=s.lugar===0?"X":"O";rede=true;mode="online";starter="X";rodada=0;
  s.on("msg",function(d){
    if(d.novo!=null){if(d.novo>rodada){starter=d.starter;rodada=d.novo-1;newRound()}return}
    var i=d.i;
    if(typeof i!=="number"||i<0||i>8||i%1||d.rodada!==rodada||over||busy||turn===eu||b[i])return;
    play(i,turn);
  });
  // alguém novo no lugar de quem saiu: os dois começam juntos, na mesma rodada
  s.on("entrou",function(){applyUi();newRound();s.enviar({novo:rodada,starter:starter});s.publicar({rodada:rodada,starter:starter,hist:[]})});
  // voltei de uma queda: a jogada que o outro fez enquanto eu estava fora está no estado da sala
  s.on("conexao",function(ok){rede=ok;if(ok)sincroniza(s.estado);setStatus()});
  s.on("voltou",function(){setStatus()});
  s.on("saiu",function(){
    if(sala!==s)return;
    over=true;sq.forEach(function(q){q.disabled=true});
    statusEl.textContent=rival()+" saiu da sala.";
    $("ovt").textContent="Adversário saiu";$("ovp").textContent="A sala acabou. Crie outra para jogar de novo.";$("again").textContent="Nova sala";
    ov.hidden=false;
  });
  applyUi();
  if(!sincroniza(s.estado))newRound();
}
// refaz a partida do estado da sala, sem animação, quando ele está à frente do que a tela mostra
function sincroniza(e){
  if(!e||!e.hist||e.rodada<rodada||(e.rodada===rodada&&e.hist.length<=hist.length))return false;
  starter=e.starter;newRound();rodada=e.rodada;
  // play é síncrono: cada jogada fecha antes da próxima, e a última (se fechou linha) chama finish
  // e não republica: o estado da sala já é este, e prefixos dele poderiam sobrescrever uma jogada nova do outro
  sincroniza.refazendo=true;
  var p=starter;e.hist.forEach(function(i){if(!over&&!b[i]){play(i,p);p=p==="X"?"O":"X"}});
  sincroniza.refazendo=false;
  return true;
}
document.querySelectorAll("[data-mode]").forEach(function(x){x.addEventListener("click",function(){
  if(x.dataset.mode==="online"){abreOnline();return}
  if(mode===x.dataset.mode)return;saiDaSala();mode=x.dataset.mode;store.set("modo",mode);starter="X";applyUi();newRound()})});
document.querySelectorAll("[data-diff]").forEach(function(x){x.addEventListener("click",function(){if(diff===x.dataset.diff)return;diff=x.dataset.diff;store.set("dificuldade",diff);starter="X";applyUi();newRound()})});
$("reset").addEventListener("click",function(){score={x:0,o:0,d:0};store.set("placar:"+key(),score);paintScore()});
$("again").addEventListener("click",function(){
  if(mode==="online"){
    if(!sala||!sala.cheia){$("again").textContent="Jogar de novo";ov.hidden=true;abreOnline();return}
    newRound();sala.enviar({novo:rodada,starter:starter});sala.publicar({rodada:rodada,starter:starter,hist:[]});
  }else newRound();var f=sq.filter(function(s){return !s.disabled})[0];if(f)f.focus()});
