<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1373">
<title>Desvia dos Meteoros · Karma Games</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:800;font-display:swap;src:url("../../assets/fonts/unbounded-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url("../../assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#2b1373;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Desvia dos Meteoros"></canvas>
<script>
const SLUG = 'meteoros';
(() => {
'use strict';
/* ---------- Núcleo compartilhado (Karma Games) ---------- */
const COL = {bg:'#2b1373', surf:'#ffffff', line:'#ebe5f7', text:'#2b1373', muted:'#76699a', acc:'#ff4f9a', coral:'#ff6b5a', sky:'#5ac8ff', shadow:'rgba(20,8,60,0.35)', dimRGB:'30,12,80', ctaText:'#ffffff'};
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)') || ('ontouchstart' in window);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const FT = s => '800 ' + Math.round(s) + 'px Unbounded, system-ui, sans-serif';
const FS = s => '500 ' + Math.round(s) + 'px Geist, system-ui, sans-serif';

/* Recorde */
const KEY = 'karma:' + SLUG + ':recorde';
function loadBest() { try { const v = parseInt(window.localStorage.getItem(KEY), 10); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
let best = loadBest();

/* Fontes: espera antes do primeiro texto no canvas */
let fontsReady = false;
(function () {
  let done = false;
  const finish = () => { if (!done) { done = true; fontsReady = true; } };
  setTimeout(finish, 1500);
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 32px Unbounded'), document.fonts.load('500 16px Geist')])
        .then(() => document.fonts.ready).then(finish, finish);
    } else finish();
  } catch (e) { finish(); }
})();

/* Estado */
let state = 'menu';         // menu | play | paused | over (+ estados próprios do jogo)
let stateT = 0;             // tempo no estado atual
let newRecord = false;
let lastScore = 0;
function setState(s) { state = s; stateT = 0; }
function finishGame(score) {
  lastScore = score;
  newRecord = score > best && score > 0;
  if (newRecord) { best = score; saveBest(best); }
  setState('over');
}

/* Tremor de tela */
let shakeT = 0, shakeDur = 1, shakeMag = 0;
function shake(mag, dur) {
  if (reduceMotion) return;
  if (mag >= shakeMag * (shakeT / shakeDur)) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
}

/* Partículas (coordenadas do jogo) */
const parts = [];
function burst(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color, g: grav || 0});
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vx *= Math.pow(0.04, dt); p.vy *= Math.pow(0.04, dt);
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(scale) {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.4 + 0.6 * k) * (scale || 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Desenho utilitário */
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align, base) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.fillText(s, x, y);
}
function fitFont(s, maxW, size, maker) {
  ctx.font = maker(size);
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}

/* Botão de pausa (toque) */
const pauseBtn = {x: 0, y: 0, s: 40};
function layoutPauseBtn() { pauseBtn.s = 40; pauseBtn.x = W - pauseBtn.s - 12; pauseBtn.y = 10; }
function hitPause(x, y) { const b = pauseBtn; return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6; }
function drawPauseBtn() {
  const b = pauseBtn;
  ctx.fillStyle = COL.surf; rrect(b.x, b.y, b.s, b.s, 10); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(b.x + 0.5, b.y + 0.5, b.s - 1, b.s - 1, 10); ctx.stroke();
  ctx.fillStyle = COL.muted;
  ctx.fillRect(b.x + b.s * 0.36, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
  ctx.fillRect(b.x + b.s * 0.54, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
}

/* Cartão de tela (início / pausa / fim) */
function drawCard(o) {
  ctx.fillStyle = 'rgba(' + (COL.dimRGB || '13,14,18') + ',' + (o.dim == null ? 0.6 : o.dim) + ')';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(W - 32, 440);
  const pad = cw < 340 ? 22 : 30;
  const inner = cw - pad * 2;
  let ts = fitFont(o.title, inner, cw < 340 ? 30 : 38, FT);
  const rows = o.rows || [];
  const lines = o.lines || [];
  let h = pad + ts * 1.15;
  if (o.kicker) h += 22;
  if (o.big != null) h += 78;
  h += rows.length * 34 + (rows.length ? 12 : 0);
  h += lines.length * 24 + (lines.length ? 14 : 0);
  if (o.cta) h += 62;
  let hints = [];
  if (o.hint) {
    ctx.font = FS(12);
    if (ctx.measureText(o.hint).width > inner && o.hint.indexOf(' · ') > 0) {
      const ps = o.hint.split(' · '); let cur = '';
      for (const p of ps) { const t = cur ? cur + ' · ' + p : p; if (cur && ctx.measureText(t).width > inner) { hints.push(cur); cur = p; } else cur = t; }
      if (cur) hints.push(cur);
    } else hints = [o.hint];
    h += 12 + hints.length * 18;
  }
  h += pad - 6;
  const cx = (W - cw) / 2;
  const cy = Math.max(12, (H - h) / 2);
  // sombra deslocada + superfície
  ctx.fillStyle = COL.shadow; rrect(cx + 6, cy + 8, cw, h, 18); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(cx, cy, cw, h, 18); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(cx + 0.5, cy + 0.5, cw - 1, h - 1, 18); ctx.stroke();
  let y = cy + pad;
  if (o.kicker) { txt(o.kicker.toUpperCase(), W / 2, y + 6, FS(12), o.kickerColor || COL.acc); y += 22; }
  txt(o.title, W / 2, y + ts * 0.55, FT(ts), COL.text); y += ts * 1.15;
  if (o.big != null) {
    txt(String(o.big), W / 2, y + 40, FT(fitFont(String(o.big), inner, 56, FT)), COL.acc); y += 78;
  }
  if (rows.length) {
    y += 6;
    for (const r of rows) {
      ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(cx + pad, y + 0.5); ctx.lineTo(cx + cw - pad, y + 0.5); ctx.stroke();
      txt(r[0], cx + pad, y + 18, FS(15), COL.muted, 'left');
      txt(r[1], cx + cw - pad, y + 18, FT(16), r[2] || COL.text, 'right');
      y += 34;
    }
    y += 6;
  }
  if (lines.length) {
    y += 6;
    for (const l of lines) { txt(l, W / 2, y + 10, FS(fitFont(l, inner, 15, FS)), COL.muted); y += 24; }
    y += 8;
  }
  if (o.cta) {
    const bw = Math.min(inner, 280), bh = 48, bx = (W - bw) / 2, by = y + 6;
    const pulse = reduceMotion ? 0 : (Math.sin(perfNow * 4) * 0.5 + 0.5);
    ctx.fillStyle = COL.shadow; rrect(bx + 3, by + 4, bw, bh, 12); ctx.fill();
    ctx.fillStyle = COL.acc; rrect(bx, by - pulse * 1.5, bw, bh, 12); ctx.fill();
    txt(o.cta, W / 2, by + bh / 2 - pulse * 1.5 + 1, FT(fitFont(o.cta, bw - 24, 15, FT)), COL.ctaText || COL.bg);
    y += 62;
  }
  for (let i = 0; i < hints.length; i++) txt(hints[i], W / 2, y + 14 + i * 18, FS(fitFont(hints[i], inner, 13, FS)), COL.muted);
}

/* HUD: rótulo pequeno + valor, numa pílula para ler sobre fundo colorido */
function hudStat(label, value, x, y, align, color) {
  ctx.font = FT(22); const vw = ctx.measureText(String(value)).width;
  ctx.font = FS(11); const lw = ctx.measureText(label.toUpperCase()).width;
  const w = Math.max(vw, lw) + 24, h = 50;
  const bx = align === 'right' ? x - w + 12 : align === 'center' ? x - w / 2 : x - 12;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rrect(bx + 2, y - 6 + 3, w, h, 14); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(bx, y - 6, w, h, 14); ctx.fill();
  txt(label.toUpperCase(), x, y, FS(11), COL.muted, align, 'top');
  txt(String(value), x, y + 15, FT(22), color || COL.text, align, 'top');
}

/* Som (WebAudio): só liga depois da primeira interação; M deixa mudo */
let actx = null, muted = false;
try { muted = window.localStorage.getItem('karma:som') === '0'; } catch (e) {}
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') try { actx.resume(); } catch (e) {} return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
}
function toggleMute() { muted = !muted; try { window.localStorage.setItem('karma:som', muted ? '0' : '1'); } catch (e) {} muteToast = 1.2; }
let muteToast = 0;
function beep(freq, dur, type, vol, slide) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime((vol || 0.08), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function drawMuteToast() {
  if (muteToast <= 0) return;
  ctx.globalAlpha = clamp(muteToast, 0, 1);
  const s = muted ? 'Som desligado (M)' : 'Som ligado (M)';
  ctx.font = FS(14); const w = ctx.measureText(s).width + 28;
  ctx.fillStyle = COL.surf; rrect((W - w) / 2, H - 52, w, 34, 17); ctx.fill();
  txt(s, W / 2, H - 35, FS(14), COL.text);
  ctx.globalAlpha = 1;
}

let perfNow = 0;

/* ---------- Desvia dos Meteoros ---------- */
let u = 1, shipX = 0, shipVX = 0, shipY = 0, targetX = null, keyL = false, keyR = false;
let rocks = [], stars = [], hearts = [], bgStars = [], pops = [], trail = [];
let score = 0, lives = 3, elapsed = 0, inv = 0, spawnR = 0, spawnS = 0, spawnH = 0, got = 0, deadT = 0, hitFlash = 0, squash = 0, timeAcc = 0;
let menuDir = 1;

function layout() {
  u = clamp(Math.min(W / 760, H / 620), 0.55, 1.5);
  shipY = H - Math.max(60, 78 * u);
  if (!shipX) shipX = W / 2;
  shipX = clamp(shipX, 30 * u, W - 30 * u);
  if (!bgStars.length) for (let i = 0; i < 120; i++) bgStars.push({x: Math.random(), y: Math.random(), z: rand(0.2, 1), tw: rand(0, 6)});
}
function reset() {
  layout();
  shipX = W / 2; shipVX = 0; targetX = null;
  rocks = []; stars = []; hearts = []; pops = []; trail = []; parts.length = 0;
  score = 0; lives = 3; elapsed = 0; inv = 0; spawnR = 0.6; spawnS = 1.2; spawnH = 18; got = 0; hitFlash = 0; squash = 0; timeAcc = 0;
}
function speedNow() { return (170 + Math.min(elapsed, 90) * 4.2) * u; }
function spawnRock() {
  const r = rand(16, 34) * u * (Math.random() < 0.15 ? 1.5 : 1);
  rocks.push({x: rand(r, W - r), y: -r - 10, r, v: speedNow() * rand(0.85, 1.25), vx: rand(-30, 30) * u, rot: rand(0, 6), vr: rand(-2, 2), hue: [18, 28, 340, 265][(Math.random() * 4) | 0], seed: Math.random() * 1000, mood: Math.random() < 0.5});
}
function spawnStar() { stars.push({x: rand(30 * u, W - 30 * u), y: -30, v: speedNow() * 0.7, ph: rand(0, 6), r: 16 * u}); }
function hit() {
  lives--; inv = 1.6; hitFlash = 1; squash = 1;
  shake(12, 0.4);
  burst(shipX, shipY, 24, '#ff6b8a', 380 * u, 0.7, 9 * u, 0);
  beep(160, 0.35, 'sawtooth', 0.08, 50);
  if (lives <= 0) {
    burst(shipX, shipY, 40, '#ffd23f', 520 * u, 1, 11 * u, 0);
    burst(shipX, shipY, 20, '#ffffff', 300 * u, 0.8, 8 * u, 0);
    setState('dying'); deadT = 0;
  }
}

const GAME = {
  resize() { layout(); if (state === 'menu' && !rocks.length && !elapsed) reset(); },
  start() { reset(); setState('play'); },
  key(e, down) {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keyL = down; if (down) targetX = null; }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keyR = down; if (down) targetX = null; }
  },
  pointer(type, x, y, e) {
    if (state !== 'play') { this.drag = null; return; }
    const touch = e && e.pointerType === 'touch';
    if (type === 'down') { this.drag = touch ? {x, sx: shipX} : null; targetX = touch ? shipX : x; }
    else if (type === 'move') {
      if (this.drag) targetX = clamp(this.drag.sx + (x - this.drag.x) * 1.3, 0, W);
      else if (!touch) targetX = x;
    } else this.drag = null;
  },
  onPause() { keyL = keyR = false; },
  update(dt) {
    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 0.9);
    hitFlash = Math.max(0, hitFlash - dt * 3);
    squash = Math.max(0, squash - dt * 4);
    inv = Math.max(0, inv - dt);
    const playing = state === 'play', menu = state === 'menu';
    if (!playing && !menu && state !== 'dying') return;

    if (playing) elapsed += dt; else if (menu) elapsed = 20;
    // nave
    if (playing) {
      let want = 0;
      if (keyL) want -= 1; if (keyR) want += 1;
      if (want) shipVX = lerp(shipVX, want * 560 * u, 1 - Math.pow(0.0005, dt));
      else if (targetX != null) {
        const d = targetX - shipX;
        shipVX = clamp(d * 12, -900 * u, 900 * u);
      } else shipVX = lerp(shipVX, 0, 1 - Math.pow(0.001, dt));
      shipX = clamp(shipX + shipVX * dt, 26 * u, W - 26 * u);
      timeAcc += dt;
      while (timeAcc >= 1) { timeAcc -= 1; score += 1; }
    } else if (menu) {
      shipX += menuDir * 160 * u * dt; shipVX = menuDir * 160 * u;
      if (shipX > W * 0.75) menuDir = -1; if (shipX < W * 0.25) menuDir = 1;
    }
    for (const s of bgStars) s.y += s.z * speedNow() * 0.6 * dt / H;
    // rastro do motor
    if (state !== 'dying' && Math.random() < dt * 40) trail.push({x: shipX + rand(-5, 5) * u, y: shipY + 30 * u, t: 0, s: rand(5, 10) * u});
    for (const t of trail) { t.t += dt; t.y += 140 * u * dt; }
    trail = trail.filter(t => t.t < 0.45);

    // gerar coisas
    spawnR -= dt; spawnS -= dt; spawnH -= dt;
    const every = Math.max(0.2, 0.85 - Math.min(elapsed, 90) * 0.0075) * clamp(760 / W, 0.7, 1.6);
    if (spawnR <= 0) { spawnRock(); spawnR = every * rand(0.7, 1.3); }
    if (spawnS <= 0) { spawnStar(); spawnS = rand(1.1, 2.2); }
    if (spawnH <= 0) { if (lives < 3 && playing) hearts.push({x: rand(30 * u, W - 30 * u), y: -30, v: speedNow() * 0.6, ph: 0}); spawnH = rand(16, 24); }

    const sr = 20 * u;
    for (let i = rocks.length - 1; i >= 0; i--) {
      const r = rocks[i];
      r.y += r.v * dt; r.x += r.vx * dt; r.rot += r.vr * dt;
      if (r.x < r.r || r.x > W - r.r) r.vx = -r.vx;
      if (r.y - r.r > H + 20) { rocks.splice(i, 1); continue; }
      if (playing && inv <= 0) {
        const dx = r.x - shipX, dy = r.y - (shipY + 4 * u), rr = r.r * 0.82 + sr;
        if (dx * dx + dy * dy < rr * rr) { rocks.splice(i, 1); burst(r.x, r.y, 14, '#b58a6a', 300 * u, 0.6, 8 * u, 0); hit(); continue; }
      }
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.v * dt; s.ph += dt;
      if (s.y > H + 30) { stars.splice(i, 1); continue; }
      if (playing) {
        const dx = s.x - shipX, dy = s.y - shipY, rr = s.r + sr + 6 * u;
        if (dx * dx + dy * dy < rr * rr) {
          stars.splice(i, 1); score += 10; got++; squash = 0.7;
          pops.push({x: s.x, y: s.y, t: 0, s: '+10', c: '#fff36b'});
          burst(s.x, s.y, 16, '#ffe14d', 300 * u, 0.6, 8 * u, 0);
          burst(s.x, s.y, 6, '#ffffff', 200 * u, 0.5, 6 * u, 0);
          beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.12, 'triangle', 0.06), 60);
        }
      }
    }
    for (let i = hearts.length - 1; i >= 0; i--) {
      const s = hearts[i];
      s.y += s.v * dt; s.ph += dt;
      if (s.y > H + 30) { hearts.splice(i, 1); continue; }
      const dx = s.x - shipX, dy = s.y - shipY, rr = 16 * u + sr;
      if (playing && dx * dx + dy * dy < rr * rr) {
        hearts.splice(i, 1); lives = Math.min(3, lives + 1);
        pops.push({x: s.x, y: s.y, t: 0, s: '+1 vida', c: '#ff8fb1'});
        burst(s.x, s.y, 16, '#ff6b8a', 280 * u, 0.6, 8 * u, 0);
        beep(660, 0.1, 'triangle', 0.08); setTimeout(() => beep(990, 0.16, 'triangle', 0.07), 90);
      }
    }
    if (menu) { // na demo a nave é imortal e as estrelas somem ao encostar
      for (let i = stars.length - 1; i >= 0; i--) { const s = stars[i]; if (Math.abs(s.x - shipX) < 30 * u && Math.abs(s.y - shipY) < 30 * u) { burst(s.x, s.y, 10, '#ffe14d', 250 * u, 0.5, 7 * u, 0); stars.splice(i, 1); } }
    }
    if (state === 'dying') { deadT += dt; if (deadT > 1.2) finishGame(score); }
  },
  draw() {
    // fundo espacial vivo
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2b1373'); g.addColorStop(0.55, '#6a2bb8'); g.addColorStop(1, '#ff5fa2');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    // planeta fofo
    const px = W * 0.85, py = H * 0.22, pr = 54 * u;
    ctx.fillStyle = '#5ee0c8'; ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
    ctx.fillStyle = '#3fc4ad'; ctx.beginPath(); ctx.arc(px + pr * 0.3, py + pr * 0.25, pr * 0.3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(px - pr * 0.4, py - pr * 0.3, pr * 0.16, 0, 7); ctx.fill();
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 7 * u; ctx.beginPath(); ctx.ellipse(px, py, pr * 1.6, pr * 0.35, -0.3, 0.15 * Math.PI, 0.95 * Math.PI); ctx.stroke();
    ctx.fillStyle = '#2b1373'; ctx.beginPath(); circ(px - pr * 0.28, py - pr * 0.02, pr * 0.08); circ(px + pr * 0.18, py - pr * 0.02, pr * 0.08); ctx.fill();
    ctx.strokeStyle = '#2b1373'; ctx.lineWidth = 3 * u; ctx.beginPath(); ctx.arc(px - pr * 0.05, py + pr * 0.1, pr * 0.12, 0.2, Math.PI - 0.2); ctx.stroke();
    // estrelinhas do fundo (descem com a velocidade)
    const sp = state === 'play' || state === 'menu' ? speedNow() : 0;
    for (const s of bgStars) {
      if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
      const a = reduceMotion ? 0.7 : 0.45 + 0.45 * Math.sin(perfNow * 2 + s.tw);
      ctx.fillStyle = 'rgba(255,255,255,' + a * s.z + ')';
      const r = s.z * 2.2;
      ctx.fillRect(s.x * W - r / 2, s.y * H - r / 2, r, r);
    }
    // rastro
    for (const t of trail) {
      const k = t.t / 0.45;
      ctx.fillStyle = k < 0.4 ? '#fff3a0' : '#ff9f43';
      ctx.globalAlpha = 1 - k;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.s * (1 - k * 0.6), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const s of stars) drawStar(s.x, s.y, s.r, s.ph);
    for (const h of hearts) drawHeart(h.x, h.y, 15 * u, h.ph);
    for (const r of rocks) drawRock(r);
    if (state !== 'dying' && state !== 'over') {
      const blink = inv > 0 && Math.floor(inv * 12) % 2 === 0;
      if (!blink) drawShip(shipX, shipY);
    }
    drawParts();
    if (hitFlash > 0 && !reduceMotion) { ctx.fillStyle = 'rgba(255,80,120,' + hitFlash * 0.25 + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    if (fontsReady) for (const p of pops) {
      const k = p.t / 0.9;
      ctx.globalAlpha = 1 - k * k;
      ctx.font = FT(clamp(20 * u, 14, 26)); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const y = p.y - easeOut(k) * 40 * u;
      ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.strokeStyle = '#2b1373'; ctx.strokeText(p.s, p.x, y);
      ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, y);
    }
    ctx.globalAlpha = 1;
  },
  drawUI() {
    if (state === 'menu') {
      drawCard({dim: 0.2, kicker: 'Karma Games', title: 'Desvia dos Meteoros', lines: ['Desvie das pedras, pegue as estrelas', 'e aguente o máximo que puder!'], cta: coarse ? 'Toque para começar' : 'Aperte Espaço para começar', hint: coarse ? 'Arraste o dedo para mover a nave' : 'Setas, A e D ou mouse para mover · P pausa · M som'});
      return;
    }
    hudStat('Pontos', score, 24, 16, 'left', COL.acc);
    // vidas
    const hs = 13, hx = W / 2 - (3 * hs * 2.6) / 2 + hs * 1.3;
    ctx.fillStyle = COL.surf; rrect(W / 2 - hs * 4.6, 10, hs * 9.2, 40, 14); ctx.fill();
    for (let i = 0; i < 3; i++) drawHeart(hx + i * hs * 2.6, 30, hs, 0, i >= lives);
    if (W > 380) hudStat('Recorde', Math.max(best, score), W - 76, 16, 'right');
    if (state === 'over') {
      drawCard({kicker: newRecord ? 'Novo recorde!' : 'Kabum!', title: 'Fim de jogo', big: lastScore, rows: [['Recorde', String(best)], ['Estrelas', String(got)], ['Tempo', Math.floor(elapsed) + 's']], cta: 'Jogar de novo', hint: coarse ? 'Toque para jogar de novo' : 'Enter ou Espaço para jogar de novo'});
    }
  }
};

function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
function drawShip(x, y) {
  const tilt = clamp(shipVX / (700 * u), -1, 1) * 0.35;
  const sq = reduceMotion ? 0 : squash;
  const s = u;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.scale(1 + sq * 0.15, 1 - sq * 0.12);
  // chama
  const fl = reduceMotion ? 1 : 0.8 + Math.random() * 0.4;
  ctx.fillStyle = '#ff9f43';
  ctx.beginPath(); ctx.moveTo(-11 * s, 22 * s); ctx.quadraticCurveTo(0, (48 + 10 * fl) * s, 11 * s, 22 * s); ctx.fill();
  ctx.fillStyle = '#fff3a0';
  ctx.beginPath(); ctx.moveTo(-6 * s, 22 * s); ctx.quadraticCurveTo(0, (36 + 6 * fl) * s, 6 * s, 22 * s); ctx.fill();
  // asinhas
  ctx.fillStyle = '#ff4f9a';
  ctx.beginPath(); ctx.moveTo(-18 * s, 0); ctx.quadraticCurveTo(-36 * s, 14 * s, -32 * s, 28 * s); ctx.lineTo(-14 * s, 18 * s); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18 * s, 0); ctx.quadraticCurveTo(36 * s, 14 * s, 32 * s, 28 * s); ctx.lineTo(14 * s, 18 * s); ctx.fill();
  // corpo
  ctx.fillStyle = '#f4f7ff';
  ctx.beginPath(); ctx.moveTo(0, -38 * s); ctx.bezierCurveTo(26 * s, -26 * s, 26 * s, 16 * s, 16 * s, 24 * s); ctx.lineTo(-16 * s, 24 * s); ctx.bezierCurveTo(-26 * s, 16 * s, -26 * s, -26 * s, 0, -38 * s); ctx.fill();
  ctx.fillStyle = '#d6dcf5';
  ctx.beginPath(); ctx.moveTo(10 * s, -28 * s); ctx.bezierCurveTo(24 * s, -14 * s, 22 * s, 16 * s, 16 * s, 24 * s); ctx.lineTo(8 * s, 24 * s); ctx.bezierCurveTo(16 * s, 8 * s, 16 * s, -14 * s, 10 * s, -28 * s); ctx.fill();
  // bico
  ctx.fillStyle = '#ff4f9a';
  ctx.beginPath(); ctx.moveTo(0, -38 * s); ctx.bezierCurveTo(10 * s, -34 * s, 15 * s, -28 * s, 17 * s, -22 * s); ctx.lineTo(-17 * s, -22 * s); ctx.bezierCurveTo(-15 * s, -28 * s, -10 * s, -34 * s, 0, -38 * s); ctx.fill();
  // janela = rosto
  ctx.fillStyle = '#5ac8ff'; ctx.beginPath(); ctx.arc(0, -2 * s, 13 * s, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ff4f9a'; ctx.lineWidth = 3 * s; ctx.beginPath(); ctx.arc(0, -2 * s, 13 * s, 0, 7); ctx.stroke();
  const blink = !reduceMotion && (perfNow % 3.1) < 0.12;
  const hurt = inv > 0;
  ctx.fillStyle = '#2b1373'; ctx.strokeStyle = '#2b1373'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
  if (hurt) {
    ctx.beginPath(); ctx.moveTo(-8 * s, -7 * s); ctx.lineTo(-3 * s, -3 * s); ctx.moveTo(-8 * s, -3 * s); ctx.lineTo(-3 * s, -7 * s);
    ctx.moveTo(3 * s, -7 * s); ctx.lineTo(8 * s, -3 * s); ctx.moveTo(3 * s, -3 * s); ctx.lineTo(8 * s, -7 * s); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 4 * s, 2.5 * s, 3 * s, 0, 0, 7); ctx.stroke();
  } else {
    if (blink) { ctx.fillRect(-8 * s, -5 * s, 5 * s, 2 * s); ctx.fillRect(3 * s, -5 * s, 5 * s, 2 * s); }
    else {
      ctx.beginPath(); ctx.ellipse(-5 * s, -5 * s, 2.8 * s, 3.6 * s, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5 * s, -5 * s, 2.8 * s, 3.6 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); circ(-4 * s, -6.5 * s, 1.1 * s); circ(6 * s, -6.5 * s, 1.1 * s); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 1 * s, 3.5 * s, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,90,140,0.7)';
  ctx.beginPath(); ctx.ellipse(-9 * s, 2 * s, 2.6 * s, 1.6 * s, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9 * s, 2 * s, 2.6 * s, 1.6 * s, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function drawRock(r) {
  // cauda de fogo
  ctx.fillStyle = 'rgba(255,159,67,0.35)';
  ctx.beginPath(); ctx.moveTo(r.x - r.r * 0.8, r.y); ctx.quadraticCurveTo(r.x - r.vx * 0.05, r.y - r.r * 3.2, r.x + r.r * 0.8, r.y); ctx.fill();
  ctx.fillStyle = 'rgba(255,230,120,0.4)';
  ctx.beginPath(); ctx.moveTo(r.x - r.r * 0.5, r.y); ctx.quadraticCurveTo(r.x - r.vx * 0.04, r.y - r.r * 2.2, r.x + r.r * 0.5, r.y); ctx.fill();
  ctx.save(); ctx.translate(r.x, r.y);
  ctx.save(); ctx.rotate(r.rot);
  ctx.fillStyle = 'hsl(' + r.hue + ',45%,48%)';
  ctx.beginPath();
  for (let i = 0; i < 9; i++) {
    const a = i / 9 * Math.PI * 2, k = 0.85 + 0.15 * Math.sin(r.seed + i * 2.3);
    const px = Math.cos(a) * r.r * k, py = Math.sin(a) * r.r * k;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'hsl(' + r.hue + ',40%,36%)';
  ctx.beginPath(); circ(r.r * 0.4, r.r * 0.35, r.r * 0.18); circ(-r.r * 0.45, r.r * 0.4, r.r * 0.12); circ(r.r * 0.1, -r.r * 0.5, r.r * 0.14); ctx.fill();
  ctx.restore();
  // carinha brava (não gira)
  const e = r.r * 0.16;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); circ(-r.r * 0.3, -r.r * 0.05, e * 1.25); circ(r.r * 0.3, -r.r * 0.05, e * 1.25); ctx.fill();
  ctx.fillStyle = '#2b1373';
  ctx.beginPath(); circ(-r.r * 0.27, 0, e * 0.7); circ(r.r * 0.27, 0, e * 0.7); ctx.fill();
  ctx.strokeStyle = '#2b1373'; ctx.lineWidth = Math.max(2, r.r * 0.09); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-r.r * 0.5, -r.r * 0.32); ctx.lineTo(-r.r * 0.14, -r.r * 0.2);
  ctx.moveTo(r.r * 0.5, -r.r * 0.32); ctx.lineTo(r.r * 0.14, -r.r * 0.2);
  ctx.stroke();
  ctx.beginPath();
  if (r.mood) ctx.arc(0, r.r * 0.45, r.r * 0.16, Math.PI + 0.4, -0.4); else { ctx.moveTo(-r.r * 0.14, r.r * 0.34); ctx.lineTo(r.r * 0.14, r.r * 0.34); }
  ctx.stroke();
  ctx.restore();
}
function drawStar(x, y, r, ph) {
  const p = reduceMotion ? 1 : 1 + Math.sin(ph * 6) * 0.08;
  ctx.save(); ctx.translate(x, y); ctx.rotate(reduceMotion ? 0 : Math.sin(ph * 2) * 0.2); ctx.scale(p, p);
  ctx.fillStyle = 'rgba(255,240,150,0.3)'; ctx.beginPath(); ctx.arc(0, 0, r * 1.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.5 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2b1373';
  ctx.beginPath(); circ(-r * 0.2, -r * 0.05, r * 0.09); circ(r * 0.2, -r * 0.05, r * 0.09); ctx.fill();
  ctx.fillStyle = 'rgba(255,90,140,0.6)'; ctx.beginPath(); circ(-r * 0.36, r * 0.14, r * 0.08); circ(r * 0.36, r * 0.14, r * 0.08); ctx.fill();
  ctx.restore();
}
function drawHeart(x, y, s, ph, empty) {
  const p = reduceMotion || empty ? 1 : 1 + Math.sin(ph * 6) * 0.08;
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  ctx.fillStyle = empty ? 'rgba(45,27,78,0.18)' : '#ff4f6a';
  ctx.beginPath();
  ctx.moveTo(0, s * 0.85);
  ctx.bezierCurveTo(-s * 1.3, 0, -s * 0.7, -s * 1.05, 0, -s * 0.4);
  ctx.bezierCurveTo(s * 0.7, -s * 1.05, s * 1.3, 0, 0, s * 0.85);
  ctx.fill();
  if (!empty) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-s * 0.4, -s * 0.35, s * 0.18, s * 0.12, -0.6, 0, 7); ctx.fill(); }
  ctx.restore();
}

/* ---------- Laço, redimensionamento e entrada ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width || window.innerWidth));
  H = Math.max(1, Math.round(r.height || window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutPauseBtn();
  GAME.resize();
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function canPause() { return state === 'play'; }
function pause() { if (canPause()) { setState('paused'); if (GAME.onPause) GAME.onPause(); } }
function resume() { if (state === 'paused') { state = 'play'; if (GAME.onResume) GAME.onResume(); } }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];
window.addEventListener('keydown', e => {
  const k = e.key;
  if (GAME_KEYS.indexOf(k) >= 0 || e.code === 'Space') e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  unlockAudio();
  if ((k === 'm' || k === 'M') && !e.repeat) { toggleMute(); return; }
  const isStart = k === ' ' || k === 'Enter' || e.code === 'Space';
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'paused') resume(); else pause();
    return;
  }
  if (state === 'paused') { if (!e.repeat) resume(); return; }
  if (state === 'menu') { if (isStart && fontsReady) GAME.start(); return; }
  if (state === 'over') { if (isStart && stateT > 0.5 && !e.repeat) GAME.start(); return; }
  if (GAME.key) GAME.key(e, true);
}, {passive: false});
window.addEventListener('keyup', e => { if (GAME.key) GAME.key(e, false); });

function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus({preventScroll: true}); } catch (err) {}
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  unlockAudio();
  const [x, y] = ptr(e);
  if (state === 'paused') { resume(); return; }
  if (state === 'menu') { if (fontsReady) GAME.start(x, y); return; }
  if (state === 'over') { if (stateT > 0.5) GAME.start(x, y); return; }
  if (state === 'play' && hitPause(x, y)) { pause(); return; }
  if (GAME.pointer) GAME.pointer('down', x, y, e);
}, {passive: false});
cv.addEventListener('pointermove', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('move', x, y, e); });
cv.addEventListener('pointerup', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('up', x, y, e); });
cv.addEventListener('pointercancel', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('cancel', x, y, e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  perfNow = now;
  stateT += dt;
  if (state !== 'paused') { GAME.update(dt); updateParts(dt); }
  if (muteToast > 0) muteToast -= dt;
  if (shakeT > 0 && state !== 'paused') shakeT = Math.max(0, shakeT - dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / shakeDur, m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  GAME.draw();
  ctx.restore();
  if (fontsReady) {
    GAME.drawUI();
    if (state === 'play' || state === 'paused') drawPauseBtn();
    drawMuteToast();
    if (state === 'paused') drawCard({title: 'Pausado', lines: [coarse ? 'Toque para continuar' : 'Aperte qualquer tecla para continuar'], hint: coarse ? '' : 'P ou Esc pausa e retoma'});
  }
}
resize();
requestAnimationFrame(frame);
})();
</script>
