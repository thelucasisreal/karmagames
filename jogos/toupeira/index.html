<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd35a">
<title>Acerta a Toupeira · Karma Games</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:800;font-display:swap;src:url("../../assets/fonts/unbounded-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url("../../assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#7fd35a;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Acerta a Toupeira"></canvas>
<script>
const SLUG = 'toupeira';
window.THEME = {bg:'#7fd35a', acc:'#ff8a1f', accDark:'#e0590b', accText:'#ffffff'};
(() => {
'use strict';
/* ---------- Núcleo compartilhado (Karma Games) ---------- */
const COL = Object.assign({bg:'#0d0e12', surf:'#ffffff', line:'#eadff5', text:'#2a1b3d', muted:'#6e5d82', acc:'#ff5aa5', accText:'#ffffff', coral:'#ff6b5a', sky:'#5ac8ff', shadow:'rgba(42,27,61,0.28)', hud:'#ffffff', hudShadow:'rgba(42,27,61,0.45)'}, window.THEME || {});
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)') || ('ontouchstart' in window);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const FT = s => '800 ' + Math.round(s) + 'px Unbounded, system-ui, sans-serif';
const FS = s => '500 ' + Math.round(s) + 'px Geist, system-ui, sans-serif';

/* Recorde */
const KEY = 'karma:' + SLUG + ':recorde';
function loadBest() { try { const v = parseInt(window.localStorage.getItem(KEY), 10); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
let best = loadBest();

/* Fontes: espera antes do primeiro texto no canvas */
let fontsReady = false;
(function () {
  let done = false;
  const finish = () => { if (!done) { done = true; fontsReady = true; } };
  setTimeout(finish, 1500);
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 32px Unbounded'), document.fonts.load('500 16px Geist')])
        .then(() => document.fonts.ready).then(finish, finish);
    } else finish();
  } catch (e) { finish(); }
})();

/* Som (WebAudio, só depois da primeira interação; M para mudo) */
let actx = null, muted = false, muteFlash = 0;
try { muted = window.localStorage.getItem('karma:som') === '0'; } catch (e) {}
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
}
function beep(freq, dur, type, vol, slide) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime((vol || 0.12), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function toggleMute() { muted = !muted; muteFlash = 1.2; try { window.localStorage.setItem('karma:som', muted ? '0' : '1'); } catch (e) {} }

/* Estado */
let state = 'menu';         // menu | play | paused | over (+ estados próprios do jogo)
let stateT = 0;             // tempo no estado atual
let newRecord = false;
let lastScore = 0;
function setState(s) { state = s; stateT = 0; }
function finishGame(score) {
  lastScore = score;
  newRecord = score > best && score > 0;
  if (newRecord) { best = score; saveBest(best); }
  setState('over');
}

/* Tremor de tela */
let shakeT = 0, shakeDur = 1, shakeMag = 0;
function shake(mag, dur) {
  if (reduceMotion) return;
  if (mag >= shakeMag * (shakeT / shakeDur)) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
}

/* Partículas (coordenadas do jogo) */
const parts = [];
function burst(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color: Array.isArray(color) ? color[(Math.random() * color.length) | 0] : color, g: grav || 0, round: Math.random() < 0.5});
  }
  if (parts.length > 500) parts.splice(0, parts.length - 500);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt);
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(scale) {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.4 + 0.6 * k) * (scale || 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    if (p.round) { ctx.beginPath(); ctx.arc(p.x, p.y, s / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Textos flutuantes (+10, -20...) */
const pops = [];
function pop(x, y, s, color, size) { pops.push({x, y, s, color: color || COL.hud, size: size || 26, t: 0}); }
function updatePops(dt) { for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.8) pops.splice(i, 1); } }
function drawPops() {
  if (!fontsReady) return;
  for (const p of pops) {
    const k = p.t / 0.8;
    const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
    ctx.globalAlpha = 1 - k * k;
    const y = p.y - easeOut(k) * 50;
    ctx.font = FT(p.size * sc); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, p.size * 0.22); ctx.strokeStyle = COL.text;
    ctx.strokeText(p.s, p.x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.s, p.x, y);
  }
  ctx.globalAlpha = 1;
}

/* Desenho utilitário */
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align, base) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.fillText(s, x, y);
}
function otxt(s, x, y, font, color, stroke, lw, align, base) {
  ctx.font = font; ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fitFont(s, maxW, size, maker) {
  ctx.font = maker(size);
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}
function ellipse(x, y, rx, ry, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, 7); ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }

/* Botão de pausa (toque) */
const pauseBtn = {x: 0, y: 0, s: 40};
function layoutPauseBtn() { pauseBtn.s = 40; pauseBtn.x = W - pauseBtn.s - 12; pauseBtn.y = 10; }
function hitPause(x, y) { const b = pauseBtn; return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6; }
function drawPauseBtn() {
  const b = pauseBtn;
  ctx.fillStyle = COL.shadow; rrect(b.x + 2, b.y + 3, b.s, b.s, 12); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(b.x, b.y, b.s, b.s, 12); ctx.fill();
  ctx.fillStyle = COL.text;
  rrect(b.x + b.s * 0.33, b.y + b.s * 0.28, b.s * 0.12, b.s * 0.44, 2); ctx.fill();
  rrect(b.x + b.s * 0.55, b.y + b.s * 0.28, b.s * 0.12, b.s * 0.44, 2); ctx.fill();
}

/* Cartão de tela (início / pausa / fim) */
function drawCard(o) {
  ctx.fillStyle = 'rgba(42,27,61,' + (o.dim == null ? 0.5 : o.dim) + ')';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(W - 32, 440);
  const pad = cw < 340 ? 22 : 30;
  const inner = cw - pad * 2;
  let ts = fitFont(o.title, inner, cw < 340 ? 30 : 38, FT);
  const rows = o.rows || [];
  const lines = o.lines || [];
  let h = pad + ts * 1.15;
  if (o.kicker) h += 22;
  if (o.big != null) h += 78;
  h += rows.length * 34 + (rows.length ? 12 : 0);
  h += lines.length * 24 + (lines.length ? 14 : 0);
  if (o.cta) h += 62;
  if (o.hint) h += 30;
  h += pad - 6;
  const cx = (W - cw) / 2;
  const pop = reduceMotion ? 1 : easeOut(clamp(stateT / 0.28, 0, 1));
  const cy = Math.max(12, (H - h) / 2) + (1 - pop) * 30;
  ctx.globalAlpha = 0.3 + 0.7 * pop;
  ctx.fillStyle = COL.shadow; rrect(cx + 6, cy + 9, cw, h, 24); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(cx, cy, cw, h, 24); ctx.fill();
  ctx.strokeStyle = COL.acc; ctx.lineWidth = 4; rrect(cx + 2, cy + 2, cw - 4, h - 4, 22); ctx.stroke();
  let y = cy + pad;
  if (o.kicker) { txt(o.kicker.toUpperCase(), W / 2, y + 6, FS(12), o.kickerColor || COL.accDark || COL.acc); y += 22; }
  txt(o.title, W / 2, y + ts * 0.55, FT(ts), COL.text); y += ts * 1.15;
  if (o.big != null) {
    otxt(String(o.big), W / 2, y + 40, FT(fitFont(String(o.big), inner, 56, FT)), COL.acc, COL.text, 7); y += 78;
  }
  if (rows.length) {
    y += 6;
    for (const r of rows) {
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx + pad, y + 0.5); ctx.lineTo(cx + cw - pad, y + 0.5); ctx.stroke();
      txt(r[0], cx + pad, y + 18, FS(15), COL.muted, 'left');
      txt(r[1], cx + cw - pad, y + 18, FT(16), r[2] || COL.text, 'right');
      y += 34;
    }
    y += 6;
  }
  if (lines.length) {
    y += 6;
    for (const l of lines) { txt(l, W / 2, y + 10, FS(fitFont(l, inner, 15, FS)), COL.muted); y += 24; }
    y += 8;
  }
  if (o.cta) {
    const bw = Math.min(inner, 300), bh = 50, bx = (W - bw) / 2, by = y + 6;
    const pulse = reduceMotion ? 0 : (Math.sin(perfNow * 4) * 0.5 + 0.5);
    ctx.fillStyle = COL.text; rrect(bx, by + 5, bw, bh, 16); ctx.fill();
    ctx.fillStyle = COL.acc; rrect(bx, by - pulse * 2, bw, bh, 16); ctx.fill();
    txt(o.cta, W / 2, by + bh / 2 - pulse * 2 + 1, FT(fitFont(o.cta, bw - 24, 15, FT)), COL.accText);
    y += 62;
  }
  if (o.hint) { txt(o.hint, W / 2, y + 14, FS(fitFont(o.hint, inner, 13, FS)), COL.muted); y += 30; }
  ctx.globalAlpha = 1;
}

/* HUD: rótulo pequeno + valor (com contorno, legível em fundo colorido) */
function hudStat(label, value, x, y, align, color) {
  otxt(label.toUpperCase(), x, y, FT(11), COL.hud, COL.hudShadow, 4, align, 'top');
  otxt(String(value), x, y + 16, FT(24), color || COL.hud, COL.text, 6, align, 'top');
}
function drawMuteNote() {
  if (muteFlash <= 0 || !fontsReady) return;
  ctx.globalAlpha = clamp(muteFlash, 0, 1);
  otxt(muted ? 'Som desligado (M)' : 'Som ligado (M)', W / 2, H - 28, FT(14), COL.hud, COL.text, 5);
  ctx.globalAlpha = 1;
}

let perfNow = 0;

/* ---------- Acerta a Toupeira ---------- */
const DURACAO = 30;
const HUD = 76;
const holes = [];
let gx = 0, gy = 0, cellW = 100, cellH = 100, holeR = 40;
let score = 0, timeLeft = DURACAO, spawnT = 0, hits = 0, bombsHit = 0, combo = 0, bestCombo = 0;
let mouseX = -100, mouseY = -100, hasMouse = false, swingT = 1, swingX = 0, swingY = 0;
let clouds = [];
let lastTick = 0;

function layout() {
  const top = HUD + 10 + (W < 560 ? 26 : 0), aw = Math.min(W - 24, 720), ah = H - top - 18;
  cellW = aw / 3;
  cellH = Math.min(ah / 3, cellW * 1.35);
  holeR = Math.min(cellW * (W < 560 ? 0.42 : 0.36), cellH * 0.42);
  gx = (W - cellW * 3) / 2;
  gy = top + (ah - cellH * 3) / 2;
  for (let i = 0; i < 9; i++) {
    const h = holes[i] || (holes[i] = {kind: null, t: 0, dur: 1, hit: false, hitT: 0, wob: Math.random() * 6});
    h.x = gx + (i % 3 + 0.5) * cellW;
    h.y = gy + (Math.floor(i / 3) + 0.62) * cellH;
  }
  clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({x: rand(0, W), y: rand(8, Math.max(20, H * 0.14)), s: rand(0.6, 1.2), v: rand(6, 16)});
}
function reset() {
  score = 0; timeLeft = DURACAO; spawnT = 0.6; hits = 0; bombsHit = 0; combo = 0; bestCombo = 0;
  for (const h of holes) { h.kind = null; h.hit = false; }
  parts.length = 0; pops.length = 0;
}
function progress() { return 1 - timeLeft / DURACAO; }
function spawn(demo) {
  const free = holes.filter(h => !h.kind);
  if (!free.length) return;
  const h = free[(Math.random() * free.length) | 0];
  const p = demo ? 0.3 : progress();
  const r = Math.random();
  h.kind = (!demo && r < 0.16 + p * 0.06) ? 'bomb' : (r > 0.93 ? 'gold' : 'mole');
  h.t = 0; h.hit = false; h.hitT = 0;
  h.dur = lerp(1.15, 0.62, p) * rand(0.85, 1.15) + (h.kind === 'bomb' ? 0.35 : 0) - (h.kind === 'gold' ? 0.15 : 0);
}
/* altura visível 0..1 */
function rise(h) {
  if (!h.kind) return 0;
  const up = 0.14, total = h.dur + up * 2;
  if (h.hit) return clamp(1 - Math.max(0, h.hitT - 0.35) / 0.16, 0, 1);
  if (h.t < up) return easeOut(h.t / up);
  if (h.t > total - up) return clamp((total - h.t) / up, 0, 1);
  return 1;
}
function whack(x, y) {
  swingT = 0; swingX = x; swingY = y;
  let target = null, bd = 1e9;
  for (const h of holes) {
    const dx = x - h.x, dy = y - (h.y - holeR * 0.7);
    const d = (dx * dx) / (holeR * holeR * 1.3) + (dy * dy) / (holeR * holeR * 2.2);
    if (d < 1.4 && d < bd) { bd = d; target = h; }
  }
  if (target) hitHole(target); else { combo = 0; beep(140, 0.06, 'triangle', 0.08); }
}
function hitHole(h) {
  if (!h.kind || h.hit || rise(h) < 0.35) { combo = 0; beep(140, 0.06, 'triangle', 0.08); burst(h.x, h.y, 6, ['#8a5a32', '#6b4424'], 220, 0.4, 7, 600); return; }
  h.hit = true; h.hitT = 0;
  const hy = h.y - holeR * 0.9;
  if (h.kind === 'bomb') {
    score = Math.max(0, score - 20); combo = 0; bombsHit++;
    pop(h.x, hy, '-20', '#ff5a5a', 30);
    burst(h.x, hy, 34, ['#ff5a2a', '#ffb02a', '#ffe14a', '#444'], 520, 0.7, 12, 200);
    shake(14, 0.4);
    beep(110, 0.4, 'sawtooth', 0.16, 40);
  } else {
    combo++; bestCombo = Math.max(bestCombo, combo); hits++;
    const pts = (h.kind === 'gold' ? 30 : 10) + (combo >= 3 ? 5 : 0);
    score += pts;
    pop(h.x, hy, '+' + pts, h.kind === 'gold' ? '#ffd23a' : '#ffffff', h.kind === 'gold' ? 32 : 26);
    burst(h.x, hy, 18, h.kind === 'gold' ? ['#ffd23a', '#fff3a0', '#ffffff'] : ['#ffffff', '#ffe066', '#ff9ec7', '#8ee0ff'], 380, 0.55, 10, 300);
    shake(4, 0.12);
    beep(h.kind === 'gold' ? 880 : 520, 0.09, 'square', 0.1, h.kind === 'gold' ? 1400 : 780);
    if (combo >= 3) beep(1040, 0.06, 'triangle', 0.06);
  }
}

/* Desenho */
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#6fd0ff'); g.addColorStop(0.16, '#b6ecff'); g.addColorStop(0.16, '#8fe060'); g.addColorStop(1, '#4fb23c');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // colinas
  ctx.fillStyle = '#7fd35a';
  ctx.beginPath(); ctx.moveTo(0, H * 0.17);
  for (let x = 0; x <= W + 40; x += 40) ctx.lineTo(x, H * 0.16 + Math.sin(x * 0.012) * 10);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  for (const c of clouds) {
    const s = c.s * 22;
    ctx.globalAlpha = 0.9;
    circle(c.x, c.y + s * 0.3, s, '#ffffff'); circle(c.x + s, c.y, s * 1.2, '#ffffff'); circle(c.x + s * 2.1, c.y + s * 0.35, s * 0.9, '#ffffff');
    ctx.globalAlpha = 1;
  }
  // tufos de grama e florzinhas fixos (determinísticos)
  for (let i = 0; i < 40; i++) {
    const x = ((i * 137) % Math.max(1, W | 0)), y = H * 0.22 + ((i * 71) % Math.max(1, (H * 0.76) | 0));
    if (i % 3 === 0) { circle(x, y, 4, '#ffffff'); circle(x, y, 2, '#ffd23a'); }
    else { ctx.strokeStyle = '#3f9a2e'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x - 6, y - 7); ctx.moveTo(x, y); ctx.lineTo(x, y - 9); ctx.moveTo(x + 4, y); ctx.lineTo(x + 6, y - 7); ctx.stroke(); }
  }
}
function eye(x, y, r, look, closed) {
  if (closed) {
    ctx.strokeStyle = '#2a1b3d'; ctx.lineWidth = Math.max(2, r * 0.35); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - r * 0.7, y - r * 0.7); ctx.lineTo(x + r * 0.7, y + r * 0.7); ctx.moveTo(x + r * 0.7, y - r * 0.7); ctx.lineTo(x - r * 0.7, y + r * 0.7); ctx.stroke();
    return;
  }
  circle(x, y, r, '#ffffff');
  circle(x + look * r * 0.25, y + r * 0.1, r * 0.62, '#2a1b3d');
  circle(x + look * r * 0.25 - r * 0.22, y - r * 0.18, r * 0.22, '#ffffff');
}
function drawMole(h, x, y, s, gold) {
  const dizzy = h.hit;
  const body = gold ? '#ffc93a' : '#a0683f', belly = gold ? '#fff0a8' : '#e8c39a', dark = gold ? '#d99a10' : '#7a4a2a';
  const sq = h.hit ? 1 + Math.max(0, 0.25 - h.hitT) * 1.6 : 1;
  const w = s * 0.82 * sq, hh = s * 1.15 / sq;
  ctx.save(); ctx.translate(x, y);
  // corpo
  ctx.fillStyle = body; ctx.beginPath();
  ctx.moveTo(-w, 0); ctx.lineTo(-w, -hh + w); ctx.arc(0, -hh + w, w, Math.PI, 0); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = dark; ctx.stroke();
  ellipse(0, -hh * 0.28, w * 0.62, hh * 0.38, belly);
  // orelhas
  circle(-w * 0.78, -hh + w * 0.35, w * 0.2, dark); circle(w * 0.78, -hh + w * 0.35, w * 0.2, dark);
  // olhos
  const ey = -hh + w * 0.85, look = Math.sin(perfNow * 2 + h.wob) * (reduceMotion ? 0 : 1);
  eye(-w * 0.36, ey, w * 0.22, look, dizzy); eye(w * 0.36, ey, w * 0.22, look, dizzy);
  // bochechas
  ctx.globalAlpha = 0.55; ellipse(-w * 0.62, ey + w * 0.38, w * 0.16, w * 0.1, '#ff7fa8'); ellipse(w * 0.62, ey + w * 0.38, w * 0.16, w * 0.1, '#ff7fa8'); ctx.globalAlpha = 1;
  // focinho
  ellipse(0, ey + w * 0.4, w * 0.3, w * 0.2, belly);
  ellipse(0, ey + w * 0.3, w * 0.13, w * 0.09, '#ff5a8a');
  // dentinhos
  ctx.fillStyle = '#ffffff'; ctx.fillRect(-w * 0.1, ey + w * 0.5, w * 0.09, w * 0.13); ctx.fillRect(w * 0.01, ey + w * 0.5, w * 0.09, w * 0.13);
  // estrelinhas ao ser acertada
  if (dizzy) {
    for (let i = 0; i < 3; i++) {
      const a = perfNow * 6 + i * 2.1;
      star(Math.cos(a) * w * 0.9, -hh - w * 0.1 + Math.sin(a) * w * 0.25, w * 0.16, '#ffe14a');
    }
  }
  if (gold && !dizzy) { const tw = Math.sin(perfNow * 8) * 0.5 + 0.5; star(w * 0.7, -hh + w * 0.1, w * 0.12 * (0.6 + tw * 0.6), '#ffffff'); }
  ctx.restore();
}
function star(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function drawBomb(h, x, y, s) {
  const r = s * 0.72;
  const cy = -r * 1.05;
  ctx.save(); ctx.translate(x, y);
  if (h.hit) { ctx.restore(); return; }
  const wob = reduceMotion ? 0 : Math.sin(perfNow * 18) * 0.06;
  ctx.rotate(wob);
  circle(0, cy, r, '#2d2a3a');
  circle(-r * 0.35, cy - r * 0.38, r * 0.22, 'rgba(255,255,255,0.35)');
  ctx.fillStyle = '#55506a'; ctx.fillRect(-r * 0.25, cy - r * 1.18, r * 0.5, r * 0.28);
  ctx.strokeStyle = '#c99a5a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, cy - r * 1.18); ctx.quadraticCurveTo(r * 0.3, cy - r * 1.5, r * 0.15, cy - r * 1.7); ctx.stroke();
  const fl = Math.sin(perfNow * 30) * 0.5 + 0.5;
  star(r * 0.15, cy - r * 1.72, r * (0.2 + fl * 0.12), fl > 0.5 ? '#ffe14a' : '#ff8a1f');
  // olhos bravos
  const ey = cy - r * 0.05;
  circle(-r * 0.32, ey, r * 0.2, '#ffffff'); circle(r * 0.32, ey, r * 0.2, '#ffffff');
  circle(-r * 0.28, ey + r * 0.04, r * 0.11, '#2a1b3d'); circle(r * 0.28, ey + r * 0.04, r * 0.11, '#2a1b3d');
  ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = Math.max(2, r * 0.1); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-r * 0.55, ey - r * 0.32); ctx.lineTo(-r * 0.12, ey - r * 0.16); ctx.moveTo(r * 0.55, ey - r * 0.32); ctx.lineTo(r * 0.12, ey - r * 0.16); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, r * 0.08);
  ctx.beginPath(); ctx.arc(0, ey + r * 0.5, r * 0.18, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.restore();

function drawHole(h) {
  const rx = holeR, ry = holeR * 0.38;
  // monte de terra
  ellipse(h.x, h.y + ry * 0.35, rx * 1.22, ry * 1.5, '#8a5a32');
  ellipse(h.x, h.y + ry * 0.2, rx * 1.12, ry * 1.3, '#a8743f');
  ellipse(h.x, h.y, rx, ry, '#3a2216');
  ellipse(h.x, h.y + ry * 0.25, rx * 0.9, ry * 0.7, '#24140c');
  const vis = rise(h);
  if (vis > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(h.x - rx * 1.5, h.y - holeR * 4, rx * 3, holeR * 4);
    ctx.ellipse(h.x, h.y, rx, ry, 0, 0, Math.PI);
    ctx.clip();
    const s = holeR;
    const baseY = h.y + s * 1.7 * (1 - vis) + ry * 0.2;
    if (h.kind === 'bomb') drawBomb(h, h.x, baseY, s);
    else drawMole(h, h.x, baseY, s, h.kind === 'gold');
    ctx.restore();
  }
  // borda da frente
  ctx.save();
  ctx.beginPath(); ctx.ellipse(h.x, h.y, rx, ry, 0, 0, Math.PI); ctx.lineWidth = Math.max(4, ry * 0.35); ctx.strokeStyle = '#a8743f'; ctx.stroke();
  ctx.restore();
}
function drawMallet() {
  if (coarse && swingT >= 0.25) return;
  const x = swingT < 0.25 ? swingX : mouseX, y = swingT < 0.25 ? swingY : mouseY;
  if (!hasMouse && swingT >= 0.25) return;
  const s = clamp(holeR * 0.75, 22, 40);
  // golpe: desce até o ponto (a = -0.86) e volta
  let a = 0.15;
  if (swingT < 0.25) { const k = swingT < 0.07 ? easeOut(swingT / 0.07) : 1 - (swingT - 0.07) / 0.18; a = lerp(0.15, -0.86, clamp(k, 0, 1)); }
  ctx.save(); ctx.translate(x + s * 1.8, y + s * 1.4); ctx.rotate(a);
  ctx.fillStyle = '#c98a4a'; rrect(-s * 0.13, -s * 2.1, s * 0.26, s * 2.1, 4); ctx.fill();
  ctx.fillStyle = '#ff4f7b'; rrect(-s * 0.85, -s * 2.9, s * 1.7, s * 0.85, 10); ctx.fill();
  ctx.fillStyle = '#ffd23a'; rrect(-s * 0.85, -s * 2.9, s * 0.3, s * 0.85, 6); ctx.fill(); rrect(s * 0.55, -s * 2.9, s * 0.3, s * 0.85, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; rrect(-s * 0.5, -s * 2.8, s * 1.0, s * 0.18, 4); ctx.fill();
  ctx.restore();
}

const GAME = {
  resize() { layout(); },
  start() { reset(); setState('play'); cv.style.cursor = coarse ? 'default' : 'none'; beep(660, 0.08, 'square', 0.08, 990); },
  key(e, down) {
    if (!down || state !== 'play' || e.repeat) return;
    const map = {'7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8, q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, z: 6, x: 7, c: 8};
    const i = map[e.key.toLowerCase()];
    if (i != null) { const h = holes[i]; swingT = 0; swingX = h.x; swingY = h.y - holeR; hitHole(h); }
  },
  pointer(type, x, y, e) {
    if (e && e.pointerType === 'mouse') { hasMouse = true; mouseX = x; mouseY = y; }
    if (type === 'down' && state === 'play') whack(x, y);
  },
  update(dt) {
    swingT += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 40) c.x = -100; }
    for (const h of holes) {
      if (!h.kind) continue;
      h.t += dt; if (h.hit) h.hitT += dt;
      const done = h.hit ? h.hitT > 0.55 : h.t > h.dur + 0.28;
      if (done) { if (!h.hit && h.kind !== 'bomb') combo = 0; h.kind = null; }
    }
    if (state === 'play') {
      timeLeft -= dt;
      if (timeLeft <= 5 && Math.ceil(timeLeft) !== lastTick && timeLeft > 0) { lastTick = Math.ceil(timeLeft); beep(980, 0.05, 'triangle', 0.07); }
      spawnT -= dt;
      if (spawnT <= 0) {
        spawn(false);
        if (progress() > 0.45 && Math.random() < 0.35) spawn(false);
        spawnT = lerp(0.85, 0.42, progress()) * rand(0.8, 1.2);
      }
      if (timeLeft <= 0) {
        timeLeft = 0; setState('ending');
        beep(523, 0.12, 'square', 0.1); setTimeout(() => beep(392, 0.2, 'square', 0.1), 130);
      }
    } else if (state === 'ending') {
      if (stateT > 0.9) { cv.style.cursor = 'default'; finishGame(score); }
    } else if (state === 'menu') {
      spawnT -= dt;
      if (spawnT <= 0) { spawn(true); spawnT = rand(0.5, 1.0); }
    }
  },
  draw() {
    drawBg();
    for (const h of holes) drawHole(h);
  },
  drawUI() {
    if (state === 'menu') {
      drawCard({dim: 0.35, kicker: 'Karma Games', title: 'Acerta a Toupeira', lines: ['Martele as toupeiras em 30 segundos.', 'Cuidado com a bomba: ela tira 20 pontos!'], cta: coarse ? 'Toque para começar' : 'Aperte Espaço para começar', hint: coarse ? 'Toque nas toupeiras · dourada vale 30' : 'Clique nas toupeiras ou use 1 a 9 · P pausa · M som'});
      return;
    }
    hudStat('Pontos', score, 16, 12, 'left', '#ffd23a');
    hudStat('Recorde', Math.max(best, score), W - 66, 12, 'right');
    // barra de tempo
    const narrow = W < 560;
    const bw = narrow ? Math.min(W - 40, 300) : Math.min(W * 0.36, 240), bx = (W - bw) / 2, by = narrow ? 70 : 22, bh = 22;
    const k = clamp(timeLeft / DURACAO, 0, 1);
    ctx.fillStyle = COL.text; rrect(bx - 3, by - 3 + 3, bw + 6, bh + 6, 14); ctx.fill();
    ctx.fillStyle = '#ffffff'; rrect(bx, by, bw, bh, 11); ctx.fill();
    ctx.fillStyle = k < 0.2 ? '#ff5a5a' : '#ffb21f'; if (k > 0) { rrect(bx, by, Math.max(bh, bw * k), bh, 11); ctx.fill(); }
    otxt(Math.ceil(timeLeft) + 's', W / 2, by + bh / 2 + 1, FT(13), '#ffffff', COL.text, 4);
    if (combo >= 3 && state === 'play') otxt('Combo x' + combo, W / 2, by + bh + 20, FT(14), '#ffd23a', COL.text, 5);
    if (state === 'ending') {
      const s = 1 + (reduceMotion ? 0 : Math.max(0, 0.3 - stateT));
      otxt('Tempo!', W / 2, H / 2, FT(fitFont('Tempo!', W - 40, 64, FT) * s), '#ffffff', COL.text, 10);
    }
    if (state === 'over') {
      drawCard({kicker: newRecord ? 'Novo recorde!' : 'Acerta a Toupeira', title: 'Fim de jogo', big: lastScore, rows: [['Recorde', String(best)], ['Toupeiras acertadas', String(hits)], ['Melhor combo', String(bestCombo)], ['Bombas', String(bombsHit), bombsHit ? '#e04040' : null]], cta: 'Jogar de novo', hint: coarse ? 'Toque para jogar de novo' : 'Enter ou Espaço para jogar de novo'});
    }
  }
};
cv.addEventListener('pointerleave', () => { hasMouse = false; });
GAME.drawTop = () => { if (state === 'play' || state === 'ending') drawMallet(); };
GAME.onPause = () => { cv.style.cursor = 'default'; };
GAME.onResume = () => { cv.style.cursor = coarse ? 'default' : 'none'; };


/* ---------- Laço, redimensionamento e entrada ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width || window.innerWidth));
  H = Math.max(1, Math.round(r.height || window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutPauseBtn();
  GAME.resize();
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function canPause() { return state === 'play'; }
function pause() { if (canPause()) { setState('paused'); if (GAME.onPause) GAME.onPause(); } }
function resume() { if (state === 'paused') { state = 'play'; if (GAME.onResume) GAME.onResume(); } }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];
window.addEventListener('keydown', e => {
  const k = e.key;
  if (GAME_KEYS.indexOf(k) >= 0 || e.code === 'Space') e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  unlockAudio();
  const isStart = k === ' ' || k === 'Enter' || e.code === 'Space';
  if (k === 'm' || k === 'M') { if (!e.repeat) toggleMute(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'paused') resume(); else pause();
    return;
  }
  if (state === 'paused') { if (!e.repeat) resume(); return; }
  if (state === 'menu') { if (isStart && fontsReady && !e.repeat) GAME.start(); return; }
  if (state === 'over') { if (isStart && stateT > 0.6 && !e.repeat) GAME.start(); return; }
  if (GAME.key) GAME.key(e, true);
}, {passive: false});
window.addEventListener('keyup', e => { if (GAME.key) GAME.key(e, false); });

function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  try { cv.focus({preventScroll: true}); } catch (err) {}
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [x, y] = ptr(e);
  if (state === 'paused') { resume(); return; }
  if (state === 'menu') { if (fontsReady) GAME.start(x, y); return; }
  if (state === 'over') { if (stateT > 0.6) GAME.start(x, y); return; }
  if (state === 'play' && hitPause(x, y)) { pause(); return; }
  if (GAME.pointer) GAME.pointer('down', x, y, e);
}, {passive: false});
cv.addEventListener('pointermove', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('move', x, y, e); });
cv.addEventListener('pointerup', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('up', x, y, e); });
cv.addEventListener('pointercancel', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('cancel', x, y, e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  perfNow = now;
  stateT += dt;
  muteFlash = Math.max(0, muteFlash - dt);
  if (state !== 'paused') { GAME.update(dt); updateParts(dt); updatePops(dt); }
  if (shakeT > 0 && state !== 'paused') shakeT = Math.max(0, shakeT - dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / shakeDur, m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  GAME.draw();
  drawParts();
  drawPops();
  if (GAME.drawTop && state !== 'paused') GAME.drawTop();
  ctx.restore();
  if (fontsReady) {
    GAME.drawUI();
    if (state === 'play' || state === 'paused') drawPauseBtn();
    if (state === 'paused') drawCard({title: 'Pausado', lines: [coarse ? 'Toque para continuar' : 'Aperte qualquer tecla para continuar'], hint: coarse ? '' : 'P ou Esc pausa e retoma · M liga ou desliga o som'});
    drawMuteNote();
  }
}
resize();
requestAnimationFrame(frame);
})();
