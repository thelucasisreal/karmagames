let BS=1;
function resize(){
  const dpr=window.devicePixelRatio||1;
  const cs=Math.min(innerWidth/W,innerHeight/H);
  BS=Math.max(1,Math.floor(cs*dpr));
  cv.width=W*BS;cv.height=H*BS;
  cv.style.width=(W*BS/dpr)+'px';cv.style.height=(H*BS/dpr)+'px';
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function expand(r,n){return{x:r.x-n,y:r.y-n,w:r.w+2*n,h:r.h+2*n};}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295;}
function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function text(s,x,y,size=8,col='#fff',align='left',sh='rgba(0,0,0,.7)'){
  ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='top';
  if(sh){ctx.fillStyle=sh;ctx.fillText(s,x+1,y+1);}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}

let unlocked=1;
try{unlocked=Math.max(1,parseInt(localStorage.getItem('ajudaAnimal.fases')||'1',10)||1);}catch(e){}
function saveProgress(n){unlocked=Math.min(10,Math.max(unlocked,n));try{localStorage.setItem('ajudaAnimal.fases',String(unlocked));}catch(e){}}

// ---------------------------------------------------------- entrada
const keys={},pressed={};
const BLOCK=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'];
addEventListener('keydown',e=>{if(!e.repeat)pressed[e.code]=true;keys[e.code]=true;if(BLOCK.includes(e.code))e.preventDefault();initAudio();});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const P=(...c)=>c.some(x=>pressed[x]);
let padPrev=[{},{}],padNow=[{},{}];
function pollPads(){
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(let i=0;i<2;i++){
    const g=gps&&gps[i];padPrev[i]=padNow[i];const s={};
    if(g){const ax=g.axes[0]||0,ay=g.axes[1]||0,b=n=>g.buttons[n]&&g.buttons[n].pressed;
      s.left=ax<-.4||b(14);s.right=ax>.4||b(15);s.up=b(0)||b(12)||ay<-.6;s.down=b(1)||b(13)||ay>.6||b(6);s.act=b(2)||b(3)||b(7);s.start=b(9);}
    padNow[i]=s;
  }
}
const padP=(i,k)=>!!padNow[i][k]&&!padPrev[i][k];
// toque (celular/tablet: lado esquerdo lobo, direito águia)
const touchEl=document.getElementById('touch');
if('ontouchstart' in window||navigator.maxTouchPoints>0)touchEl.classList.add('on');
touchEl.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const dn=e=>{e.preventDefault();if(!keys[k])pressed[k]=true;keys[k]=true;b.classList.add('dn');initAudio();};
  const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('dn');};
  b.addEventListener('touchstart',dn,{passive:false});b.addEventListener('touchend',up,{passive:false});b.addEventListener('touchcancel',up,{passive:false});
  b.addEventListener('mousedown',dn);b.addEventListener('mouseup',up);b.addEventListener('mouseleave',up);
});
let mouseClick=null;
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();mouseClick={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};initAudio();});

function getInputs(){
  const p0=padNow[0],p1=padNow[1];
  return{
    wolf:{left:keys.KeyA||p0.left,right:keys.KeyD||p0.right,up:keys.KeyW||keys.Space||p0.up,down:keys.KeyS||p0.down,
      jumpP:P('KeyW','Space')||padP(0,'up'),actP:P('KeyF','KeyE')||padP(0,'act')},
    eagle:{left:keys.ArrowLeft||p1.left,right:keys.ArrowRight||p1.right,up:keys.ArrowUp||p1.up,down:keys.ArrowDown||p1.down,

}

let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}else if(AC.state==='suspended')AC.resume();}
function tone(f,d,type='square',v=.06,f2=null,delay=0){
  if(!AC||muted)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
}
let noiseBuf=null;
function noise(d,v=.08,f=800){
  if(!AC||muted)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;
  const g=AC.createGain();const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl).connect(g).connect(AC.destination);s.start(t);s.stop(t+d+.02);
}

  flap:()=>tone(700,.06,'triangle',.04,350),
  boing:()=>tone(200,.35,'sine',.12,900),
  pick:()=>{tone(880,.08,'square',.05);tone(1320,.12,'square',.05,null,.08);},
  lever:()=>{tone(220,.06,'square',.06);tone(440,.1,'square',.05,null,.06);},
  gate:()=>tone(160,.25,'sawtooth',.04,90),
  door:()=>{noise(.3,.1,600);tone(523,.1,'square',.05,null,.1);tone(784,.15,'square',.05,null,.2);},
  die:()=>tone(400,.4,'square',.06,60),
  dig:()=>noise(.18,.14,1200),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'square',.05,null,i*.1)),
  hurt:()=>tone(260,.25,'sawtooth',.07,80),
  bite:()=>{noise(.1,.15,2000);tone(180,.1,'square',.06,90);},
  roar:()=>{tone(120,.8,'sawtooth',.08,50);noise(.8,.06,400);},
  stun:()=>[880,660,880,660].forEach((f,i)=>tone(f,.08,'triangle',.05,null,i*.08)),
  thud:()=>{noise(.3,.15,300);tone(80,.3,'sine',.12,40);},

  plate:()=>tone(330,.06,'square',.04),

        bass:[45,45,0,45,45,0,45,0,41,41,0,41,41,0,43,0,45,45,0,45,45,0,45,0,40,40,0,40,44,0,44,0]},
};
const midi=n=>440*Math.pow(2,(n-69)/12);
let musName='calm',musStep=0,musNext=0;
function updMusic(){
  if(!AC||muted)return;const m=MUS[musName];
  if(musNext<AC.currentTime-.2)musNext=AC.currentTime;
  while(musNext<AC.currentTime+.15){
    const i=musStep%m.lead.length,t=musNext-AC.currentTime;
    if(m.lead[i])tone(midi(m.lead[i]),m.step*.9,'square',.016,null,t);
    if(m.bass[i])tone(midi(m.bass[i]),m.step*1.8,'triangle',.035,null,t);
    musStep++;musNext+=m.step;
  }
}

let G=null,state='title',T=0,showHint=false,selIdx=0,stateT=0,confetti=[];
function makePlayer(type,tx,ty){
  const w=type==='wolf'?20:14,h=type==='wolf'?14:12;
  const p={type,x:tx*16+8-w/2,y:(ty+1)*16-h,w,h,vx:0,vy:0,onGround:false,face:1,dead:0,key:null,anim:0,
    coyote:0,jbuf:0,jumping:false,hp:3,inv:0,dive:false,sniff:false,bite:0,flapT:0,flapping:false,inExit:false,push:false,ground:null,downed:false,lastDx:0};
  p.sx=p.x;p.sy=p.y;return p;
}
function loadLevel(i){
  const L=LEVELS[i];
  G={i,L,theme:THEMES[L.theme],grid:L.map.map(r=>r.split('')),plates:[],levers:[],keys:[],digs:[],crates:[],exits:[],
    gates:{},gateOpen:{},gateAnim:{},mush:{},doorMid:new Set(),t:0,sniffP:0,sniffHold:0,sniffX:0,sniffY:0,done:0,
    toast:null,toastCD:{},hintT:L.boss?9:14,parts:[],boss:null,waves:[],bubbles:[],shake:0,acc:0,tags:3};
  let wolf,eagle;
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const ch=G.grid[ty][tx];let clear=true;
    if(ch==='w')wolf=makePlayer('wolf',tx,ty);
    else if(ch==='e')eagle=makePlayer('eagle',tx,ty);
    else if('abc'.includes(ch))G.plates.push({tx,ty,g:ch,pressed:false});
    else if('123'.includes(ch))G.levers.push({tx,ty,g:'abc'['123'.indexOf(ch)],on:false,anim:0});
    else if(ch==='k')G.keys.push(newKey(tx*16+8,ty*16+9));
    else if(ch==='*')G.digs.push({tx,ty,dug:false});
    else if(ch==='o')G.crates.push({x:tx*16,y:ty*16,w:16,h:16,vx:0,vy:0,locked:false,onGround:false,isCrate:true});
    else if(ch==='>')G.exits.push({tx,ty});
    else{clear=false;if('ABC'.includes(ch)){const g=ch.toLowerCase();(G.gates[g]=G.gates[g]||[]).push([tx,ty]);G.gateOpen[g]=false;G.gateAnim[g]=0;}}
    if(clear)G.grid[ty][tx]='.';
  }
  for(let tx=0;tx<COLS;tx++)for(let ty=0;ty<ROWS;ty++){
    if(G.grid[ty][tx]==='D'&&cell(tx,ty-1)!=='D'){let n=0;while(cell(tx,ty+n)==='D')n++;G.doorMid.add(tx+','+(ty+Math.floor((n-1)/2)));}
  }
  G.wolf=wolf;G.eagle=eagle;G.players=[wolf,eagle];
  G.sniffX=wolf.x+wolf.w/2;G.sniffY=wolf.y;
  if(L.boss){G.boss=makeFrog();musName='boss';}else musName='calm';
  if(QS.get('faro')==='1')G.forceSniff=true;
}
function newKey(x,y){return{x,y,ox:x,oy:y,holder:null,cool:0,used:false,bob:Math.random()*6,pop:0};}
function cell(tx,ty){if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return'#';return G.grid[ty][tx];}
function toast(s,dur=2.6,key=null,cd=4){
  if(key){if((G.toastCD[key]||0)>G.t)return;G.toastCD[key]=G.t+cd;}
  G.toast={s,t:dur};
}
function parts(x,y,n,col,spd=60,grav=200,life=.6,size=2){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.3,life:life*(.6+Math.random()*.6),max:life,col,grav,size});}
}

// ---------------------------------------------------------- faro
const sniffRadius=()=>G.L.boss?330:260;
function updSniff(dt){
  const w=G.wolf;
  if((w.sniff||G.forceSniff)&&!w.dead){G.sniffP=Math.min(1,G.sniffP+dt*5);G.sniffHold=1;}
  else if(G.sniffHold>0)G.sniffHold-=dt;
  else G.sniffP=Math.max(0,G.sniffP-dt*2.5);
  if(!w.dead){G.sniffX=w.x+w.w/2;G.sniffY=w.y+w.h/2;}
}
function revealAt(x,y){
  if(G.sniffP<=0)return 0;const Rr=sniffRadius();
  const d=Math.hypot(x-G.sniffX,y-G.sniffY);if(d>Rr)return 0;
  return G.sniffP*Math.min(1,(Rr-d)/40);
}
const hiddenSolid=(tx,ty)=>revealAt(tx*16+8,ty*16+8)>.4;

// ---------------------------------------------------------- colisão
function solidAt(tx,ty,who){
  const x=tx*16,y=ty*16;
  if(tx<0||ty<0||tx>=COLS||ty>=ROWS)return{x,y,w:16,h:16};
  const ch=G.grid[ty][tx];
  switch(ch){
    case'#':case'D':return{x,y,w:16,h:16};
    case'm':return{x,y,w:16,h:16,mush:tx+','+ty};
    case'A':case'B':case'C':return G.gateOpen[ch.toLowerCase()]?null:{x,y,w:16,h:16};
    case'h':return hiddenSolid(tx,ty)?{x,y,w:16,h:8}:null;
    case'~':return who==='crate'&&cell(tx,ty-1)!=='~'?{x,y:y+5,w:16,h:11}:null;
  }
  return null;
}
function collide(e,who){
  const out=[];
  const x0=Math.floor(e.x/16),x1=Math.floor((e.x+e.w-.001)/16),y0=Math.floor(e.y/16),y1=Math.floor((e.y+e.h-.001)/16);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const r=solidAt(tx,ty,who);if(r&&ov(e,r))out.push(r);}
  for(const c of G.crates)if(c!==e&&ov(e,c))out.push(c);
  return out;
}
function crateMoveX(c,dx){
  const ox=c.x;c.x+=dx;
  const hits=collide(c,'crate');
  for(const r of hits){if(dx>0)c.x=Math.min(c.x,r.x-c.w);else c.x=Math.max(c.x,r.x+r.w);}
  if(dx>0)c.x=Math.max(c.x,ox);else c.x=Math.min(c.x,ox);
  return c.x-ox;
}
function moveX(e,dx,who){
  if(!dx)return false;
  e.x+=dx;let hits=collide(e,who);
  if(!hits.length)return false;
  if(who==='wolf'){
    let pushed=false;
    for(const c of hits)if(c.isCrate&&!c.locked&&c.onGround&&Math.abs((c.y+c.h)-(e.y+e.h))<6){crateMoveX(c,dx);pushed=true;}
    if(pushed){e.push=true;hits=collide(e,who);if(!hits.length)return false;}
  }
  for(const r of hits){if(dx>0)e.x=Math.min(e.x,r.x-e.w);else e.x=Math.max(e.x,r.x+r.w);}
  e.vx=0;return true;
}
function moveY(e,dy,who){
  const prevBottom=e.y+e.h;
  e.y+=dy;e.onGround=false;e.ground=null;
  const hits=collide(e,who);
  if(who==='eagle'&&dy>0){const w=G.wolf;
    if(!w.dead&&prevBottom<=w.y+.5){const top={x:w.x+1,y:w.y,w:w.w-2,h:w.h,wolfTop:true};if(ov(e,top))hits.push(top);}}
  if(!hits.length)return;
  if(dy>0){
    let top=Infinity,gr=null;for(const r of hits)if(r.y<top){top=r.y;gr=r;}
    e.y=top-e.h;e.onGround=true;e.ground=gr;
    const mush=hits.find(r=>r.mush);
    if(mush){
      e.vy=who==='wolf'?-860:who==='eagle'?-380:-280;e.onGround=false;e.jumping=false;
      G.mush[mush.mush]=.35;sfx.boing();parts(e.x+e.w/2,e.y+e.h,6,'#ffd0d0',60);
    }else e.vy=0;
  }else{let bot=-Infinity;for(const r of hits)bot=Math.max(bot,r.y+r.h);e.y=bot;e.vy=0;}
}

// ---------------------------------------------------------- jogadores
function updWolf(p,inp,dt,first){
  if(p.dead)return;
  p.sniff=!!inp.down;
  const max=(p.sniff?80:120)*(p.push?.6:1);p.push=false;
  const dir=(inp.right?1:0)-(inp.left?1:0);
  if(dir){p.vx+=dir*(p.onGround?1100:800)*dt;p.vx=clamp(p.vx,-max,max);p.face=dir;}
  else{const f=(p.onGround?1400:500)*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f;}
  if(Math.abs(p.vx)>max)p.vx=Math.sign(p.vx)*max;
  p.coyote=p.onGround?.09:p.coyote-dt;
  if(first&&inp.jumpP)p.jbuf=.12;else p.jbuf-=dt;
  if(p.jbuf>0&&p.coyote>0){p.vy=-440;p.jbuf=0;p.coyote=0;p.jumping=true;sfx.jump();}
  if(p.jumping&&!inp.up&&p.vy<-160)p.vy=-160;
  if(p.vy>=0)p.jumping=false;
  p.vy=Math.min(p.vy+1500*dt,600);
  const ox=p.x;
  moveX(p,p.vx*dt,'wolf');
  moveY(p,p.vy*dt,'wolf');
  p.lastDx+=p.x-ox;
  p.anim+=dt;if(p.bite>0)p.bite-=dt;
}
function updEagle(p,inp,dt,first){
  if(p.dead)return;
  const dir=(inp.right?1:0)-(inp.left?1:0);
  const max=p.onGround?80:140;
  if(dir){p.vx+=dir*900*dt;p.vx=clamp(p.vx,-max,max);p.face=dir;}
  else{const f=(p.onGround?1200:350)*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f;}
  if(Math.abs(p.vx)>max&&p.onGround)p.vx=Math.sign(p.vx)*max;
  p.flapping=false;
  if(inp.up){
    if(p.onGround)p.vy=-190;
    p.vy=Math.max(p.vy-1300*dt,-150);p.flapping=true;p.dive=false;
    p.flapT-=dt;if(p.flapT<=0){p.flapT=.2;sfx.flap();}
  }else if(inp.down&&!p.onGround){
    if(!p.dive&&G.boss)sfx.tongue();
    p.dive=true;p.vy=Math.min(p.vy+1600*dt,400);
  }else{
    p.dive=false;
    if(p.vy>110)p.vy=Math.max(110,p.vy-900*dt);else p.vy=Math.min(p.vy+700*dt,110);
  }
  moveX(p,p.vx*dt,'eagle');
  moveY(p,p.vy*dt,'eagle');
  if(p.onGround){p.dive=false;if(p.ground&&p.ground.wolfTop){p.x+=G.wolf.lastDx;G.wolf.lastDx=0;}}
  p.anim+=dt;
}
function hazards(p){
  if(p.dead)return;
  const x0=Math.floor(p.x/16),x1=Math.floor((p.x+p.w-.001)/16),y0=Math.floor(p.y/16),y1=Math.floor((p.y+p.h-.001)/16);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const ch=cell(tx,ty),x=tx*16,y=ty*16;let r=null;
    if(ch==='^')r={x:x+2,y:y+9,w:12,h:7};
    else if(ch==='~')r={x,y:y+6,w:16,h:10};
    else if(ch==='%')r={x:x+3,y:y+3,w:10,h:10};
    if(r&&ov(p,r)){kill(p,ch);return;}
  }
}
function nome(p){return p.type==='wolf'?'Lobo':'Águia';}
function kill(p,why){
  if(p.dead||G.done)return;
  p.dead=1.1;sfx.die();G.shake=.2;
  parts(p.x+p.w/2,p.y+p.h/2,18,p.type==='wolf'?'#9aa3b5':'#8a5a30',110,300,.8,2);
  if(p.key){returnKey(p.key);p.key=null;}
  if(why==='%')toast('Ai! Espinhos escondidos... use o FARO do lobo!',2.6,'k%',3);
  else if(why==='~')toast(p.type==='wolf'?'O lobo caiu na água funda!':'A águia caiu na água!',2,'k~',3);
  else if(why==='^')toast('Ai! Espinhos!',1.5,'k^',3);
}
function returnKey(k){k.holder=null;k.x=k.ox;k.y=k.oy;k.cool=.3;}
function respawn(p){
  p.x=p.sx;p.y=p.sy;p.vx=p.vy=0;p.dead=0;p.inv=1;p.hp=3;p.downed=false;p.dive=false;
  parts(p.x+p.w/2,p.y+p.h/2,12,'#fff',60,0,.5);
}
function hurt(p,fromX){
  if(p.inv>0||p.dead||!G.boss||G.boss.state==='dead')return;
  p.hp--;p.inv=1.5;p.vx=(p.x+p.w/2<fromX?-1:1)*220;p.vy=-260;p.jumping=false;sfx.hurt();G.shake=.25;
  parts(p.x+p.w/2,p.y+p.h/2,10,'#ff6060',90,200,.5);
  if(p.hp<=0){p.dead=3.5;p.downed=true;if(p.key){returnKey(p.key);p.key=null;}toast(nome(p)+' desmaiou! Volta em 3 segundos...',2.5);}
}

// ---------------------------------------------------------- caixas
function updCrates(dt){
  for(const c of G.crates){
    if(c.locked)continue;
    c.vy=Math.min(c.vy+1500*dt,600);
    moveY(c,c.vy*dt,'crate');
    if(c.onGround){
      for(const pl of G.plates){
        if(Math.abs(c.y+c.h-(pl.ty+1)*16)<1&&Math.abs(c.x-pl.tx*16)<8){c.x=pl.tx*16;c.locked=true;sfx.plate();parts(c.x+8,c.y+16,8,'#fff',40);}
      }
    }
  }
}

// ---------------------------------------------------------- lógica por quadro
function groupActive(g){
  const ps=G.plates.filter(p=>p.g===g),ls=G.levers.filter(l=>l.g===g);
  if(!ps.length&&!ls.length)return false;
  return ps.every(p=>p.pressed)&&ls.every(l=>l.on);
}
function gateBlocked(g){
  for(const[tx,ty]of G.gates[g]){const r={x:tx*16,y:ty*16,w:16,h:16};
    for(const p of G.players)if(!p.dead&&ov(p,r))return true;
    for(const c of G.crates)if(ov(c,r))return true;}
  return false;
}
function onTileFloor(e,tx,ty,inset=2){
  return e.onGround&&Math.abs(e.y+e.h-(ty+1)*16)<1.5&&e.x+e.w-inset>tx*16+2&&e.x+inset<tx*16+14;
}
function frameLogic(dt,inp){
  updSniff(dt);
  const{wolf,eagle}=G;
  // botões de peso
  for(const pl of G.plates){
    const was=pl.pressed;
    pl.pressed=(!wolf.dead&&onTileFloor(wolf,pl.tx,pl.ty))||G.crates.some(c=>c.locked&&c.x===pl.tx*16&&Math.abs(c.y+16-(pl.ty+1)*16)<1);
    if(pl.pressed&&!was)sfx.plate();
    if(!eagle.dead&&onTileFloor(eagle,pl.tx,pl.ty,1))toast('A águia é leve demais! Precisa do lobo ou de uma caixa.',2.4,'leve',6);
  }
  // alavancas
  for(const lv of G.levers){
    const r={x:lv.tx*16+2,y:lv.ty*16,w:12,h:16};
    if(!lv.on&&!eagle.dead&&ov(eagle,r)){lv.on=true;sfx.lever();parts(lv.tx*16+8,lv.ty*16+6,10,GCOL[lv.g],60);toast('Alavanca '+GNOME[lv.g]+' puxada!',1.8);}
    if(!lv.on&&!wolf.dead&&ov(wolf,r))toast('Só a águia consegue puxar a alavanca com o bico!',2.4,'lvw',5);
    lv.anim=clamp(lv.anim+(lv.on?dt*6:-dt*6),0,1);
  }
  // portões
  for(const g in G.gates){
    let want=groupActive(g);
    if(!want&&G.gateOpen[g]&&gateBlocked(g))want=true;
    if(want!==G.gateOpen[g]){sfx.gate();G.gateOpen[g]=want;}
    G.gateAnim[g]=clamp(G.gateAnim[g]+(want?dt*4:-dt*6),0,1);
  }
  for(const k in G.mush)G.mush[k]=Math.max(0,G.mush[k]-dt);
  // chaves
  for(const k of G.keys){
    if(k.used)continue;
    if(k.holder){k.x=k.holder.x+k.holder.w/2;k.y=k.holder.y-9;continue;}
    k.cool-=dt;k.bob+=dt;if(k.pop>0)k.pop-=dt;
    const kr={x:k.x-6,y:k.y-6,w:12,h:12};
    for(const p of G.players){
      if(!p.dead&&!p.key&&k.cool<=0&&ov(p,kr)){k.holder=p;p.key=k;sfx.pick();toast((p.type==='wolf'?'O lobo':'A águia')+' pegou a chave!',1.8);break;}
    }
  }
  // portas
  for(const p of G.players){
    if(p.dead||!p.key)continue;
    const r=expand(p,3);
    const x0=Math.floor(r.x/16),x1=Math.floor((r.x+r.w)/16),y0=Math.floor(r.y/16),y1=Math.floor((r.y+r.h)/16);
    let opened=false;
    for(let ty=y0;ty<=y1&&!opened;ty++)for(let tx=x0;tx<=x1&&!opened;tx++)if(cell(tx,ty)==='D'){openDoor(tx,ty);opened=true;}
    if(opened){p.key.used=true;p.key.holder=null;p.key=null;toast('Porta aberta!',1.8);}
  }
  // ações
  for(const p of G.players){
    if(p.dead)continue;
    const a=p===wolf?inp.wolf.actP:inp.eagle.actP;
    if(a)doAction(p);
  }
  // saída
  if(!G.L.boss&&!G.done){
    for(const p of G.players)p.inExit=!p.dead&&G.exits.some(e=>ov(p,{x:e.tx*16,y:e.ty*16-8,w:16,h:24}));
    if(wolf.inExit&&eagle.inExit){G.done=1.3;sfx.win();for(const e of G.exits)parts(e.tx*16+8,e.ty*16+4,14,'#ffe14d',90,100,1);}
  }
  // morte / renascer
  for(const p of G.players){
    if(p.dead>0){p.dead-=dt;if(p.dead<=0)respawn(p);}
    if(p.inv>0)p.inv-=dt;
  }
  // partículas
  for(const q of G.parts){q.life-=dt;q.vy+=q.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  if(G.toast){G.toast.t-=dt;if(G.toast.t<=0)G.toast=null;}
  if(G.shake>0)G.shake-=dt;
  if(G.tags>0)G.tags-=dt;if(G.hintT>0)G.hintT-=dt;
  if(G.done>0){G.done-=dt;if(G.done<=0){G.done=-1;finishLevel();}}
}
function openDoor(tx,ty){
  const st=[[tx,ty]];
  while(st.length){const[x,y]=st.pop();if(cell(x,y)!=='D')continue;G.grid[y][x]='.';parts(x*16+8,y*16+8,8,'#a8743a',80,300,.7,3);
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);}
  sfx.door();
}
function digUnder(p){
  for(const d of G.digs){if(d.dug)continue;
    const cx=p.x+p.w/2;
    if(p.onGround&&Math.abs(p.y+p.h-(d.ty+1)*16)<2&&cx>d.tx*16-6&&cx<d.tx*16+22)return d;}
  return null;
}
function doAction(p){
  const o=p===G.wolf?G.eagle:G.wolf;
  if(p.type==='wolf'){
    p.bite=.25;
    if(G.boss){wolfBite(p);return;}
    const d=digUnder(p);
    if(d){
      if(revealAt(d.tx*16+8,d.ty*16+8)>.2){
        d.dug=true;sfx.dig();parts(d.tx*16+8,d.ty*16+14,16,'#8a5a2b',90,300,.7,2);
        const k=newKey(d.tx*16+8,d.ty*16-4);k.cool=.45;k.pop=.4;G.keys.push(k);
        toast('Achou uma chave enterrada!',2);return;
      }else{toast('Tem um cheiro aqui... segure S para farejar!',2.2,'cheiro',3);return;}
    }
  }
  if(p.key){
    if(!o.dead&&!o.key&&ov(expand(p,10),o)){
      const k=p.key;p.key=null;k.holder=o;o.key=k;sfx.give();
      toast((p.type==='wolf'?'O lobo deu':'A águia deu')+' a chave para '+(o.type==='wolf'?'o lobo!':'a águia!'),2);
    }else{
      const k=p.key;p.key=null;k.holder=null;k.x=p.x+p.w/2;k.y=p.y+p.h/2;k.oy=k.y;k.ox=k.x;k.cool=.7;sfx.no();
      toast('Chave largada. (Encoste no amigo e aperte ação para dar!)',2.2,'larg',6);
    }
  }
}
function finishLevel(){
  saveProgress(G.i+2);
  state='complete';stateT=0;
}

// ---------------------------------------------------------- chefe: sapo gigante
function makeFrog(){return{x:300,y:FLOOR-46,w:72,h:46,vx:0,vy:0,face:-1,hp:6,maxhp:6,state:'intro',t:2.2,flash:0,bites:0,
  tongue:null,mouth:0,jumps:0,target:null,aim:null,p2:false,breathe:0,stars:0,introDone:false};}
function frogMouth(f){const ox=f.x+f.w/2-40,oy=f.y+f.h-52;return{x:ox+(f.face>0?75:5),y:oy+33};}
function frogFaceTo(f,p){if(p)f.face=(p.x+p.w/2>f.x+f.w/2)?1:-1;}
function aliveTarget(){const a=G.players.filter(p=>!p.dead);return a.length?a[Math.random()*a.length|0]:null;}
function frogChoose(f){
  const tg=aliveTarget();f.target=tg;frogFaceTo(f,tg);
  if(!tg){f.state='idle';f.t=.6;return;}
  const r=Math.random(),p2=f.p2;
  if(r<.4){f.state='crouch';f.t=p2?.35:.55;f.jumps=p2?2:1;}
  else if(r<.72){f.state='tongueWind';f.t=p2?.5:.7;const m=frogMouth(f);const ang=Math.atan2(tg.y+tg.h/2-m.y,tg.x+tg.w/2-m.x);f.aim=ang;}
  else{f.state='spitWind';f.t=.55;}
}
function updFrog(f,dt){
  f.breathe+=dt;if(f.flash>0)f.flash-=dt;
  f.mouth=Math.max(0,f.mouth-dt*3);
  switch(f.state){
    case'intro':f.t-=dt;f.mouth=Math.min(1,.5+.5*Math.sin(f.t*10));
      if(!f.introDone&&f.t<1.8){f.introDone=true;sfx.roar();G.shake=.6;toast('O SAPO GIGANTE ACORDOU!',2.4);}
      if(f.t<=0){f.state='idle';f.t=1.2;}break;
    case'idle':f.t-=dt;if(f.t<=0)frogChoose(f);break;
    case'crouch':f.t-=dt;if(f.t<=0){
        const tg=f.target&&!f.target.dead?f.target:aliveTarget();
        const air=2*700/1500;const tx=tg?tg.x+tg.w/2:W/2;
        f.vy=f.p2?-760:-700;f.vx=clamp((tx-(f.x+f.w/2))/air,-320,320);frogFaceTo(f,tg);f.state='air';sfx.jump();
      }break;
    case'air':
      f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
      if(f.x<16){f.x=16;f.vx=Math.abs(f.vx)*.3;}if(f.x>W-16-f.w){f.x=W-16-f.w;f.vx=-Math.abs(f.vx)*.3;}
      if(f.y+f.h>=FLOOR&&f.vy>0){
        f.y=FLOOR-f.h;f.vy=0;f.vx=0;G.shake=.45;sfx.thud();
        G.waves.push({x:f.x+6,dir:-1,t:1.6},{x:f.x+f.w-6,dir:1,t:1.6});
        parts(f.x+f.w/2,FLOOR-2,20,'#b59a6a',140,300,.6,3);
        f.jumps--;
        if(f.jumps>0){f.state='crouch';f.t=.3;f.target=aliveTarget();}
        else{f.state='idle';f.t=f.p2?.6:1.1;}
      }break;
    case'tongueWind':f.t-=dt;f.mouth=Math.min(1,f.mouth+dt*6);
      if(f.t<=0){f.state='tongue';f.tongue={len:0,max:f.p2?290:240,ph:'out',hold:.22};sfx.tongue();}break;
    case'tongue':{
      f.mouth=1;const tg=f.tongue;
      if(tg.ph==='out'){tg.len+=900*dt;if(tg.len>=tg.max){tg.len=tg.max;tg.ph='hold';}}
      else if(tg.ph==='hold'){tg.hold-=dt;if(tg.hold<=0)tg.ph='in';}
      else{tg.len-=650*dt;if(tg.len<=0){f.tongue=null;f.state='idle';f.t=f.p2?.6:1;break;}}
      const m=frogMouth(f);const dx=Math.cos(f.aim),dy=Math.sin(f.aim);
      for(let s=8;s<=tg.len;s+=6){const px=m.x+dx*s,py=m.y+dy*s;
        if(solidAt(Math.floor(px/16),Math.floor(py/16),'tongue')){tg.len=Math.min(tg.len,s);if(tg.ph==='out')tg.ph='hold';break;}
        for(const p of G.players)if(!p.dead&&px>p.x-3&&px<p.x+p.w+3&&py>p.y-3&&py<p.y+p.h+3)hurt(p,m.x);}
      break;}
    case'spitWind':f.t-=dt;f.mouth=.5+.5*Math.sin(f.t*30);
      if(f.t<=0){
        const m=frogMouth(f);const n=f.p2?6:4;sfx.spit();
        for(let i=0;i<n;i++){const tg=aliveTarget();const tx=tg?tg.x+tg.w/2+rnd(-60,60):rnd(40,W-40);
          const vy=-rnd(320,480),tt=(-vy+Math.sqrt(vy*vy+2*600*Math.max(0,FLOOR-m.y)))/600;
          G.bubbles.push({x:m.x,y:m.y,vx:clamp((tx-m.x)/tt,-260,260),vy,r:6,life:4});}
        f.state='idle';f.t=f.p2?.7:1.1;
      }break;
    case'stun':f.t-=dt;f.stars+=dt;if(f.t<=0){f.state='wake';f.t=.7;sfx.roar();wakePush(f);}break;
    case'wake':f.t-=dt;f.mouth=1;if(f.t<=0){f.state='idle';f.t=.5;}break;
    case'dead':f.t-=dt;f.y+=dt*10;
      if(Math.random()<.4)parts(f.x+rnd(0,f.w),f.y+rnd(0,f.h),3,['#46a33c','#ffe14d','#ff7ad9'][Math.random()*3|0],120,100,.8,3);
      if(f.t<=0&&!G.done){G.done=.1;}break;
  }
  if(!f.p2&&f.hp<=3&&f.state!=='dead'){f.p2=true;toast('O sapo ficou FURIOSO! Mais rápido!',2.4);}
  // contato
  if(!['stun','dead','intro'].includes(f.state)){
    const body={x:f.x+6,y:f.y+6,w:f.w-12,h:f.h-6};
    for(const p of G.players){
      if(p.dead||!ov(p,body))continue;
      if(p.type==='eagle'&&p.dive&&p.y+p.h<f.y+26){
        const ws=weakSpot(f);
        if(revealAt(ws.x,ws.y)>.25){
          f.state='stun';f.t=f.p2?3.6:4.5;f.bites=0;f.tongue=null;f.vx=0;f.mouth=0;
          if(f.y+f.h<FLOOR){f.y=FLOOR-f.h;}
          p.vy=-320;p.dive=false;sfx.stun();G.shake=.3;parts(ws.x,ws.y,20,'#ff7ad9',120,100,.8,3);
          toast('Acertou o ponto fraco! LOBO, MORDA (F)!',2.4);
        }else{
          p.vy=-300;p.dive=false;sfx.no();p.inv=Math.max(p.inv,.4);
          toast('Não dá! O lobo precisa FAREJAR (S) o ponto fraco!',2.4,'nfaro',3);
        }
      }else hurt(p,f.x+f.w/2);
    }
  }
}
function weakSpot(f){const ox=f.x+f.w/2-40,oy=f.y+f.h-52;return{x:ox+(f.face>0?28:80-28),y:oy+19};}
function wakePush(f){for(const p of G.players){if(p.dead)continue;const dx=p.x+p.w/2-(f.x+f.w/2);if(Math.abs(dx)<90){p.vx=Math.sign(dx||1)*260;p.vy=-240;p.jumping=false;}}G.shake=.3;}
function wolfBite(p){
  const f=G.boss;if(!f)return;sfx.bite();
  if(f.state==='stun'&&ov(expand(p,14),f)){
    f.hp--;f.bites++;f.flash=.2;G.shake=.2;parts(f.x+f.w/2,f.y+10,14,'#ffffff',120,200,.5,3);
    if(f.hp<=0){f.state='dead';f.t=2.6;f.tongue=null;G.bubbles=[];G.waves=[];sfx.roar();toast('VOCÊS VENCERAM O SAPO GIGANTE!',3);}
    else if(f.bites>=2){f.state='wake';f.t=.7;sfx.roar();wakePush(f);}
  }else if(f.state!=='stun'&&f.state!=='dead'&&ov(expand(p,14),f)){
    toast('Ele está forte! A águia precisa deixá-lo tonto primeiro.',2.4,'forte',4);
  }
}
function updBossStuff(dt){
  for(const w of G.waves){
    w.t-=dt;w.x+=w.dir*240*dt;if(w.x<16||w.x>W-16)w.t=0;
    for(const p of G.players)if(!p.dead&&p.onGround&&p.y+p.h>=FLOOR-1&&Math.abs(p.x+p.w/2-w.x)<12)hurt(p,w.x-w.dir*20);
  }
  G.waves=G.waves.filter(w=>w.t>0);
  for(const b of G.bubbles){
    b.vy+=600*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.y+b.r>=FLOOR||solidAt(Math.floor(b.x/16),Math.floor(b.y/16),'b')||b.life<=0){b.life=0;parts(b.x,b.y,8,'#bfeaff',70,150,.4);continue;}
    for(const p of G.players)if(!p.dead&&ov(p,{x:b.x-b.r,y:b.y-b.r,w:b.r*2,h:b.r*2})){hurt(p,b.x);b.life=0;parts(b.x,b.y,8,'#bfeaff',70,150,.4);}
  }
  G.bubbles=G.bubbles.filter(b=>b.life>0);
}

// ---------------------------------------------------------- passo de física
function step(dt,inp,first){
  const{wolf,eagle}=G;
  wolf.lastDx=0;
  updWolf(wolf,inp.wolf,dt,first);
  updEagle(eagle,inp.eagle,dt,first);
  updCrates(dt);
  for(const p of G.players)hazards(p);
  if(G.boss){updFrog(G.boss,dt);updBossStuff(dt);}
}
function playUpdate(dt){
  const inp=getInputs();
  G.acc+=dt;G.t+=dt;let first=true;
  while(G.acc>=STEP){step(STEP,inp,first);first=false;G.acc-=STEP;}
  frameLogic(dt,inp);
}

function drawSniffOverlay(t){
  if(G.sniffP<=0)return;
  const Rr=sniffRadius(),cx=G.sniffX,cy=G.sniffY;
  const g=ctx.createRadialGradient(cx,cy,Rr*.55,cx,cy,Rr);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(25,10,45,${.38*G.sniffP})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=.25*G.sniffP;ctx.strokeStyle='#c9ff9a';ctx.lineWidth=1;ctx.setLineDash([3,5]);ctx.lineDashOffset=-t*20;
  ctx.beginPath();ctx.arc(cx,cy,Rr,0,7);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  // rastro de patinhas até tesouros e chaves
  const targets=[];
  for(const d of G.digs)if(!d.dug)targets.push([d.tx*16+8,d.ty*16+14]);
  for(const k of G.keys)if(!k.used&&!k.holder)targets.push([k.x,k.y]);
  if(G.boss&&G.boss.state!=='dead'){const ws=weakSpot(G.boss);targets.push([ws.x,ws.y]);}
  for(const[tx,ty]of targets){
    const d=Math.hypot(tx-cx,ty-cy);if(d>Rr||d<20)continue;
    const n=Math.floor(d/14);
    for(let i=1;i<n;i++){const k=i/n,x=cx+(tx-cx)*k,y=cy+(ty-cy)*k,ph=(t*3-i*.25)%1;
      ctx.globalAlpha=G.sniffP*Math.max(0,Math.sin(ph*Math.PI))*.8;
      const side=i%2?2:-2;R(Math.round(x+side*.7),Math.round(y+side),3,2,'#ffe14d');R(Math.round(x+side*.7),Math.round(y+side)-2,1,1,'#ffe14d');R(Math.round(x+side*.7)+2,Math.round(y+side)-2,1,1,'#ffe14d');}
    ctx.globalAlpha=1;
  }
}

// ---------------------------------------------------------- máquina de estados
function startLevel(i){loadLevel(i);state='play';stateT=0;}
function update(dt){
  stateT+=dt;
  if(P('KeyM')){muted=!muted;}
  switch(state){
    case'title':
      if(confirmP()||mouseClick){state='select';selIdx=Math.min(unlocked-1,9);sfx.select();}
      break;
    case'select':{
      if(P('ArrowRight','KeyD')){selIdx=Math.min(9,selIdx+1);sfx.select();}
      if(P('ArrowLeft','KeyA')){selIdx=Math.max(0,selIdx-1);sfx.select();}
      if(P('ArrowDown','KeyS')){selIdx=Math.min(9,selIdx+5);sfx.select();}
      if(P('ArrowUp','KeyW')){selIdx=Math.max(0,selIdx-5);sfx.select();}
      if(mouseClick){for(let i=0;i<10;i++){const r=selRect(i);if(mouseClick.x>=r.x&&mouseClick.x<r.x+r.w&&mouseClick.y>=r.y&&mouseClick.y<r.y+r.h){if(selIdx===i&&i<unlocked){startLevel(i);}else selIdx=i;sfx.select();}}}
      if(P('Escape'))state='title';
      else if(state==='select'&&P('Enter','Space','NumpadEnter','KeyF')){if(selIdx<unlocked)startLevel(selIdx);else sfx.no();}
      break;}
    case'play':
      if(P('Escape','KeyP')){state='pause';break;}
      if(P('KeyR')){loadLevel(G.i);break;}
      if(P('KeyH'))showHint=!showHint;
      playUpdate(dt);
      if(G.boss&&G.done===-1){}
      break;
    case'pause':
      if(P('Escape','KeyP'))state='play';
      else if(P('KeyR')){loadLevel(G.i);state='play';}
      else if(P('KeyQ')){state='title';musName='calm';}
      else if(mouseClick)state='play';
      break;
    case'complete':
      if(stateT>.6&&(confirmP()||mouseClick)){
        if(G.L.boss){state='win';confetti=[];}
        else startLevel(G.i+1);
      }
      break;
    case'win':
      if(Math.random()<.6)confetti.push({x:rnd(0,W),y:-4,vy:rnd(30,70),vx:rnd(-20,20),col:['#ffe14d','#ff7ad9','#7fd8ff','#7dff8a','#ffb347'][Math.random()*5|0]});
      for(const c of confetti){c.y+=c.vy*dt;c.x+=c.vx*dt;}confetti=confetti.filter(c=>c.y<H);
      if(stateT>1&&(confirmP()||mouseClick)){state='title';musName='calm';}
      break;
  }
  mouseClick=null;
}
// boss: ao vencer, ir direto para a tela de vitória
const _finish=finishLevel;
finishLevel=function(){if(G.L.boss){saveProgress(10);state='win';stateT=0;confetti=[];musName='calm';}else _finish();};

function render(t){
  ctx.setTransform(BS,0,0,BS,0,0);ctx.imageSmoothingEnabled=false;
  switch(state){
    case'title':renderTitle(t);break;case'select':renderSelect(t);break;case'play':renderPlay(t);break;
    case'pause':renderPause(t);break;case'complete':renderComplete(t);break;case'win':renderWin(t);break;
  }
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  pollPads();update(dt);updMusic();render(T);
  for(const k in pressed)delete pressed[k];
  requestAnimationFrame(frame);
}
initTitle();
const fq=parseInt(QS.get('fase')||'',10);
if(fq>=1&&fq<=10){saveProgress(Math.max(unlocked,fq));startLevel(fq-1);}
// API para testes
window.AA={get G(){return G;},get state(){return state;},loadLevel,startLevel,step,frameLogic,LEVELS,STEP,solidAt,weakSpot,revealAt,
  sim(frames,fn){for(let i=0;i<frames;i++){const base={wolf:{},eagle:{}};fn&&fn(base,i);
    for(let s=0;s<2;s++)step(STEP,base,s===0);frameLogic(1/60,base);}return G;}};
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(frame));
</script>
