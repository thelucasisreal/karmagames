<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5cc8ff">
<title>Torre de Blocos · Karma Games</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:800;font-display:swap;src:url("../../assets/fonts/unbounded-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url("../../assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#5cc8ff;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Torre de Blocos"></canvas>
<script>
const SLUG = 'torre';
(() => {
'use strict';
/* ---------- Núcleo compartilhado (Karma Games) ---------- */
const COL = {bg:'#2d1b4e', surf:'#ffffff', line:'#ece3f5', text:'#2d1b4e', muted:'#7b6c93', acc:'#ff4f9a', coral:'#ff6b5a', sky:'#5ac8ff', shadow:'rgba(45,27,78,0.25)', dimRGB:'45,27,78', ctaText:'#ffffff'};
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)') || ('ontouchstart' in window);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const FT = s => '800 ' + Math.round(s) + 'px Unbounded, system-ui, sans-serif';
const FS = s => '500 ' + Math.round(s) + 'px Geist, system-ui, sans-serif';

/* Recorde */
const KEY = 'karma:' + SLUG + ':recorde';
function loadBest() { try { const v = parseInt(window.localStorage.getItem(KEY), 10); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
let best = loadBest();

/* Fontes: espera antes do primeiro texto no canvas */
let fontsReady = false;
(function () {
  let done = false;
  const finish = () => { if (!done) { done = true; fontsReady = true; } };
  setTimeout(finish, 1500);
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 32px Unbounded'), document.fonts.load('500 16px Geist')])
        .then(() => document.fonts.ready).then(finish, finish);
    } else finish();
  } catch (e) { finish(); }
})();

/* Estado */
let state = 'menu';         // menu | play | paused | over (+ estados próprios do jogo)
let stateT = 0;             // tempo no estado atual
let newRecord = false;
let lastScore = 0;
function setState(s) { state = s; stateT = 0; }
function finishGame(score) {
  lastScore = score;
  newRecord = score > best && score > 0;
  if (newRecord) { best = score; saveBest(best); }
  setState('over');
}

/* Tremor de tela */
let shakeT = 0, shakeDur = 1, shakeMag = 0;
function shake(mag, dur) {
  if (reduceMotion) return;
  if (mag >= shakeMag * (shakeT / shakeDur)) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
}

/* Partículas (coordenadas do jogo) */
const parts = [];
function burst(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color, g: grav || 0});
  }
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vx *= Math.pow(0.04, dt); p.vy *= Math.pow(0.04, dt);
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(scale) {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.4 + 0.6 * k) * (scale || 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Desenho utilitário */
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align, base) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.fillText(s, x, y);
}
function fitFont(s, maxW, size, maker) {
  ctx.font = maker(size);
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}

/* Botão de pausa (toque) */
const pauseBtn = {x: 0, y: 0, s: 40};
function layoutPauseBtn() { pauseBtn.s = 40; pauseBtn.x = W - pauseBtn.s - 12; pauseBtn.y = 10; }
function hitPause(x, y) { const b = pauseBtn; return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6; }
function drawPauseBtn() {
  const b = pauseBtn;
  ctx.fillStyle = COL.surf; rrect(b.x, b.y, b.s, b.s, 10); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(b.x + 0.5, b.y + 0.5, b.s - 1, b.s - 1, 10); ctx.stroke();
  ctx.fillStyle = COL.muted;
  ctx.fillRect(b.x + b.s * 0.36, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
  ctx.fillRect(b.x + b.s * 0.54, b.y + b.s * 0.3, b.s * 0.1, b.s * 0.4);
}

/* Cartão de tela (início / pausa / fim) */
function drawCard(o) {
  ctx.fillStyle = 'rgba(' + (COL.dimRGB || '13,14,18') + ',' + (o.dim == null ? 0.6 : o.dim) + ')';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(W - 32, 440);
  const pad = cw < 340 ? 22 : 30;
  const inner = cw - pad * 2;
  let ts = fitFont(o.title, inner, cw < 340 ? 30 : 38, FT);
  const rows = o.rows || [];
  const lines = o.lines || [];
  let h = pad + ts * 1.15;
  if (o.kicker) h += 22;
  if (o.big != null) h += 78;
  h += rows.length * 34 + (rows.length ? 12 : 0);
  h += lines.length * 24 + (lines.length ? 14 : 0);
  if (o.cta) h += 62;
  let hints = [];
  if (o.hint) {
    ctx.font = FS(12);
    if (ctx.measureText(o.hint).width > inner && o.hint.indexOf(' · ') > 0) {
      const ps = o.hint.split(' · '); let cur = '';
      for (const p of ps) { const t = cur ? cur + ' · ' + p : p; if (cur && ctx.measureText(t).width > inner) { hints.push(cur); cur = p; } else cur = t; }
      if (cur) hints.push(cur);
    } else hints = [o.hint];
    h += 12 + hints.length * 18;
  }
  h += pad - 6;
  const cx = (W - cw) / 2;
  const cy = Math.max(12, (H - h) / 2);
  // sombra deslocada + superfície
  ctx.fillStyle = COL.shadow; rrect(cx + 6, cy + 8, cw, h, 18); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(cx, cy, cw, h, 18); ctx.fill();
  ctx.strokeStyle = COL.line; ctx.lineWidth = 1; rrect(cx + 0.5, cy + 0.5, cw - 1, h - 1, 18); ctx.stroke();
  let y = cy + pad;
  if (o.kicker) { txt(o.kicker.toUpperCase(), W / 2, y + 6, FS(12), o.kickerColor || COL.acc); y += 22; }
  txt(o.title, W / 2, y + ts * 0.55, FT(ts), COL.text); y += ts * 1.15;
  if (o.big != null) {
    txt(String(o.big), W / 2, y + 40, FT(fitFont(String(o.big), inner, 56, FT)), COL.acc); y += 78;
  }
  if (rows.length) {
    y += 6;
    for (const r of rows) {
      ctx.strokeStyle = COL.line; ctx.beginPath(); ctx.moveTo(cx + pad, y + 0.5); ctx.lineTo(cx + cw - pad, y + 0.5); ctx.stroke();
      txt(r[0], cx + pad, y + 18, FS(15), COL.muted, 'left');
      txt(r[1], cx + cw - pad, y + 18, FT(16), r[2] || COL.text, 'right');
      y += 34;
    }
    y += 6;
  }
  if (lines.length) {
    y += 6;
    for (const l of lines) { txt(l, W / 2, y + 10, FS(fitFont(l, inner, 15, FS)), COL.muted); y += 24; }
    y += 8;
  }
  if (o.cta) {
    const bw = Math.min(inner, 280), bh = 48, bx = (W - bw) / 2, by = y + 6;
    const pulse = reduceMotion ? 0 : (Math.sin(perfNow * 4) * 0.5 + 0.5);
    ctx.fillStyle = COL.shadow; rrect(bx + 3, by + 4, bw, bh, 12); ctx.fill();
    ctx.fillStyle = COL.acc; rrect(bx, by - pulse * 1.5, bw, bh, 12); ctx.fill();
    txt(o.cta, W / 2, by + bh / 2 - pulse * 1.5 + 1, FT(fitFont(o.cta, bw - 24, 15, FT)), COL.ctaText || COL.bg);
    y += 62;
  }
  for (let i = 0; i < hints.length; i++) txt(hints[i], W / 2, y + 14 + i * 18, FS(fitFont(hints[i], inner, 13, FS)), COL.muted);
}

/* HUD: rótulo pequeno + valor, numa pílula para ler sobre fundo colorido */
function hudStat(label, value, x, y, align, color) {
  ctx.font = FT(22); const vw = ctx.measureText(String(value)).width;
  ctx.font = FS(11); const lw = ctx.measureText(label.toUpperCase()).width;
  const w = Math.max(vw, lw) + 24, h = 50;
  const bx = align === 'right' ? x - w + 12 : align === 'center' ? x - w / 2 : x - 12;
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rrect(bx + 2, y - 6 + 3, w, h, 14); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(bx, y - 6, w, h, 14); ctx.fill();
  txt(label.toUpperCase(), x, y, FS(11), COL.muted, align, 'top');
  txt(String(value), x, y + 15, FT(22), color || COL.text, align, 'top');
}

/* Som (WebAudio): só liga depois da primeira interação; M deixa mudo */
let actx = null, muted = false;
try { muted = window.localStorage.getItem('karma:som') === '0'; } catch (e) {}
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') try { actx.resume(); } catch (e) {} return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
}
function toggleMute() { muted = !muted; try { window.localStorage.setItem('karma:som', muted ? '0' : '1'); } catch (e) {} muteToast = 1.2; }
let muteToast = 0;
function beep(freq, dur, type, vol, slide) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime((vol || 0.08), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function drawMuteToast() {
  if (muteToast <= 0) return;
  ctx.globalAlpha = clamp(muteToast, 0, 1);
  const s = muted ? 'Som desligado (M)' : 'Som ligado (M)';
  ctx.font = FS(14); const w = ctx.measureText(s).width + 28;
  ctx.fillStyle = COL.surf; rrect((W - w) / 2, H - 52, w, 34, 17); ctx.fill();
  txt(s, W / 2, H - 35, FS(14), COL.text);
  ctx.globalAlpha = 1;
}

let perfNow = 0;

/* ---------- Torre de Blocos ---------- */
const BH = 40;            // altura do bloco (unidades do mundo)
const BASE_W = 200;       // largura inicial
const PERFECT = 5;        // tolerância do acerto perfeito
let sc = 1, groundY = 0, halfView = 300, range = 240;
let tower = [], mover = null, debris = [], rings = [], pops = [];
let cam = 0, score = 0, perfects = 0, combo = 0, dropCount = 0, deadT = 0;
let flash = 0, demoT = 0, demoAim = 0;
let clouds = [], stars = [];

function hueFor(i) { return (i * 13 + 330) % 360; }
function blockColor(i, l) { return 'hsl(' + hueFor(i) + ',85%,' + (l || 62) + '%)'; }

function layout() {
  sc = Math.min(W / 440, H / 640);
  sc = clamp(sc, 0.55, 1.6);
  groundY = H - Math.max(36, H * 0.09);
  halfView = W / 2 / sc;
  range = Math.min(halfView - 30, 250);
}
function makeSky() {
  clouds = []; stars = [];
  for (let i = 0; i < 14; i++) clouds.push({x: rand(-1, 1), y: rand(150, 2600), s: rand(0.7, 1.4), sp: rand(4, 12) * (Math.random() < 0.5 ? -1 : 1)});
  for (let i = 0; i < 90; i++) stars.push({x: Math.random(), y: Math.random(), r: rand(0.8, 2.2), tw: rand(0, 6)});
}
function newMover() {
  const n = tower.length, top = tower[n - 1];
  const fromLeft = n % 2 === 0;
  const sp = Math.min(150 + n * 7, 380);
  mover = {x: fromLeft ? -range : range, w: top.w, dir: fromLeft ? 1 : -1, sp, squash: 0, born: 0};
}
function reset() {
  layout();
  tower = [{x: 0, w: BASE_W, squash: 0}];
  debris = []; rings = []; pops = []; parts.length = 0;
  cam = 0; score = 0; perfects = 0; combo = 0; dropCount = 0; flash = 0;
  newMover();
  demoAim = rand(-14, 14);
}
function blockScreenY(i) { return groundY - (i + 1) * BH * sc + cam * sc; }
function camTarget() {
  const n = tower.length;
  return Math.max(0, n * BH - (groundY - H * 0.45) / sc);
}

function drop(isDemo) {
  if (!mover) return;
  const n = tower.length, top = tower[n - 1];
  const dx = mover.x - top.x;
  const over = top.w - Math.abs(dx);
  const sy = blockScreenY(n);
  if (over <= 0) {
    // errou feio: o bloco inteiro cai
    debris.push({x: mover.x, y: n * BH + BH / 2, w: mover.w, vx: mover.dir * 60, vy: 0, rot: 0, vr: mover.dir * 2.2, hue: hueFor(n), face: true});
    mover = null;
    if (isDemo) { setTimeout(() => { if (state === 'menu') reset(); }, 900); return; }
    beep(180, 0.45, 'sawtooth', 0.07, 60);
    shake(10, 0.4);
    setState('dying'); deadT = 0;
    return;
  }
  let nx, nw;
  if (Math.abs(dx) <= PERFECT) {
    nx = top.x; nw = top.w;
    combo++; perfects++;
    if (combo >= 3) nw = Math.min(BASE_W, nw + 8);
    const bonus = isDemo ? 0 : 1 + Math.min(combo, 5);
    if (!isDemo) {
      score += bonus;
      pops.push({x: W / 2 + nx * sc, y: sy - 10, t: 0, s: combo > 1 ? 'Perfeito x' + combo + '! +' + bonus : 'Perfeito! +' + bonus, big: true});
      beep(520 + Math.min(combo, 8) * 70, 0.18, 'triangle', 0.09);
      setTimeout(() => beep(780 + Math.min(combo, 8) * 70, 0.2, 'triangle', 0.07), 70);
    }
    rings.push({x: nx, i: n, w: nw, t: 0});
    burst(W / 2 + nx * sc, sy + BH * sc / 2, 22, '#fff6a8', 380 * sc, 0.7, 9 * sc, 0);
    burst(W / 2 + nx * sc, sy + BH * sc / 2, 10, '#ffffff', 260 * sc, 0.6, 7 * sc, 0);
    flash = 1;
  } else {
    combo = 0;
    nw = over;
    nx = top.x + dx / 2;
    // pedaço que sobrou cai e é cortado
    const cutW = Math.abs(dx);
    const cutX = dx > 0 ? nx + nw / 2 + cutW / 2 : nx - nw / 2 - cutW / 2;
    debris.push({x: cutX, y: n * BH + BH / 2, w: cutW, vx: Math.sign(dx) * 90, vy: 0, rot: 0, vr: Math.sign(dx) * rand(1.5, 3.5), hue: hueFor(n)});
    if (!isDemo) {
      score += 1;
      pops.push({x: W / 2 + nx * sc, y: sy - 6, t: 0, s: '+1'});
      beep(300 + Math.min(n, 30) * 8, 0.1, 'square', 0.06);
    }
    shake(3, 0.12);
  }
  tower.push({x: nx, w: nw, squash: 1});
  dropCount++;
  newMover();
  if (isDemo) { demoAim = rand(-16, 16); if (tower.length > 14) reset(); }
}

const GAME = {
  resize() { layout(); if (state === 'menu') { if (!tower.length) { makeSky(); reset(); } } },
  start() { reset(); setState('play'); },
  key(e, down) {
    if (!down || e.repeat || state !== 'play') return;
    const k = e.key;
    if (k === ' ' || e.code === 'Space' || k === 'Enter' || k === 'ArrowDown' || k === 's' || k === 'S') drop(false);
  },
  pointer(type) { if (type === 'down' && state === 'play') drop(false); },
  update(dt) {
    flash = Math.max(0, flash - dt * 2.5);
    for (const c of clouds) { c.x += c.sp * dt / 600; if (c.x > 1.3) c.x = -1.3; if (c.x < -1.3) c.x = 1.3; }
    for (const b of tower) b.squash = Math.max(0, b.squash - dt * 4);
    if (mover) {
      mover.born += dt;
      if (state === 'play' || state === 'menu') {
        mover.x += mover.dir * mover.sp * dt;
        if (mover.x > range) { mover.x = range; mover.dir = -1; mover.squash = 1; }
        if (mover.x < -range) { mover.x = -range; mover.dir = 1; mover.squash = 1; }
      }
      mover.squash = Math.max(0, mover.squash - dt * 5);
    }
    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy -= 1400 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (d.y < cam - H / sc - 200) debris.splice(i, 1);
    }
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < 0.6);
    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < 1);
    cam = lerp(cam, camTarget(), 1 - Math.pow(0.02, dt));
    if (state === 'menu' && mover) {
      demoT += dt;
      const top = tower[tower.length - 1];
      if (mover.born > 0.5 && Math.abs(mover.x - (top.x + demoAim)) < 6) drop(true);
    }
    if (state === 'dying') { deadT += dt; if (deadT > 1.1) finishGame(score); }
  },
  draw() {
    // céu que muda com a altura: dia -> pôr do sol -> espaço
    const hgt = clamp(cam / 2400, 0, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    const top1 = hgt < 0.5 ? mixC([92, 200, 255], [255, 120, 170], hgt * 2) : mixC([255, 120, 170], [40, 20, 90], (hgt - 0.5) * 2);
    const bot1 = hgt < 0.5 ? mixC([200, 240, 255], [255, 200, 120], hgt * 2) : mixC([255, 200, 120], [110, 60, 170], (hgt - 0.5) * 2);
    g.addColorStop(0, top1); g.addColorStop(1, bot1);
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
    // estrelas aparecem lá no alto
    if (hgt > 0.45) {
      const a = clamp((hgt - 0.45) * 2.5, 0, 1);
      ctx.fillStyle = '#fff';
      for (const s of stars) {
        ctx.globalAlpha = a * (reduceMotion ? 0.8 : 0.5 + 0.5 * Math.sin(perfNow * 2 + s.tw));
        ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // sol fofo
    const sunY = H * 0.2 + cam * sc * 0.08;
    if (sunY < H + 80) {
      ctx.fillStyle = 'rgba(255,240,150,0.35)'; ctx.beginPath(); ctx.arc(W * 0.82, sunY, 58 * sc, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe36b'; ctx.beginPath(); ctx.arc(W * 0.82, sunY, 40 * sc, 0, 7); ctx.fill();
      ctx.fillStyle = '#5a3b1a';
      ctx.beginPath(); circ(W * 0.82 - 12 * sc, sunY - 4 * sc, 3.5 * sc); circ(W * 0.82 + 12 * sc, sunY - 4 * sc, 3.5 * sc); ctx.fill();
      ctx.strokeStyle = '#5a3b1a'; ctx.lineWidth = 2.5 * sc; ctx.beginPath(); ctx.arc(W * 0.82, sunY + 4 * sc, 8 * sc, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,120,0.5)'; ctx.beginPath(); circ(W * 0.82 - 22 * sc, sunY + 6 * sc, 6 * sc); circ(W * 0.82 + 22 * sc, sunY + 6 * sc, 6 * sc); ctx.fill();
    }
    // nuvens (parallax)
    for (const c of clouds) {
      const cy = groundY - c.y * sc + cam * sc * 0.6;
      if (cy < -80 || cy > H + 80) continue;
      cloud(W / 2 + c.x * W * 0.6, cy, 46 * sc * c.s);
    }
    // chão: morrinho verde
    const gy = groundY + cam * sc;
    if (gy < H + 10) {
      ctx.fillStyle = '#4fd17a';
      ctx.beginPath(); ctx.moveTo(-20, gy + 6);
      ctx.quadraticCurveTo(W * 0.25, gy - 26 * sc, W * 0.5, gy);
      ctx.quadraticCurveTo(W * 0.75, gy + 20 * sc, W + 20, gy - 10 * sc);
      ctx.lineTo(W + 20, H + 40); ctx.lineTo(-20, H + 40); ctx.fill();
      ctx.fillStyle = '#3bb565'; ctx.fillRect(-20, gy + 18 * sc, W + 40, H);
      ctx.fillStyle = '#8af0a8';
      for (let i = 0; i < 9; i++) { const fx = ((i * 137) % 100) / 100 * W; ctx.beginPath(); ctx.arc(fx, gy + 30 * sc + (i % 3) * 10 * sc, 4 * sc, 0, 7); ctx.fill(); }
    }
    // torre
    const vis0 = Math.max(0, Math.floor((cam - 80) / BH));
    for (let i = vis0; i < tower.length; i++) {
      const b = tower[i];
      const y = blockScreenY(i);
      if (y > H + 50) continue;
      drawBlock(b.x, y, b.w, i, b.squash, i === tower.length - 1 && !mover, false);
    }
    // aros de acerto perfeito
    for (const r of rings) {
      const k = r.t / 0.6;
      const y = blockScreenY(r.i);
      const grow = 1 + easeOut(k) * 0.35;
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4 * sc;
      const w = r.w * sc * grow, hh = BH * sc * grow;
      rrect(W / 2 + r.x * sc - w / 2, y + BH * sc / 2 - hh / 2, w, hh, 10 * sc); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // bloco que desliza (com carinha)
    if (mover) drawBlock(mover.x, blockScreenY(tower.length), mover.w, tower.length, mover.squash * 0.6, true, true);
    // pedaços cortados caindo
    for (const d of debris) {
      const x = W / 2 + d.x * sc, y = groundY - d.y * sc + cam * sc;
      ctx.save(); ctx.translate(x, y); ctx.rotate(d.rot);
      ctx.fillStyle = 'hsl(' + d.hue + ',85%,62%)'; rrect(-d.w * sc / 2, -BH * sc / 2, d.w * sc, BH * sc, 8 * sc); ctx.fill();
      ctx.fillStyle = 'hsl(' + d.hue + ',75%,48%)'; ctx.fillRect(-d.w * sc / 2 + 4 * sc, BH * sc * 0.18, Math.max(0, d.w * sc - 8 * sc), BH * sc * 0.18);
      if (d.face) face(0, 0, d.w * sc, BH * sc, true, d.vx > 0 ? 1 : -1);
      ctx.restore();
    }
    // brilho na tela
    if (flash > 0 && !reduceMotion) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.25 + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
    drawParts();
    if (fontsReady) for (const p of pops) {
      const k = p.t;
      ctx.globalAlpha = 1 - k * k;
      const yy = p.y - easeOut(k) * 50;
      const f = FT(p.big ? clamp(22 * sc, 15, 28) : clamp(18 * sc, 13, 22));
      ctx.font = f; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#2d1b4e'; ctx.lineJoin = 'round'; ctx.strokeText(p.s, clamp(p.x, 90, W - 90), yy);
      ctx.fillStyle = p.big ? '#fff36b' : '#ffffff'; ctx.fillText(p.s, clamp(p.x, 90, W - 90), yy);
    }
    ctx.globalAlpha = 1;
  },
  drawUI() {
    if (state === 'menu') {
      drawCard({dim: 0.12, kicker: 'Karma Games', title: 'Torre de Blocos', lines: ['Solte o bloco na hora certa.', 'O que passar da borda cai fora!'], cta: coarse ? 'Toque para começar' : 'Aperte Espaço para começar', hint: coarse ? 'Toque na tela para soltar o bloco' : 'Espaço, clique ou toque para soltar · P pausa · M som'});
      return;
    }
    hudStat('Pontos', score, 24, 16, 'left', COL.acc);
    hudStat('Altura', tower.length - 1, W / 2, 16, 'center');
    if (W > 380) hudStat('Recorde', Math.max(best, score), W - 76, 16, 'right');
    if (state === 'over') {
      drawCard({kicker: newRecord ? 'Novo recorde!' : 'A torre caiu', title: 'Fim de jogo', big: lastScore, rows: [['Recorde', String(best)], ['Altura', (tower.length - 1) + (tower.length === 2 ? ' bloco' : ' blocos')], ['Perfeitos', String(perfects)]], cta: 'Jogar de novo', hint: coarse ? 'Toque para jogar de novo' : 'Enter ou Espaço para jogar de novo'});
    }
  }
};

function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2); }
function mixC(a, b, t) { t = clamp(t, 0, 1); return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')'; }
function cloud(x, y, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  circ(x, y, r * 0.6); circ(x - r * 0.6, y + r * 0.15, r * 0.45); circ(x + r * 0.6, y + r * 0.12, r * 0.5); circ(x + r * 0.15, y - r * 0.3, r * 0.5);
  ctx.fill();
}
function face(cx, cy, w, h, worried, look) {
  const s = Math.min(h, w * 0.6);
  const ex = Math.min(w * 0.2, s * 0.55);
  const lk = (look || 0) * s * 0.05;
  const blink = !reduceMotion && (perfNow % 3.4) < 0.12;
  for (const k of [-1, 1]) {
    const x = cx + k * ex;
    ctx.fillStyle = '#2d1b4e';
    if (blink) { ctx.fillRect(x - s * 0.1, cy - s * 0.05, s * 0.2, s * 0.06); continue; }
    ctx.beginPath(); ctx.ellipse(x + lk, cy - s * 0.05, s * 0.1, s * 0.13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + lk + s * 0.035, cy - s * 0.1, s * 0.04, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,90,140,0.55)';
  ctx.beginPath(); ctx.ellipse(cx - ex - s * 0.18, cy + s * 0.12, s * 0.1, s * 0.06, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + ex + s * 0.18, cy + s * 0.12, s * 0.1, s * 0.06, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#2d1b4e'; ctx.lineWidth = Math.max(1.5, s * 0.06); ctx.lineCap = 'round';
  ctx.beginPath();
  if (worried) ctx.ellipse(cx, cy + s * 0.2, s * 0.07, s * 0.09, 0, 0, 7);
  else ctx.arc(cx, cy + s * 0.08, s * 0.1, 0.25, Math.PI - 0.25);
  ctx.stroke();
}
function drawBlock(x, y, w, i, squash, withFace, isMover) {
  const sq = reduceMotion ? 0 : squash;
  const bw = w * sc * (1 + sq * 0.12), bh = BH * sc * (1 - sq * 0.22);
  const bx = W / 2 + x * sc - bw / 2, by = y + BH * sc - bh;
  const r = Math.min(9 * sc, bw / 2);
  ctx.fillStyle = 'rgba(45,27,78,0.18)'; rrect(bx + 4 * sc, by + 4 * sc, bw, bh, r); ctx.fill();
  ctx.fillStyle = blockColor(i, 50); rrect(bx, by, bw, bh, r); ctx.fill();
  ctx.fillStyle = blockColor(i, 64); rrect(bx, by, bw, bh - 5 * sc, r); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; rrect(bx + 6 * sc, by + 4 * sc, Math.max(0, bw - 12 * sc), 5 * sc, 3 * sc); ctx.fill();
  if (withFace && bw > 30) face(bx + bw / 2, by + bh / 2, bw, bh, false, isMover && mover ? mover.dir : 0);
}

/* ---------- Laço, redimensionamento e entrada ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width || window.innerWidth));
  H = Math.max(1, Math.round(r.height || window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutPauseBtn();
  GAME.resize();
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function canPause() { return state === 'play'; }
function pause() { if (canPause()) { setState('paused'); if (GAME.onPause) GAME.onPause(); } }
function resume() { if (state === 'paused') { state = 'play'; if (GAME.onResume) GAME.onResume(); } }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];
window.addEventListener('keydown', e => {
  const k = e.key;
  if (GAME_KEYS.indexOf(k) >= 0 || e.code === 'Space') e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  unlockAudio();
  if ((k === 'm' || k === 'M') && !e.repeat) { toggleMute(); return; }
  const isStart = k === ' ' || k === 'Enter' || e.code === 'Space';
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'paused') resume(); else pause();
    return;
  }
  if (state === 'paused') { if (!e.repeat) resume(); return; }
  if (state === 'menu') { if (isStart && fontsReady) GAME.start(); return; }
  if (state === 'over') { if (isStart && stateT > 0.5 && !e.repeat) GAME.start(); return; }
  if (GAME.key) GAME.key(e, true);
}, {passive: false});
window.addEventListener('keyup', e => { if (GAME.key) GAME.key(e, false); });

function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus({preventScroll: true}); } catch (err) {}
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  unlockAudio();
  const [x, y] = ptr(e);
  if (state === 'paused') { resume(); return; }
  if (state === 'menu') { if (fontsReady) GAME.start(x, y); return; }
  if (state === 'over') { if (stateT > 0.5) GAME.start(x, y); return; }
  if (state === 'play' && hitPause(x, y)) { pause(); return; }
  if (GAME.pointer) GAME.pointer('down', x, y, e);
}, {passive: false});
cv.addEventListener('pointermove', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('move', x, y, e); });
cv.addEventListener('pointerup', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('up', x, y, e); });
cv.addEventListener('pointercancel', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('cancel', x, y, e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  perfNow = now;
  stateT += dt;
  if (state !== 'paused') { GAME.update(dt); updateParts(dt); }
  if (muteToast > 0) muteToast -= dt;
  if (shakeT > 0 && state !== 'paused') shakeT = Math.max(0, shakeT - dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / shakeDur, m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  GAME.draw();
  ctx.restore();
  if (fontsReady) {
    GAME.drawUI();
    if (state === 'play' || state === 'paused') drawPauseBtn();
    drawMuteToast();
    if (state === 'paused') drawCard({title: 'Pausado', lines: [coarse ? 'Toque para continuar' : 'Aperte qualquer tecla para continuar'], hint: coarse ? '' : 'P ou Esc pausa e retoma'});
  }
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
