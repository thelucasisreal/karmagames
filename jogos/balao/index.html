<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd3ff">
<title>Estoura Balão · Karma Games</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:800;font-display:swap;src:url("../../assets/fonts/unbounded-latin-800-normal.woff2") format("woff2")}
@font-face{font-family:"Geist";font-style:normal;font-weight:500;font-display:swap;src:url("../../assets/fonts/geist-sans-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#7fd3ff;overscroll-behavior:none}
body{position:fixed;inset:0}
canvas{display:block;width:100%;height:100vh;height:100dvh;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:default}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Estoura Balão"></canvas>
<script>
const SLUG = 'balao';
window.THEME = {bg:'#7fd3ff', acc:'#ff4f8b', accDark:'#e0306c', accText:'#ffffff'};
(() => {
'use strict';
/* ---------- Núcleo compartilhado (Karma Games) ---------- */
const COL = Object.assign({bg:'#0d0e12', surf:'#ffffff', line:'#eadff5', text:'#2a1b3d', muted:'#6e5d82', acc:'#ff5aa5', accText:'#ffffff', coral:'#ff6b5a', sky:'#5ac8ff', shadow:'rgba(42,27,61,0.28)', hud:'#ffffff', hudShadow:'rgba(42,27,61,0.45)'}, window.THEME || {});
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const reduceMotion = mq('(prefers-reduced-motion: reduce)');
const coarse = mq('(pointer: coarse)') || ('ontouchstart' in window);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const FT = s => '800 ' + Math.round(s) + 'px Unbounded, system-ui, sans-serif';
const FS = s => '500 ' + Math.round(s) + 'px Geist, system-ui, sans-serif';

/* Recorde */
const KEY = 'karma:' + SLUG + ':recorde';
function loadBest() { try { const v = parseInt(window.localStorage.getItem(KEY), 10); return isFinite(v) && v > 0 ? v : 0; } catch (e) { return 0; } }
function saveBest(v) { try { window.localStorage.setItem(KEY, String(v)); } catch (e) {} }
let best = loadBest();

/* Fontes: espera antes do primeiro texto no canvas */
let fontsReady = false;
(function () {
  let done = false;
  const finish = () => { if (!done) { done = true; fontsReady = true; } };
  setTimeout(finish, 1500);
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('800 32px Unbounded'), document.fonts.load('500 16px Geist')])
        .then(() => document.fonts.ready).then(finish, finish);
    } else finish();
  } catch (e) { finish(); }
})();

/* Som (WebAudio, só depois da primeira interação; M para mudo) */
let actx = null, muted = false, muteFlash = 0;
try { muted = window.localStorage.getItem('karma:som') === '0'; } catch (e) {}
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } catch (e) { actx = null; }
}
function beep(freq, dur, type, vol, slide) {
  if (muted || !actx) return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime((vol || 0.12), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function toggleMute() { muted = !muted; muteFlash = 1.2; try { window.localStorage.setItem('karma:som', muted ? '0' : '1'); } catch (e) {} }

/* Estado */
let state = 'menu';         // menu | play | paused | over (+ estados próprios do jogo)
let stateT = 0;             // tempo no estado atual
let newRecord = false;
let lastScore = 0;
function setState(s) { state = s; stateT = 0; }
function finishGame(score) {
  lastScore = score;
  newRecord = score > best && score > 0;
  if (newRecord) { best = score; saveBest(best); }
  setState('over');
}

/* Tremor de tela */
let shakeT = 0, shakeDur = 1, shakeMag = 0;
function shake(mag, dur) {
  if (reduceMotion) return;
  if (mag >= shakeMag * (shakeT / shakeDur)) { shakeMag = mag; shakeDur = dur; shakeT = dur; }
}

/* Partículas (coordenadas do jogo) */
const parts = [];
function burst(x, y, n, color, speed, life, size, grav) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
    parts.push({x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color: Array.isArray(color) ? color[(Math.random() * color.length) | 0] : color, g: grav || 0, round: Math.random() < 0.5});
  }
  if (parts.length > 500) parts.splice(0, parts.length - 500);
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt);
    p.vy += p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
}
function drawParts(scale) {
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    const s = p.size * (0.4 + 0.6 * k) * (scale || 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    if (p.round) { ctx.beginPath(); ctx.arc(p.x, p.y, s / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

/* Textos flutuantes (+10, -20...) */
const pops = [];
function pop(x, y, s, color, size) { pops.push({x, y, s, color: color || COL.hud, size: size || 26, t: 0}); }
function updatePops(dt) { for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.8) pops.splice(i, 1); } }
function drawPops() {
  if (!fontsReady) return;
  for (const p of pops) {
    const k = p.t / 0.8;
    const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
    ctx.globalAlpha = 1 - k * k;
    const y = p.y - easeOut(k) * 50;
    ctx.font = FT(p.size * sc); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, p.size * 0.22); ctx.strokeStyle = COL.text;
    ctx.strokeText(p.s, p.x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.s, p.x, y);
  }
  ctx.globalAlpha = 1;
}

/* Desenho utilitário */
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function txt(s, x, y, font, color, align, base) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.fillText(s, x, y);
}
function otxt(s, x, y, font, color, stroke, lw, align, base) {
  ctx.font = font; ctx.textAlign = align || 'center'; ctx.textBaseline = base || 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fitFont(s, maxW, size, maker) {
  ctx.font = maker(size);
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(10, size * maxW / w) : size;
}
function ellipse(x, y, rx, ry, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, 7); ctx.fill(); }
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, 7); ctx.fill(); }

/* Botão de pausa (toque) */
const pauseBtn = {x: 0, y: 0, s: 40};
function layoutPauseBtn() { pauseBtn.s = 40; pauseBtn.x = W - pauseBtn.s - 12; pauseBtn.y = 10; }
function hitPause(x, y) { const b = pauseBtn; return x >= b.x - 6 && x <= b.x + b.s + 6 && y >= b.y - 6 && y <= b.y + b.s + 6; }
function drawPauseBtn() {
  const b = pauseBtn;
  ctx.fillStyle = COL.shadow; rrect(b.x + 2, b.y + 3, b.s, b.s, 12); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(b.x, b.y, b.s, b.s, 12); ctx.fill();
  ctx.fillStyle = COL.text;
  rrect(b.x + b.s * 0.33, b.y + b.s * 0.28, b.s * 0.12, b.s * 0.44, 2); ctx.fill();
  rrect(b.x + b.s * 0.55, b.y + b.s * 0.28, b.s * 0.12, b.s * 0.44, 2); ctx.fill();
}

/* Cartão de tela (início / pausa / fim) */
function drawCard(o) {
  ctx.fillStyle = 'rgba(42,27,61,' + (o.dim == null ? 0.5 : o.dim) + ')';
  ctx.fillRect(0, 0, W, H);
  const cw = Math.min(W - 32, 440);
  const pad = cw < 340 ? 22 : 30;
  const inner = cw - pad * 2;
  let ts = fitFont(o.title, inner, cw < 340 ? 30 : 38, FT);
  const rows = o.rows || [];
  const lines = o.lines || [];
  let h = pad + ts * 1.15;
  if (o.kicker) h += 22;
  if (o.big != null) h += 78;
  h += rows.length * 34 + (rows.length ? 12 : 0);
  h += lines.length * 24 + (lines.length ? 14 : 0);
  if (o.cta) h += 62;
  if (o.hint) h += 30;
  h += pad - 6;
  const cx = (W - cw) / 2;
  const pop = reduceMotion ? 1 : easeOut(clamp(stateT / 0.28, 0, 1));
  const cy = Math.max(12, (H - h) / 2) + (1 - pop) * 30;
  ctx.globalAlpha = 0.3 + 0.7 * pop;
  ctx.fillStyle = COL.shadow; rrect(cx + 6, cy + 9, cw, h, 24); ctx.fill();
  ctx.fillStyle = COL.surf; rrect(cx, cy, cw, h, 24); ctx.fill();
  ctx.strokeStyle = COL.acc; ctx.lineWidth = 4; rrect(cx + 2, cy + 2, cw - 4, h - 4, 22); ctx.stroke();
  let y = cy + pad;
  if (o.kicker) { txt(o.kicker.toUpperCase(), W / 2, y + 6, FS(12), o.kickerColor || COL.accDark || COL.acc); y += 22; }
  txt(o.title, W / 2, y + ts * 0.55, FT(ts), COL.text); y += ts * 1.15;
  if (o.big != null) {
    otxt(String(o.big), W / 2, y + 40, FT(fitFont(String(o.big), inner, 56, FT)), COL.acc, COL.text, 7); y += 78;
  }
  if (rows.length) {
    y += 6;
    for (const r of rows) {
      ctx.strokeStyle = COL.line; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx + pad, y + 0.5); ctx.lineTo(cx + cw - pad, y + 0.5); ctx.stroke();
      txt(r[0], cx + pad, y + 18, FS(15), COL.muted, 'left');
      txt(r[1], cx + cw - pad, y + 18, FT(16), r[2] || COL.text, 'right');
      y += 34;
    }
    y += 6;
  }
  if (lines.length) {
    y += 6;
    for (const l of lines) { txt(l, W / 2, y + 10, FS(fitFont(l, inner, 15, FS)), COL.muted); y += 24; }
    y += 8;
  }
  if (o.cta) {
    const bw = Math.min(inner, 300), bh = 50, bx = (W - bw) / 2, by = y + 6;
    const pulse = reduceMotion ? 0 : (Math.sin(perfNow * 4) * 0.5 + 0.5);
    ctx.fillStyle = COL.text; rrect(bx, by + 5, bw, bh, 16); ctx.fill();
    ctx.fillStyle = COL.acc; rrect(bx, by - pulse * 2, bw, bh, 16); ctx.fill();
    txt(o.cta, W / 2, by + bh / 2 - pulse * 2 + 1, FT(fitFont(o.cta, bw - 24, 15, FT)), COL.accText);
    y += 62;
  }
  if (o.hint) { txt(o.hint, W / 2, y + 14, FS(fitFont(o.hint, inner, 13, FS)), COL.muted); y += 30; }
  ctx.globalAlpha = 1;
}

/* HUD: rótulo pequeno + valor (com contorno, legível em fundo colorido) */
function hudStat(label, value, x, y, align, color) {
  otxt(label.toUpperCase(), x, y, FT(11), COL.hud, COL.hudShadow, 4, align, 'top');
  otxt(String(value), x, y + 16, FT(24), color || COL.hud, COL.text, 6, align, 'top');
}
function drawMuteNote() {
  if (muteFlash <= 0 || !fontsReady) return;
  ctx.globalAlpha = clamp(muteFlash, 0, 1);
  otxt(muted ? 'Som desligado (M)' : 'Som ligado (M)', W / 2, H - 28, FT(14), COL.hud, COL.text, 5);
  ctx.globalAlpha = 1;
}

let perfNow = 0;

/* ---------- Estoura Balão ---------- */
const CORES = ['#ff4f6d', '#ff9f1c', '#3ec1ff', '#8b5cf6', '#4fd67a', '#ff6fd0'];
const VIDAS = 5;
let balloons = [], clouds = [], score = 0, lives = VIDAS, popped = 0, elapsed = 0, spawnT = 0, loseFlash = 0, combo = 0, comboT = 0;
let aim = {x: 0, y: 0, on: false}, keys = {};
let R = 40;

function layout() {
  R = clamp(Math.min(W, H) * 0.065, 28, 54);
  clouds = [];
  for (let i = 0; i < 7; i++) clouds.push({x: rand(-50, W), y: rand(H * 0.05, H * 0.75), s: rand(0.5, 1.3), v: rand(5, 18)});
  if (!aim.on) { aim.x = W / 2; aim.y = H / 2; }
}
function reset() {
  balloons = []; score = 0; lives = VIDAS; popped = 0; elapsed = 0; spawnT = 0.3; loseFlash = 0; combo = 0;
  parts.length = 0; pops.length = 0;
}
function diff() { return clamp(elapsed / 90, 0, 1); }
function spawn(demo) {
  const gold = !demo && Math.random() < 0.08;
  const r = R * rand(0.88, 1.12) * (gold ? 0.9 : 1);
  const d = demo ? 0.1 : diff();
  const sp = (H / 600) * lerp(75, 210, d) * rand(0.8, 1.2) * (gold ? 1.3 : 1);
  balloons.push({
    x: rand(r * 1.3, W - r * 1.3), y: H + r * 1.6, r, vy: sp,
    color: gold ? '#ffcc2e' : CORES[(Math.random() * CORES.length) | 0], gold,
    ph: rand(0, 6), sway: rand(10, 26), t: 0, squash: 0
  });
}
function lighten(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.round(c + (255 - c) * k);
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function bx(b) { return b.x + (reduceMotion ? 0 : Math.sin(b.t * 1.6 + b.ph) * b.sway); }
function tryPop(x, y) {
  let hit = null, bd = 1e9;
  for (const b of balloons) {
    const dx = x - bx(b), dy = y - (b.y - b.r * 0.1);
    const d = Math.hypot(dx / 1.0, dy / 1.15);
    if (d < b.r * 1.3 && d < bd) { bd = d; hit = b; }
  }
  if (!hit) { combo = 0; beep(180, 0.05, 'triangle', 0.05); return; }
  balloons.splice(balloons.indexOf(hit), 1);
  popped++;
  combo = comboT > 0 ? combo + 1 : 1; comboT = 0.6;
  const pts = (hit.gold ? 5 : 1) + (combo >= 3 ? 1 : 0);
  score += pts;
  const x0 = bx(hit), y0 = hit.y;
  burst(x0, y0, 22, [hit.color, lighten(hit.color, 0.5), '#ffffff'], hit.r * 11, 0.6, hit.r * 0.28, 500);
  if (hit.gold) burst(x0, y0, 16, ['#fff3a0', '#ffffff', '#ffcc2e'], hit.r * 14, 0.8, hit.r * 0.22, 100);
  pop(x0, y0 - hit.r * 0.3, '+' + pts, hit.gold ? '#ffcc2e' : '#ffffff', hit.gold ? 34 : 28);
  rings.push({x: x0, y: y0, r: hit.r, t: 0, c: hit.color});
  shake(hit.gold ? 6 : 3, 0.12);
  beep(hit.gold ? 990 : rand(560, 760), 0.07, 'square', 0.1, 220);
  if (hit.gold) setTimeout(() => beep(1320, 0.08, 'triangle', 0.08), 70);
}
const rings = [];

/* Desenho */
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#5ab8ff'); g.addColorStop(0.6, '#a6dcff'); g.addColorStop(1, '#ffd6ec');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sol
  circle(W * 0.86, H * 0.16, Math.min(W, H) * 0.12, 'rgba(255,240,150,0.35)');
  circle(W * 0.86, H * 0.16, Math.min(W, H) * 0.08, '#ffe873');
  for (const c of clouds) {
    const s = c.s * 26;
    ctx.globalAlpha = 0.85;
    circle(c.x, c.y + s * 0.3, s, '#ffffff'); circle(c.x + s, c.y, s * 1.25, '#ffffff'); circle(c.x + s * 2.1, c.y + s * 0.35, s * 0.9, '#ffffff');
    ctx.fillStyle = '#ffffff'; rrect(c.x, c.y + s * 0.2, s * 2.2, s * 1.1, s * 0.5); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // colinas lá embaixo
  ctx.fillStyle = '#7fdc72';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 30; x += 30) ctx.lineTo(x, H - 34 - Math.sin(x * 0.01) * 14 - Math.sin(x * 0.027) * 6);
  ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = '#5ec456';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 30; x += 30) ctx.lineTo(x, H - 16 - Math.sin(x * 0.014 + 2) * 8);
  ctx.lineTo(W, H); ctx.fill();
}
function drawBalloon(b) {
  const x = bx(b), y = b.y, r = b.r;
  const wob = reduceMotion ? 0 : Math.sin(b.t * 5 + b.ph) * 0.04;
  const sx = 1 + wob, sy = 1 - wob;
  // fio
  ctx.strokeStyle = 'rgba(43,23,71,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x, y + r * 1.15);
  const sw = reduceMotion ? 0 : Math.sin(b.t * 3 + b.ph) * r * 0.25;
  ctx.bezierCurveTo(x + sw, y + r * 1.6, x - sw, y + r * 2.1, x + sw * 0.5, y + r * 2.6);
  ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  // nozinho
  ctx.fillStyle = b.color; ctx.beginPath(); ctx.moveTo(0, r * 1.02); ctx.lineTo(-r * 0.16, r * 1.2); ctx.lineTo(r * 0.16, r * 1.2); ctx.closePath(); ctx.fill();
  // corpo
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.92, r * 1.06, 0, 0, 7);
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  g.addColorStop(0, lighten(b.color, 0.45)); g.addColorStop(0.5, b.color); g.addColorStop(1, b.color);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(43,23,71,0.35)'; ctx.stroke();
  // brilho
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.ellipse(-r * 0.42, -r * 0.5, r * 0.14, r * 0.26, -0.5, 0, 7); ctx.fill();
  // rostinho
  const worried = y < H * 0.3 && state === 'play';
  const ey = -r * 0.08;
  for (const s of [-1, 1]) {
    circle(s * r * 0.3, ey, r * 0.17, '#ffffff');
    circle(s * r * 0.3 + (worried ? 0 : r * 0.03), ey + (worried ? -r * 0.05 : r * 0.03), r * 0.1, '#2b1747');
    circle(s * r * 0.3 - r * 0.04, ey - r * 0.04, r * 0.035, '#ffffff');
  }
  ctx.globalAlpha = 0.5;
  ellipse(-r * 0.52, ey + r * 0.24, r * 0.13, r * 0.08, '#ff3b7a'); ellipse(r * 0.52, ey + r * 0.24, r * 0.13, r * 0.08, '#ff3b7a');
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#2b1747'; ctx.lineWidth = Math.max(2, r * 0.07); ctx.lineCap = 'round';
  ctx.beginPath();
  if (worried) ctx.arc(0, ey + r * 0.42, r * 0.12, Math.PI * 1.1, Math.PI * 1.9);
  else ctx.arc(0, ey + r * 0.16, r * 0.15, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
  if (b.gold) {
    const tw = reduceMotion ? 1 : Math.sin(b.t * 9) * 0.5 + 0.5;
    star(r * 0.62, -r * 0.72, r * (0.12 + tw * 0.1), '#ffffff');
    star(-r * 0.7, r * 0.45, r * (0.08 + (1 - tw) * 0.08), '#ffffff');
  }
  ctx.restore();
}
function star(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function heart(x, y, s, full) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s * 0.9, -s * 0.25, -s * 0.45, -s * 0.95, 0, -s * 0.45);
  ctx.bezierCurveTo(s * 0.45, -s * 0.95, s * 0.9, -s * 0.25, 0, s * 0.35);
  ctx.closePath();
  ctx.lineWidth = 4; ctx.strokeStyle = '#2b1747'; ctx.stroke();
  ctx.fillStyle = full ? '#ff4f6d' : 'rgba(255,255,255,0.6)'; ctx.fill();
  if (full) { ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-s * 0.3, -s * 0.38, s * 0.1, s * 0.14, -0.6, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawAim() {
  if (!aim.on || state !== 'play') return;
  ctx.strokeStyle = '#2b1747'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(aim.x, aim.y, 16, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(aim.x, aim.y, 16, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(aim.x - 24, aim.y); ctx.lineTo(aim.x - 8, aim.y); ctx.moveTo(aim.x + 8, aim.y); ctx.lineTo(aim.x + 24, aim.y);
  ctx.moveTo(aim.x, aim.y - 24); ctx.lineTo(aim.x, aim.y - 8); ctx.moveTo(aim.x, aim.y + 8); ctx.lineTo(aim.x, aim.y + 24); ctx.stroke();
}

const GAME = {
  resize() { layout(); },
  start() { reset(); setState('play'); beep(660, 0.08, 'square', 0.08, 990); },
  key(e, down) {
    const k = e.key;
    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' || 'wasdWASD'.indexOf(k) >= 0 && k.length === 1) {
      keys[k.toLowerCase()] = down;
      if (down) aim.on = true;
    }
    if (down && state === 'play' && !e.repeat && (k === ' ' || e.code === 'Space' || k === 'Enter')) { aim.on = true; tryPop(aim.x, aim.y); }
  },
  pointer(type, x, y) {
    if (type === 'down' && state === 'play') { aim.on = false; aim.x = x; aim.y = y; tryPop(x, y); }
  },
  update(dt) {
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 20) { c.x = -90; c.y = rand(H * 0.05, H * 0.75); } }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > 0.35) rings.splice(i, 1); }
    loseFlash = Math.max(0, loseFlash - dt * 2.5);
    comboT -= dt;
    // mira por teclado
    const ks = 520 * dt;
    if (keys.arrowleft || keys.a) aim.x -= ks;
    if (keys.arrowright || keys.d) aim.x += ks;
    if (keys.arrowup || keys.w) aim.y -= ks;
    if (keys.arrowdown || keys.s) aim.y += ks;
    aim.x = clamp(aim.x, 0, W); aim.y = clamp(aim.y, 0, H);

    if (state !== 'paused') {
      if (state === 'play') elapsed += dt;
      spawnT -= dt;
      if (spawnT <= 0 && state !== 'ending') {
        spawn(state !== 'play');
        spawnT = state !== 'play' ? rand(0.6, 1.1) : lerp(1.0, 0.36, diff()) * rand(0.75, 1.25);
      }
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.t += dt; b.y -= b.vy * dt;
        if (b.y < -b.r * 1.3) {
          balloons.splice(i, 1);
          if (state === 'play') {
            lives--; loseFlash = 1; combo = 0;
            shake(8, 0.25);
            burst(clamp(bx(b), 20, W - 20), 6, 10, ['#ff4f6d', '#ffffff'], 300, 0.5, 8, 400);
            beep(220, 0.25, 'sawtooth', 0.12, 110);
            if (lives <= 0) { lives = 0; setState('ending'); beep(330, 0.3, 'square', 0.1, 120); }
          }
        }
      }
    }
    if (state === 'ending' && stateT > 1.0) finishGame(score);
  },
  draw() {
    drawBg();
    for (const b of balloons) drawBalloon(b);
    for (const r of rings) {
      const k = r.t / 0.35;
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.8 + k * 0.9), 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (loseFlash > 0) {
      const g = ctx.createLinearGradient(0, 0, 0, 90);
      g.addColorStop(0, 'rgba(255,60,90,' + (0.55 * loseFlash) + ')'); g.addColorStop(1, 'rgba(255,60,90,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, 90);
    }
  },
  drawUI() {
    if (state === 'menu') {
      drawCard({dim: 0.3, kicker: 'Karma Games', title: 'Estoura Balão', lines: ['Estoure os balões antes que eles fujam!', 'Os dourados valem 5 pontos.'], cta: coarse ? 'Toque para começar' : 'Aperte Espaço para começar', hint: coarse ? 'Toque nos balões · 5 vidas' : 'Clique nos balões ou use setas e Espaço · P pausa · M som'});
      return;
    }
    drawAim();
    hudStat('Pontos', score, 16, 12, 'left', '#ffd23f');
    hudStat('Recorde', Math.max(best, score), W - 66, 12, 'right');
    const hs = W < 420 ? 15 : 19, gap = hs * 2.3, hx = W / 2 - gap * (VIDAS - 1) / 2;
    for (let i = 0; i < VIDAS; i++) {
      const lost = i >= lives;
      const bump = (!lost && i === lives - 1 && loseFlash > 0 && !reduceMotion) ? 1 + loseFlash * 0.3 : 1;
      heart(hx + i * gap, 34, hs * bump, !lost);
    }
    if (state === 'ending') otxt('Acabaram as vidas!', W / 2, H / 2, FT(fitFont('Acabaram as vidas!', W - 40, 44, FT)), '#ffffff', COL.text, 9);
    if (state === 'over') {
      drawCard({kicker: newRecord ? 'Novo recorde!' : 'Estoura Balão', title: 'Fim de jogo', big: lastScore, rows: [['Recorde', String(best)], ['Balões estourados', String(popped)], ['Tempo', Math.floor(elapsed) + 's']], cta: 'Jogar de novo', hint: coarse ? 'Toque para jogar de novo' : 'Enter ou Espaço para jogar de novo'});
    }
  }
};


/* ---------- Laço, redimensionamento e entrada ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width || window.innerWidth));
  H = Math.max(1, Math.round(r.height || window.innerHeight));
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  layoutPauseBtn();
  GAME.resize();
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function canPause() { return state === 'play'; }
function pause() { if (canPause()) { setState('paused'); if (GAME.onPause) GAME.onPause(); } }
function resume() { if (state === 'paused') { state = 'play'; if (GAME.onResume) GAME.onResume(); } }

document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', () => pause());

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Spacebar'];
window.addEventListener('keydown', e => {
  const k = e.key;
  if (GAME_KEYS.indexOf(k) >= 0 || e.code === 'Space') e.preventDefault();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  unlockAudio();
  const isStart = k === ' ' || k === 'Enter' || e.code === 'Space';
  if (k === 'm' || k === 'M') { if (!e.repeat) toggleMute(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') {
    if (state === 'paused') resume(); else pause();
    return;
  }
  if (state === 'paused') { if (!e.repeat) resume(); return; }
  if (state === 'menu') { if (isStart && fontsReady && !e.repeat) GAME.start(); return; }
  if (state === 'over') { if (isStart && stateT > 0.6 && !e.repeat) GAME.start(); return; }
  if (GAME.key) GAME.key(e, true);
}, {passive: false});
window.addEventListener('keyup', e => { if (GAME.key) GAME.key(e, false); });

function ptr(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  try { cv.focus({preventScroll: true}); } catch (err) {}
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const [x, y] = ptr(e);
  if (state === 'paused') { resume(); return; }
  if (state === 'menu') { if (fontsReady) GAME.start(x, y); return; }
  if (state === 'over') { if (stateT > 0.6) GAME.start(x, y); return; }
  if (state === 'play' && hitPause(x, y)) { pause(); return; }
  if (GAME.pointer) GAME.pointer('down', x, y, e);
}, {passive: false});
cv.addEventListener('pointermove', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('move', x, y, e); });
cv.addEventListener('pointerup', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('up', x, y, e); });
cv.addEventListener('pointercancel', e => { const [x, y] = ptr(e); if (GAME.pointer) GAME.pointer('cancel', x, y, e); });
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const now = t / 1000;
  let dt = last ? now - last : 0;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  perfNow = now;
  stateT += dt;
  muteFlash = Math.max(0, muteFlash - dt);
  if (state !== 'paused') { GAME.update(dt); updateParts(dt); updatePops(dt); }
  if (shakeT > 0 && state !== 'paused') shakeT = Math.max(0, shakeT - dt);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / shakeDur, m = shakeMag * k * k;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  GAME.draw();
  drawParts();
  drawPops();
  if (GAME.drawTop && state !== 'paused') GAME.drawTop();
  ctx.restore();
  if (fontsReady) {
    GAME.drawUI();
    if (state === 'play' || state === 'paused') drawPauseBtn();
    if (state === 'paused') drawCard({title: 'Pausado', lines: [coarse ? 'Toque para continuar' : 'Aperte qualquer tecla para continuar'], hint: coarse ? '' : 'P ou Esc pausa e retoma · M liga ou desliga o som'});
    drawMuteNote();
  }
}
resize();
requestAnimationFrame(frame);
})();

</script>
